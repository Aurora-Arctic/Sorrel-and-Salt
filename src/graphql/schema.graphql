type Query {
  """
  The live categories by name, each under a live group: those whose name holds `query`, case-insensitively, and those filed under `groupId`, when given.
  """
  categories(after: String, before: String, first: Int, groupId: ID, last: Int, query: String): QueryCategoriesConnection!
  commonNameSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID): QueryCommonNameSuggestionsConnection!
  compendium(after: String, before: String, categoryIds: [ID!], first: Int, form: String, last: Int, nomenclature: Nomenclature, query: String, withoutReferences: Boolean): QueryCompendiumConnection!

  """
  The curated deities, each under a live tradition, by the tradition's name and then their own: those whose name holds `query`, case-insensitively, and those filed under `traditionId`, when given.
  """
  deities(after: String, before: String, first: Int, last: Int, query: String, traditionId: ID): QueryDeitiesConnection!
  deitySuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID): QueryDeitySuggestionsConnection!

  """
  The live traditions by name: the tradition a deity is filed under is picked from these.
  """
  deityTraditions(after: String, before: String, first: Int, last: Int): QueryDeityTraditionsConnection!
  formSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID): QueryFormSuggestionsConnection!
  ingredient(id: ID!, workspaceId: ID): Ingredient!

  """
  The live form groups by name: the group a form is filed under is picked from these.
  """
  ingredientFormGroups(after: String, before: String, first: Int, last: Int): QueryIngredientFormGroupsConnection!

  """
  The curated forms by name, each under a live group: those whose name holds `query`, case-insensitively, and those filed under `groupId`, when given.
  """
  ingredientFormValues(after: String, before: String, first: Int, groupId: ID, last: Int, query: String): QueryIngredientFormValuesConnection!
  ingredientSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryIngredientSuggestionsConnection!
  me: User!
  ok: Boolean!
  planetSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID): QueryPlanetSuggestionsConnection!

  """
  The curated planets by name: those whose name holds `query`, case-insensitively, when given.
  """
  planets(after: String, before: String, first: Int, last: Int, query: String): QueryPlanetsConnection!
  possibleDuplicates(after: String, before: String, first: Int, last: Int, name: String!, workspaceId: ID): QueryPossibleDuplicatesConnection!
  referenceSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID): QueryReferenceSuggestionsConnection!
  users(after: String, awaitingApproval: Boolean, before: String, first: Int, last: Int, query: String): QueryUsersConnection!

  """
  The curated zodiac signs by name: those whose name holds `query`, case-insensitively, when given.
  """
  zodiacSigns(after: String, before: String, first: Int, last: Int, query: String): QueryZodiacSignsConnection!
  zodiacSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID): QueryZodiacSuggestionsConnection!
}

