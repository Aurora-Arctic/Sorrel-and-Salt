"""
A local date string (i.e., with no associated timezone) in `YYYY-MM-DD` format, e.g. `2020-01-01`.
"""
scalar LocalDate

type Mutation {
  """
  Accepts the invitation a link's token names, as the signed-in account, which must hold the invited address, verified; answers it accepted.
  """
  acceptInvitation(token: String!): Invitation!

  """
  Accepts a pending coven invitation sent to the signed-in account's verified address, by its id, as the account page lists it; an admin invitation is accepted by its link alone.
  """
  acceptInvitationById(id: ID!): Invitation!

  """
  Adds a compendium entry to the coven's cupboard, with the overrides given. Creates no jar and no form; an entry the coven already holds is refused.
  """
  addCupboardEntry(ingredientId: ID!, input: CupboardEntryInput, workspaceId: ID!): CupboardEntry!

  """
  Starts the coven's jar of one form; a form it already holds is refused beside variantId.
  """
  addIngredientToWorkspace(input: StockInput!, variantId: ID!, workspaceId: ID!): InventoryItem!

  """
  Changes the coven's overrides: a field left out keeps its value, null hands it back to the compendium, and a list, even an empty one, is the coven's own.
  """
  annotateCupboardEntry(ingredientId: ID!, input: CupboardEntryInput!, workspaceId: ID!): CupboardEntry!

  """
  Makes a compendium entry the coven holds its own: a new own entry from the coven's reading of it, with copies of its forms, folk names, substitutes, categories, references and deities; its jars and spell layers move to the copy's forms of the same name, and the cupboard entry is removed. Works on an entry the compendium has retired. The compendium entry is not changed.
  """
  convertCompendiumEntryToLocal(ingredientId: ID!, workspaceId: ID!): ConvertedCompendium!

  """
  Invites an address to become a curator or an admin, mailing it the link; answers the invitation, never the link. Refused for an address already holding that role or a higher one, and while admin changes are paused, but to the primary admin.
  """
  createAdminInvitation(email: String!, note: String, siteRole: InvitableSiteRole!): Invitation!
  createCategory(input: CategoryInput!): Category!
  createCategoryGroup(input: CategoryGroupInput!): CategoryGroup!
  createCelestialBody(input: CelestialBodyInput!): CelestialBody!
  createCompendiumIngredient(
    """
    Confirms ending another entry's redirect from the address this write takes (MB.82).
    """
    endRedirect: Boolean
    input: CompendiumIngredientInput!
  ): Ingredient!
  createDeity(input: DeityInput!): Deity!
  createDeityTradition(input: DeityTraditionInput!): DeityTradition!
  createIngredientFormGroup(input: IngredientFormGroupInput!): IngredientFormGroup!
  createIngredientFormValue(input: IngredientFormValueInput!): IngredientFormValue!

  """
  Invites an address into a coven as a viewer or member, mailing it the link; answers the invitation, never the link. Owners only.
  """
  createInvitation(email: String!, role: InvitableRole!, workspaceId: ID!): Invitation!

  """A null workspaceId writes the compendium's, under the admin proof."""
  createReference(input: ReferenceInput!, workspaceId: ID): Reference!

  """Writes a new spell and its recipe in one save."""
  createSpell(input: SpellInput!, workspaceId: ID!): Spell!

  """
  Creates a coven with the caller as its owner. Refused for a user who may not create one.
  """
  createWorkspace(name: String!): Workspace!
  createWorkspaceIngredient(input: IngredientInput!, workspaceId: ID!): Ingredient!
  createZodiacSign(input: ZodiacSignInput!): ZodiacSign!

  """
  Declines a pending coven invitation sent to the signed-in account's verified address, by its id, as the account page lists it; its link then says it was declined, and the coven's owner sees it declined until they remove it.
  """
  declineInvitationById(id: ID!): Invitation!

  """
  A soft delete, refused while a live compendium entry is filed under it; a coven keeps its links.
  """
  deleteCategory(id: ID!): ID!

  """
  A soft delete; the live categories under it move to `moveTo` first, which they need when there are any.
  """
  deleteCategoryGroup(id: ID!, moveTo: ID): ID!

  """
  A soft delete, refused while a live compendium entry lists the celestial body; a coven keeps what it wrote.
  """
  deleteCelestialBody(id: ID!): ID!

  """A soft delete; a spell holding the entry still reaches it."""
  deleteCompendiumIngredient(id: ID!): ID!

  """
  A soft delete, refused while a live compendium entry picked the deity; a coven keeps its pick.
  """
  deleteDeity(id: ID!): ID!

  """
  A soft delete; the live deities under it move to `moveTo` first, re-slugged there, which they need when there are any.
  """
  deleteDeityTradition(id: ID!, moveTo: ID): ID!
  deleteIngredient(id: ID!, workspaceId: ID!): ID!

  """
  A soft delete; the live forms under it move to `moveTo` first, re-slugged there, which they need when there are any.
  """
  deleteIngredientFormGroup(id: ID!, moveTo: ID): ID!

  """
  A soft delete, refused while a live compendium entry picked the form; a coven keeps its pick.
  """
  deleteIngredientFormValue(id: ID!): ID!

  """
  Soft-deletes a spell and its steps together; the spell's stock is untouched.
  """
  deleteSpell(id: ID!, workspaceId: ID!): ID!

  """A soft delete of the jar; the entry stays."""
  deleteStock(id: ID!, workspaceId: ID!): ID!

  """
  Deletes a coven, which no member can reach afterwards. Owners only; nothing is destroyed, so it can be restored by hand.
  """
  deleteWorkspace(workspaceId: ID!): Boolean!

  """
  A soft delete, refused while a live compendium entry lists the sign; a coven keeps what it wrote.
  """
  deleteZodiacSign(id: ID!): ID!

  """Lets a user with no invitation create a coven. Refused once they may."""
  grantWorkspaceCreation(note: String, userId: ID!): User!

  """
  Takes the caller out of a coven, whatever their role. Only the caller's own membership; refused when they are its only owner.
  """
  leaveWorkspace(workspaceId: ID!): Boolean!

  """
  Pauses admin grants and revokes for every admin but the primary one; answers true, paused. The primary admin alone may.
  """
  pauseAdminRoleChanges: Boolean!

  """
  Makes a common name the ingredient's display name, and the old display name a common name. A null workspaceId names a compendium entry, under the admin proof.
  """
  promoteFolkName(folkNameId: ID!, id: ID!, workspaceId: ID): Ingredient!

  """
  Takes the entry out of the coven's cupboard; refused while the coven holds a jar of any of its forms.
  """
  removeCupboardEntry(ingredientId: ID!, workspaceId: ID!): ID!

  """
  Removes a member from a coven, who can no longer reach it. Owners only; refused when it would leave the coven without an owner.
  """
  removeMember(userId: ID!, workspaceId: ID!): Boolean!

  """
  Ends the pause on admin grants and revokes; answers false, not paused. The primary admin alone may.
  """
  resumeAdminRoleChanges: Boolean!

  """
  Withdraws a pending admin invitation, so its link says so. Refused while admin changes are paused, but to the primary admin.
  """
  revokeAdminInvitation(id: ID!): Invitation!

  """
  Withdraws a pending invitation of a coven, so its link says so; the row is kept. Refused for an invitation already accepted, which is a member to remove. Owners only.
  """
  revokeInvitation(id: ID!, workspaceId: ID!): Invitation!

  """
  Stops a user creating covens; those they own stay theirs. Refused for an admin, and for a user who cannot.
  """
  revokeWorkspaceCreation(note: String, userId: ID!): User!

  """
  Creates, changes and deletes one ingredient's jars in one transaction, and answers the entry's live jars. Every jar and form must be the ingredient's, or the whole save is refused; a bad row's issues are pathed `create.<i>.input.<field>` or `update.<i>.input.<field>`.
  """
  saveStock(ingredientId: ID!, input: SaveStockInput!, workspaceId: ID!): [InventoryItem!]!

  """
  Marks the entry reviewed by a curator, or clears the mark so it needs review. Curators and admins only.
  """
  setCompendiumEntryReviewed(id: ID!, reviewed: Boolean!): Ingredient!
  setEmail(email: String!, next: String): User!
  setName(name: String!): User!

  """
  Gives a user a site role, user, curator or admin, with an optional reason for the record. Refused for a role already held, for moving the primary admin or the last admin off admin, and for a curator.
  """
  setUserRole(note: String, role: UserRole!, userId: ID!): User!

  """Replaces the category; the slug follows the name."""
  updateCategory(id: ID!, input: CategoryInput!): Category!

  """
  Replaces the group; the slug follows the name. Each colour must clear 4.5:1 on its own theme.
  """
  updateCategoryGroup(id: ID!, input: CategoryGroupInput!): CategoryGroup!

  """
  Replaces the celestial body; the slug follows the name. A rename is carried onto every live compendium entry listing it.
  """
  updateCelestialBody(id: ID!, input: CelestialBodyInput!): CelestialBody!

  """Replaces the entry; the slug follows the name."""
  updateCompendiumIngredient(
    """
    Confirms ending another entry's redirect from the address this write takes (MB.82).
    """
    endRedirect: Boolean
    id: ID!
    input: CompendiumIngredientUpdateInput!
  ): Ingredient!

  """
  Replaces the deity; the slug follows the name and the tradition. A rename is carried onto every live compendium entry that picked the deity.
  """
  updateDeity(id: ID!, input: DeityInput!): Deity!

  """
  Replaces the tradition; the slug follows the name, and so does the slug of every deity under it.
  """
  updateDeityTradition(id: ID!, input: DeityTraditionInput!): DeityTradition!
  updateIngredient(id: ID!, input: IngredientUpdateInput!, workspaceId: ID!): Ingredient!

  """
  Replaces the group; the slug follows the name, and so does the slug of every form under it.
  """
  updateIngredientFormGroup(id: ID!, input: IngredientFormGroupInput!): IngredientFormGroup!

  """
  Replaces the form; the slug follows the name and the group. A rename is carried onto every form of a live compendium entry that picked it, moving no entry address.
  """
  updateIngredientFormValue(id: ID!, input: IngredientFormValueInput!): IngredientFormValue!

  """
  Sets an existing member's role. Owners only; refused when it would leave the coven without an owner.
  """
  updateMemberRole(role: WorkspaceRole!, userId: ID!, workspaceId: ID!): WorkspaceMember!

  """Reaches every row citing it; nothing deletes a reference in v1."""
  updateReference(id: ID!, input: ReferenceInput!, workspaceId: ID): Reference!

  """
  Saves a spell's fields and, when given, its whole recipe, against the revision it was read at.
  """
  updateSpell(id: ID!, input: UpdateSpellInput!, workspaceId: ID!): Spell!

  """Changes a jar: a field left out keeps its value, and null clears it."""
  updateStock(id: ID!, input: StockInput!, workspaceId: ID!): InventoryItem!

  """
  Replaces the sign; the slug follows the name. A rename is carried onto every live compendium entry listing it.
  """
  updateZodiacSign(id: ID!, input: ZodiacSignInput!): ZodiacSign!
}

