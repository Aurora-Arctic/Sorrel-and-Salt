type AuditInfo {
  createdAt: DateTime!
  createdBy: ID!
  updatedAt: DateTime!
  updatedBy: ID!
}

type Category {
  description: String!
  group: CategoryGroup!
  id: ID!
  name: String!
  slug: String!
}

type CategoryGroup {
  colorDark: String!
  colorLight: String!
  description: String!
  id: ID!
  name: String!
  slug: String!
}

type CommonNameSuggestion {
  claimants: [SuggestionClaimant!]!
  value: String!
}

type CorrespondenceSuggestion {
  curated: Boolean!
  description: String
  value: String!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTime

type FormSuggestion {
  claimants: [SuggestionClaimant!]!
  curated: Boolean!
  description: String
  group: String
  value: String!
}

type Ingredient {
  audit: AuditInfo!
  canonicalName: String
  categories: [Category!]!
  color: String
  deities: [String!]
  description: String
  element: IngredientElement
  folkNames: [String!]!
  form: String
  id: ID!
  isGlobal: Boolean!
  name: String!
  nomenclature: Nomenclature!
  planet: String
  safetyNotes: String
  slug: String!
  substitutes: [String!]
  zodiac: String
}

enum IngredientElement {
  air
  earth
  fire
  spirit
  water
}

type IngredientFormGroup {
  description: String!
  id: ID!
  name: String!
  slug: String!
}

type IngredientFormValue {
  description: String!
  group: IngredientFormGroup!
  id: ID!
  name: String!
  slug: String!
}

type Mutation {
  setEmail(email: String!): User!
}

enum Nomenclature {
  botanical
  chemical
  fungal
  mineral
  none
  unknown
  zoological
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  commonNameSuggestions(after: String, before: String, first: Int, last: Int, term: String, workspaceId: ID!): QueryCommonNameSuggestionsConnection!
  compendium(after: String, before: String, categoryIds: [ID!], first: Int, form: String, last: Int, search: String): QueryCompendiumConnection!
  formSuggestions(after: String, before: String, first: Int, last: Int, term: String, workspaceId: ID!): QueryFormSuggestionsConnection!
  ingredient(id: ID!, workspaceId: ID): Ingredient!
  ingredientFormValues(after: String, before: String, first: Int, last: Int): QueryIngredientFormValuesConnection!
  me: User!
  ok: Boolean!
  planetSuggestions(after: String, before: String, first: Int, last: Int, term: String, workspaceId: ID!): QueryPlanetSuggestionsConnection!
  zodiacSuggestions(after: String, before: String, first: Int, last: Int, term: String, workspaceId: ID!): QueryZodiacSuggestionsConnection!
}

type QueryCommonNameSuggestionsConnection {
  edges: [QueryCommonNameSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryCommonNameSuggestionsConnectionEdge {
  cursor: String!
  node: CommonNameSuggestion!
}

type QueryCompendiumConnection {
  edges: [QueryCompendiumConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryCompendiumConnectionEdge {
  cursor: String!
  node: Ingredient!
}

type QueryFormSuggestionsConnection {
  edges: [QueryFormSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryFormSuggestionsConnectionEdge {
  cursor: String!
  node: FormSuggestion!
}

type QueryIngredientFormValuesConnection {
  edges: [QueryIngredientFormValuesConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryIngredientFormValuesConnectionEdge {
  cursor: String!
  node: IngredientFormValue!
}

type QueryPlanetSuggestionsConnection {
  edges: [QueryPlanetSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryPlanetSuggestionsConnectionEdge {
  cursor: String!
  node: CorrespondenceSuggestion!
}

type QueryZodiacSuggestionsConnection {
  edges: [QueryZodiacSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryZodiacSuggestionsConnectionEdge {
  cursor: String!
  node: CorrespondenceSuggestion!
}

type SuggestionClaimant {
  canonicalName: String
  name: String!
}

type User {
  audit: AuditInfo!
  canCreateWorkspace: Boolean!
  email: String!
  id: ID!
  image: String
  memberships: [WorkspaceMember!]!
  name: String!
  role: UserRole!
}

enum UserRole {
  admin
  user
}

type Workspace {
  audit: AuditInfo!
  id: ID!
  name: String!
  slug: String!
}

type WorkspaceMember {
  audit: AuditInfo!
  joinedAt: DateTime!
  role: WorkspaceRole!
  workspace: Workspace!
}

enum WorkspaceRole {
  member
  owner
  viewer
}
