type Mutation {
  createCategory(input: CategoryInput!): Category!
  createCategoryGroup(input: CategoryGroupInput!): CategoryGroup!
  createCompendiumIngredient(
    """
    Confirms ending another entry's redirect from the address this write takes (MB.82).
    """
    endRedirect: Boolean
    input: CompendiumIngredientInput!
  ): Ingredient!
  createDeity(input: DeityInput!): Deity!
  createDeityTradition(input: DeityTraditionInput!): DeityTradition!
  createIngredientFormGroup(input: IngredientFormGroupInput!): IngredientFormGroup!
  createIngredientFormValue(input: IngredientFormValueInput!): IngredientFormValue!
  createPlanet(input: PlanetInput!): Planet!

  """A null workspaceId writes the compendium's, under the admin proof."""
  createReference(input: ReferenceInput!, workspaceId: ID): Reference!
  createWorkspaceIngredient(input: IngredientInput!, workspaceId: ID!): Ingredient!
  createZodiacSign(input: ZodiacSignInput!): ZodiacSign!

  """
  A soft delete, refused while a live compendium entry is filed under it; a coven keeps its links.
  """
  deleteCategory(id: ID!): ID!

  """
  A soft delete; the live categories under it move to `moveTo` first, which they need when there are any.
  """
  deleteCategoryGroup(id: ID!, moveTo: ID): ID!

  """A soft delete; a spell holding the entry still reaches it."""
  deleteCompendiumIngredient(id: ID!): ID!

  """
  A soft delete, refused while a live compendium entry picked the deity; a coven keeps its pick.
  """
  deleteDeity(id: ID!): ID!

  """
  A soft delete; the live deities under it move to `moveTo` first, re-slugged there, which they need when there are any.
  """
  deleteDeityTradition(id: ID!, moveTo: ID): ID!
  deleteIngredient(id: ID!, workspaceId: ID!): ID!

  """
  A soft delete; the live forms under it move to `moveTo` first, re-slugged there, which they need when there are any.
  """
  deleteIngredientFormGroup(id: ID!, moveTo: ID): ID!

  """
  A soft delete, refused while a live compendium entry picked the form; a coven keeps its pick.
  """
  deleteIngredientFormValue(id: ID!): ID!

  """
  A soft delete, refused while a live compendium entry lists the planet; a coven keeps what it wrote.
  """
  deletePlanet(id: ID!): ID!

  """
  A soft delete, refused while a live compendium entry lists the sign; a coven keeps what it wrote.
  """
  deleteZodiacSign(id: ID!): ID!

  """Lets a user with no invitation create a coven. Refused once they may."""
  grantWorkspaceCreation(userId: ID!): User!

  """
  Stops a user creating covens; those they own stay theirs. Refused for an admin, and for a user who cannot.
  """
  revokeWorkspaceCreation(userId: ID!): User!
  setEmail(email: String!, next: String): User!

  """Replaces the category; the slug follows the name."""
  updateCategory(id: ID!, input: CategoryInput!): Category!

  """
  Replaces the group; the slug follows the name. Each colour must clear 4.5:1 on its own theme.
  """
  updateCategoryGroup(id: ID!, input: CategoryGroupInput!): CategoryGroup!

  """Replaces the entry; the slug follows the name."""
  updateCompendiumIngredient(
    """
    Confirms ending another entry's redirect from the address this write takes (MB.82).
    """
    endRedirect: Boolean
    id: ID!
    input: CompendiumIngredientUpdateInput!
  ): Ingredient!

  """
  Replaces the deity; the slug follows the name and the tradition. A rename is carried onto every live compendium entry that picked the deity.
  """
  updateDeity(id: ID!, input: DeityInput!): Deity!

  """
  Replaces the tradition; the slug follows the name, and so does the slug of every deity under it.
  """
  updateDeityTradition(id: ID!, input: DeityTraditionInput!): DeityTradition!
  updateIngredient(id: ID!, input: IngredientUpdateInput!, workspaceId: ID!): Ingredient!

  """
  Replaces the group; the slug follows the name, and so does the slug of every form under it.
  """
  updateIngredientFormGroup(id: ID!, input: IngredientFormGroupInput!): IngredientFormGroup!

  """
  Replaces the form; the slug follows the name and the group. A rename is carried onto every live compendium entry that picked the form.
  """
  updateIngredientFormValue(id: ID!, input: IngredientFormValueInput!): IngredientFormValue!

  """
  Replaces the planet; the slug follows the name. A rename is carried onto every live compendium entry listing it.
  """
  updatePlanet(id: ID!, input: PlanetInput!): Planet!

  """Reaches every row citing it; nothing deletes a reference in v1."""
  updateReference(id: ID!, input: ReferenceInput!, workspaceId: ID): Reference!

  """
  Replaces the sign; the slug follows the name. A rename is carried onto every live compendium entry listing it.
  """
  updateZodiacSign(id: ID!, input: ZodiacSignInput!): ZodiacSign!
}

