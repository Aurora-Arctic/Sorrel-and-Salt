type AuditInfo {
  createdAt: DateTime!
  createdBy: ID!
  updatedAt: DateTime!
  updatedBy: ID!
}

type Category {
  description: String!
  group: CategoryGroup!
  id: ID!
  name: String!
  slug: String!
}

type CategoryGroup {
  colorDark: String!
  colorLight: String!
  description: String!
  id: ID!
  name: String!
  slug: String!
}

type CommonNameSuggestion {
  claimants: [SuggestionClaimant!]!
  value: String!
}

type CorrespondenceSuggestion {
  curated: Boolean!
  description: String
  value: String!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTime

type DeitySuggestion {
  curated: Boolean!
  description: String
  tradition: String
  value: String!
}

type FormSuggestion {
  claimants: [SuggestionClaimant!]!
  curated: Boolean!
  description: String
  group: String
  value: String!
}

type Ingredient {
  audit: AuditInfo!

  """
  The formal name: null for none, set for a named kind, either for unknown.
  """
  canonicalName: String
  categories: [Category!]!
  colors: [String!]
  deities: [String!]
  description: String
  elements: [IngredientElement!]
  folkNames: [String!]!
  form: String
  id: ID!
  isGlobal: Boolean!
  name: String!
  nomenclature: Nomenclature!
  planets: [String!]
  safetyNotes: String
  slug: String!
  substitutes: [Substitute!]!
  zodiacSigns: [String!]
}

enum IngredientElement {
  air
  earth
  fire
  spirit
  water
}

type IngredientFormGroup {
  description: String!
  id: ID!
  name: String!
  slug: String!
}

type IngredientFormValue {
  description: String!
  group: IngredientFormGroup!
  id: ID!
  name: String!
  slug: String!
}

input IngredientInput {
  canonicalName: String
  colors: [String!]
  deities: [String!]
  description: String
  elements: [IngredientElement!]
  folkNames: [String!]
  form: String
  name: String!
  nomenclature: Nomenclature
  planets: [String!]
  safetyNotes: String
  substitutes: [SubstituteInput!]
  zodiacSigns: [String!]
}

"""
The whole ingredient, replacing the row. Every field is sent, and "" or [] clears one.
"""
input IngredientUpdateInput {
  canonicalName: String!
  colors: [String!]!
  deities: [String!]!
  description: String!
  elements: [IngredientElement!]!
  folkNames: [String!]!
  form: String!
  name: String!
  nomenclature: Nomenclature!
  planets: [String!]!
  safetyNotes: String!
  substitutes: [SubstituteInput!]!
  zodiacSigns: [String!]!
}

type Mutation {
  createWorkspaceIngredient(input: IngredientInput!, workspaceId: ID!): Ingredient!
  deleteIngredient(id: ID!, workspaceId: ID!): ID!
  setEmail(email: String!, next: String): User!
  updateIngredient(id: ID!, input: IngredientUpdateInput!, workspaceId: ID!): Ingredient!
}

enum Nomenclature {
  botanical
  chemical
  fungal
  mineral
  none
  unknown
  zoological
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  commonNameSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryCommonNameSuggestionsConnection!
  compendium(after: String, before: String, categoryIds: [ID!], first: Int, form: String, last: Int, query: String): QueryCompendiumConnection!
  deitySuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryDeitySuggestionsConnection!
  formSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryFormSuggestionsConnection!
  ingredient(id: ID!, workspaceId: ID): Ingredient!
  ingredientFormValues(after: String, before: String, first: Int, last: Int): QueryIngredientFormValuesConnection!
  ingredientSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryIngredientSuggestionsConnection!
  me: User!
  ok: Boolean!
  planetSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryPlanetSuggestionsConnection!
  possibleDuplicates(after: String, before: String, first: Int, last: Int, name: String!, workspaceId: ID!): QueryPossibleDuplicatesConnection!
  users(after: String, awaitingApproval: Boolean, before: String, first: Int, last: Int, query: String): QueryUsersConnection!
  zodiacSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryZodiacSuggestionsConnection!
}

type QueryCommonNameSuggestionsConnection {
  edges: [QueryCommonNameSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryCommonNameSuggestionsConnectionEdge {
  cursor: String!
  node: CommonNameSuggestion!
}

type QueryCompendiumConnection {
  """
  How many of the list's rows come before this page's first edge: 0 on the first page, so the page is floor(countBefore / size) + 1. Null on an empty page.
  """
  countBefore: Int
  edges: [QueryCompendiumConnectionEdge!]!
  pageInfo: PageInfo!

  """How many rows the list holds under its arguments."""
  totalCount: Int!
}

type QueryCompendiumConnectionEdge {
  cursor: String!
  node: Ingredient!

  """
  The word similarity of the query to the entry, 0 to 1 — its best across the label, formal name and folk names. Null without a query.
  """
  score: Float
}

type QueryDeitySuggestionsConnection {
  edges: [QueryDeitySuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryDeitySuggestionsConnectionEdge {
  cursor: String!
  node: DeitySuggestion!
}

type QueryFormSuggestionsConnection {
  edges: [QueryFormSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryFormSuggestionsConnectionEdge {
  cursor: String!
  node: FormSuggestion!
}

type QueryIngredientFormValuesConnection {
  edges: [QueryIngredientFormValuesConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryIngredientFormValuesConnectionEdge {
  cursor: String!
  node: IngredientFormValue!
}

type QueryIngredientSuggestionsConnection {
  edges: [QueryIngredientSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryIngredientSuggestionsConnectionEdge {
  cursor: String!
  node: Ingredient!
}

type QueryPlanetSuggestionsConnection {
  edges: [QueryPlanetSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryPlanetSuggestionsConnectionEdge {
  cursor: String!
  node: CorrespondenceSuggestion!
}

type QueryPossibleDuplicatesConnection {
  edges: [QueryPossibleDuplicatesConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryPossibleDuplicatesConnectionEdge {
  cursor: String!
  node: Ingredient!

  """
  The name's trigram similarity to the entry, 0.4 to 1 — its best across the label, formal name and folk names. 1 is an exact match.
  """
  score: Float!
}

type QueryUsersConnection {
  edges: [QueryUsersConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryUsersConnectionEdge {
  cursor: String!
  node: User!
}

type QueryZodiacSuggestionsConnection {
  edges: [QueryZodiacSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryZodiacSuggestionsConnectionEdge {
  cursor: String!
  node: CorrespondenceSuggestion!
}

"""
Another ingredient to use in its place: a link to one, or the name of one not entered.
"""
type Substitute {
  """
  The ingredient to follow: null on a typed name, and once the linked ingredient is deleted.
  """
  ingredient: Ingredient

  """
  The linked ingredient's label, its last once deleted; the typed name otherwise.
  """
  name: String!
}

"""
An ingredient to link, or the name of one not entered: exactly one of the two.
"""
input SubstituteInput {
  ingredientId: ID
  name: String
}

type SuggestionClaimant {
  canonicalName: String
  name: String!
}

type User {
  audit: AuditInfo!
  canCreateWorkspace: Boolean!
  email: String!
  emailVerified: Boolean!
  id: ID!
  image: String
  memberships: [WorkspaceMember!]!
  name: String!

  """The sign-in providers linked to the account, by id, sorted."""
  providers: [String!]!
  role: UserRole!
}

enum UserRole {
  admin
  user
}

type Workspace {
  audit: AuditInfo!
  id: ID!
  name: String!
  slug: String!
}

type WorkspaceMember {
  audit: AuditInfo!
  joinedAt: DateTime!
  role: WorkspaceRole!
  workspace: Workspace!
}

enum WorkspaceRole {
  member
  owner
  viewer
}
