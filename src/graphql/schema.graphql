  update: [UpdateJarInput!]!
}

"""A source, local or compendium, and how many entries it would list."""
type SourceFacetCount {
  """
  How many entries the list would hold with this value as the only one chosen of its kind, the rest of the filter unchanged.
  """
  count: Int!

  """local or compendium, as source takes it."""
  value: IngredientSource!
}

"""A coven's working: what it intends, and the recipe that makes it."""
type Spell {
  audit: AuditInfo!

  """What the spell intends: the categories its author assigned."""
  categories: [Category!]!
  categoryGaps: CategoryComparison!
  dayOfWeek: String

  """
  What the spell is made of: every category its linked ingredients and their forms carry. A one-off row contributes none.
  """
  derivedCategories: [Category!]!
  id: ID!
  intent: String
  jarDescription: String
  moonPhase: String
  note: String

  """
  Raised by one on every save; a save names the revision it was written against (M13.15).
  """
  revision: Int!
  sealWaxColor: String
  status: SpellStatus!

  """The recipe: every step in position order, instructions included."""
  steps: [SpellStep!]!

  """
  Null on a draft not yet named: only a complete spell must carry a title (M13.15).
  """
  title: String
  visibility: SpellVisibility!
}

"""A new spell: a draft needs nothing but its status."""
input SpellInput {
  """
  The categories the spell is assigned: what it intends, not what its ingredients bring.
  """
  categoryIds: [ID!]
  dayOfWeek: String
  intent: String
  jarDescription: String
  moonPhase: String
  note: String
  sealWaxColor: String
  status: SpellStatus

  """The recipe, in order."""
  steps: [SpellStepInput!]

  """Required once the status is complete."""
  title: String
  visibility: SpellVisibility
}

enum SpellStatus {
  complete
  draft
}

"""One step of a recipe: an ingredient laid, an instruction, or both."""
type SpellStep {
  audit: AuditInfo!

  """The instruction; null on an ingredient-only step."""
  body: String

  """The linked form's name; the one-off row's free text otherwise."""
  form: String
  id: ID!

  """
  The ingredient laid, kept once deleted; null on a one-off row and an instruction-only step.
  """
  ingredient: Ingredient

  """
  The linked ingredient's name in this coven; the one-off row's own otherwise; null on an instruction-only step.
  """
  name: String
  position: Int!
  quantity: Float
  unit: InventoryUnit

  """The form laid, on a linked step, still shown once deleted since."""
  variant: IngredientVariant
}

"""
One step of a recipe: an instruction, an ingredient, or both. The ingredient is linked (ingredientId with variantId) or written for this jar (name, with form).
"""
input SpellStepInput {
  body: String
  form: String

  """A saved step this one is; left out, the step is new."""
  id: ID
  ingredientId: ID
  name: String
  quantity: Float
  unit: InventoryUnit

  """The form laid; set exactly when ingredientId is."""
  variantId: ID
}

"""Who reads a spell: its author alone, or every member of its coven."""
enum SpellVisibility {
  private
  workspace
}

input StockInput {
  acquiredDate: LocalDate

  """A missing threshold takes the unit dimension's default on add."""
  lowStockThreshold: Float
  quantityOnHand: Float
  source: String
  unit: InventoryUnit
}

"""
Another ingredient to use in its place: a link to one, or the name of one not entered.
"""
type Substitute {
  """
  The ingredient to follow: null on a typed name, and once the linked ingredient is deleted.
  """
  ingredient: Ingredient

  """
  The linked ingredient's label, its last once deleted; the typed name otherwise.
  """
  name: String!

  """
  The linked ingredient's form the link names: null when it names none, on a typed name, and once that ingredient or form is deleted.
  """
  variant: IngredientVariant
}

"""
An ingredient to link, or the name of one not entered: exactly one of the two.
"""
input SubstituteInput {
  ingredientId: ID
  name: String

  """
  One of the linked ingredient's forms, when the substitute is that form alone.
  """
  substituteVariantId: ID
}

type SuggestionClaimant {
  canonicalName: String
  name: String!
}

"""
Where the substitute picker lists an entry: the coven's own cupboard (yours), or the rest of the compendium.
"""
enum SuggestionGroup {
  compendium
  yours
}

"""A toxic setting other than any, and how many entries it would list."""
type ToxicFacetCount {
  """
  How many entries the list would hold with this value as the only one chosen of its kind, the rest of the filter unchanged.
  """
  count: Int!

  """toxic or not_toxic, as toxic takes it."""
  value: ToxicFilter!
}

"""
Which entries a search keeps by toxicity: any (no filter); toxic, flagged on the entry or on any live form; or not_toxic, flagged on neither.
"""
enum ToxicFilter {
  any
  not_toxic
  toxic
}

"""What a unit measures; conversion stays inside one."""
enum UnitDimension {
  count
  volume
  weight
}

"""A change to a jar the coven holds; a field left out keeps its value."""
input UpdateJarInput {
  id: ID!
  input: StockInput!
}

"""
Changes a spell: a field left out keeps its value, and null clears it. Visibility only widens once the spell is complete.
"""
input UpdateSpellInput {
  """
  The whole set of categories the spell is assigned: one left out is unassigned. Left out, they are unchanged.
  """
  categoryIds: [ID!]
  dayOfWeek: String

  """
  Required, though it may be null: the revision this save was written against, which a newer one refuses. Null writes regardless.
  """
  expectedRevision: Int
  intent: String
  jarDescription: String
  moonPhase: String
  note: String
  sealWaxColor: String
  status: SpellStatus

  """
  The whole recipe, in order: a saved step left out is removed. Left out, the recipe is unchanged.
  """
  steps: [SpellStepInput!]

  """Required once the status is complete."""
  title: String
  visibility: SpellVisibility
}

type User {
  audit: AuditInfo!
  canCreateWorkspace: Boolean!
  email: String!
  emailVerified: Boolean!
  id: ID!
  image: String
  memberships: [WorkspaceMember!]!
  name: String!

  """The sign-in providers linked to the account, by id, sorted."""
  providers: [String!]!
  role: UserRole!
}

"""
A privilege on `users`: `admin` and `curator` are site roles, `create_workspace` the flag.
"""
enum UserPrivilege {
  admin
  create_workspace
  curator
}

enum UserRole {
  admin
  curator
  user
}

type Workspace {
  audit: AuditInfo!
  id: ID!

  """
  The coven's live members, in the order they joined, for the roles that may read them.
  """
  members(after: String, before: String, first: Int, last: Int): WorkspaceMembersConnection!
  name: String!
  slug: String!
}

type WorkspaceMember {
  audit: AuditInfo!

  """
  The member's address, as their own account holds it now. Owners only; null for someone the coven no longer seats.
  """
  email: String
  invitedBy: CoMember
  joinedAt: DateTime!
  role: WorkspaceRole!
  user: CoMember!
  workspace: Workspace!
}

type WorkspaceMembersConnection {
  edges: [WorkspaceMembersConnectionEdge!]!
  pageInfo: PageInfo!
}

type WorkspaceMembersConnectionEdge {
  cursor: String!
  node: WorkspaceMember!
}

enum WorkspaceRole {
  member
  owner
  viewer
}

type ZodiacSign {
  description: String!
  id: ID!
  name: String!
  slug: String!
}

input ZodiacSignInput {
  description: String!
  name: String!
}
