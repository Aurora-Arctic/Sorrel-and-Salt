"""A source, kept once and linked from every row it supports."""
type Reference {
  accessed: LocalDate
  audit: AuditInfo!
  authors: String

  """
  Chicago bibliography form, rendered on the server, plain; a surface that shows italics renders the parts itself.
  """
  citation: String!

  """
  The book of a chapter, the journal of an article, the reference work of an entry, or a web page's site.
  """
  container: String
  contributors: String
  edition: String

  """The repository a print work was read through."""
  host: String
  id: ID!
  isGlobal: Boolean!
  issue: String
  kind: ReferenceKind!
  modified: LocalDate
  note: String
  pages: String
  place: String
  published: String
  publisher: String
  series: String
  title: String!
  url: String
  volume: String
}

"""A reference, whole. On an update, a field left out or null is cleared."""
input ReferenceInput {
  accessed: LocalDate
  authors: String
  container: String
  contributors: String
  edition: String
  host: String
  issue: String
  kind: ReferenceKind!
  modified: LocalDate
  note: String
  pages: String
  place: String
  published: String
  publisher: String
  series: String
  title: String!
  url: String
  volume: String
}

enum ReferenceKind {
  article
  book
  chapter
  entry
  web_page
}

"""One row's link to a source."""
type ReferenceLink {
  """Where in the source: "p. 112", "chap. 13"."""
  locator: String
  reference: Reference!
}

input ReferenceLinkInput {
  locator: String
  referenceId: ID!
}

"""
Another ingredient to use in its place: a link to one, or the name of one not entered.
"""
type Substitute {
  """
  The ingredient to follow: null on a typed name, and once the linked ingredient is deleted.
  """
  ingredient: Ingredient

  """
  The linked ingredient's label, its last once deleted; the typed name otherwise.
  """
  name: String!
}

"""
An ingredient to link, or the name of one not entered: exactly one of the two.
"""
input SubstituteInput {
  ingredientId: ID
  name: String
}

