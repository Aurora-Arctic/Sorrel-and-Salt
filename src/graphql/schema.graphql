type AuditInfo {
  createdAt: DateTime!
  createdBy: ID!
  updatedAt: DateTime!
  updatedBy: ID!
}

type Category {
  description: String!
  group: CategoryGroup!
  id: ID!
  name: String!
  slug: String!
}

type CategoryGroup {
  colorDark: String!
  colorLight: String!
  description: String!
  id: ID!
  name: String!
  slug: String!
}

type CommonNameSuggestion {
  claimants: [SuggestionClaimant!]!
  value: String!
}

type CorrespondenceSuggestion {
  curated: Boolean!
  description: String
  value: String!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTime

type Deity {
  description: String!
  id: ID!
  name: String!
  slug: String!
  tradition: DeityTradition!
}

type DeitySuggestion {
  curated: Boolean!
  description: String

  """The curated row, which a pick sends; null for a value only in use."""
  id: ID
  tradition: String
  value: String!
}

type DeityTradition {
  description: String!
  id: ID!
  name: String!
  slug: String!
}

type FormSuggestion {
  claimants: [SuggestionClaimant!]!
  curated: Boolean!
  description: String
  group: String

  """The curated row, which a pick sends; null for a value only in use."""
  id: ID
  value: String!
}

type Ingredient {
  audit: AuditInfo!

  """
  The formal name: null for none, set for a named kind, either for unknown.
  """
  canonicalName: String
  categories: [Category!]!
  colors: [String!]
  deities: [IngredientDeity!]!
  description: String
  elements: [IngredientElement!]
  folkNames: [String!]!
  form: String

  """
  The curated form picked for `form`: null when the form was typed, and once that form or its group is retired.
  """
  formChoice: IngredientFormValue
  id: ID!
  isGlobal: Boolean!
  name: String!
  nomenclature: Nomenclature!
  planets: [String!]
  references: [ReferenceLink!]!
  safetyNotes: String
  slug: String!
  substitutes: [Substitute!]!
  zodiacSigns: [String!]
}

"""
A deity the ingredient corresponds to: one picked from the curated list, or typed.
"""
type IngredientDeity {
  """
  The curated deity picked: null on a typed name, and once that deity or its tradition is retired.
  """
  deity: Deity

  """
  The name as saved: a picked deity's curated spelling, or the typed text.
  """
  name: String!
}

"""A curated deity picked, or a name typed: exactly one of the two."""
input IngredientDeityInput {
  deityId: ID
  name: String
}

enum IngredientElement {
  air
  earth
  fire
  spirit
  water
}

type IngredientFormGroup {
  description: String!
  id: ID!
  name: String!
  slug: String!
}

type IngredientFormValue {
  description: String!
  group: IngredientFormGroup!
  id: ID!
  name: String!
  slug: String!
}

input IngredientInput {
  canonicalName: String
  colors: [String!]
  deities: [IngredientDeityInput!]
  description: String
  elements: [IngredientElement!]
  folkNames: [String!]
  form: String

  """The curated form picked for `form`; none when it was typed."""
  formId: ID
  name: String!
  nomenclature: Nomenclature
  planets: [String!]
  references: [ReferenceLinkInput!]
  safetyNotes: String
  substitutes: [SubstituteInput!]
  zodiacSigns: [String!]
}

"""
The whole ingredient, replacing the row. Every field is sent, and "" or [] clears one.
"""
input IngredientUpdateInput {
  canonicalName: String!
  colors: [String!]!
  deities: [IngredientDeityInput!]!
  description: String!
  elements: [IngredientElement!]!
  folkNames: [String!]!
  form: String!

  """The curated form picked for `form`; "" when it was typed."""
  formId: ID!
  name: String!
  nomenclature: Nomenclature!
  planets: [String!]!
  references: [ReferenceLinkInput!]!
  safetyNotes: String!
  substitutes: [SubstituteInput!]!
  zodiacSigns: [String!]!
}

"""
A local date string (i.e., with no associated timezone) in `YYYY-MM-DD` format, e.g. `2020-01-01`.
"""
scalar LocalDate

type Mutation {
  """A null workspaceId writes the compendium's, under the admin proof."""
  createReference(input: ReferenceInput!, workspaceId: ID): Reference!
  createWorkspaceIngredient(input: IngredientInput!, workspaceId: ID!): Ingredient!
  deleteIngredient(id: ID!, workspaceId: ID!): ID!
  setEmail(email: String!, next: String): User!
  updateIngredient(id: ID!, input: IngredientUpdateInput!, workspaceId: ID!): Ingredient!

  """Reaches every row citing it; nothing deletes a reference in v1."""
  updateReference(id: ID!, input: ReferenceInput!, workspaceId: ID): Reference!
}

enum Nomenclature {
  botanical
  chemical
  fungal
  mineral
  none
  unknown
  zoological
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  commonNameSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryCommonNameSuggestionsConnection!
  compendium(after: String, before: String, categoryIds: [ID!], first: Int, form: String, last: Int, query: String, withoutReferences: Boolean): QueryCompendiumConnection!
  deitySuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryDeitySuggestionsConnection!
  formSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryFormSuggestionsConnection!
  ingredient(id: ID!, workspaceId: ID): Ingredient!
  ingredientFormValues(after: String, before: String, first: Int, last: Int): QueryIngredientFormValuesConnection!
  ingredientSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryIngredientSuggestionsConnection!
  me: User!
  ok: Boolean!
  planetSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryPlanetSuggestionsConnection!
  possibleDuplicates(after: String, before: String, first: Int, last: Int, name: String!, workspaceId: ID!): QueryPossibleDuplicatesConnection!
  referenceSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryReferenceSuggestionsConnection!
  users(after: String, awaitingApproval: Boolean, before: String, first: Int, last: Int, query: String): QueryUsersConnection!
  zodiacSuggestions(after: String, before: String, first: Int, last: Int, query: String, workspaceId: ID!): QueryZodiacSuggestionsConnection!
}

type QueryCommonNameSuggestionsConnection {
  edges: [QueryCommonNameSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryCommonNameSuggestionsConnectionEdge {
  cursor: String!
  node: CommonNameSuggestion!
}

type QueryCompendiumConnection {
  """
  How many of the list's rows come before this page's first edge: 0 on the first page, so the page is floor(countBefore / size) + 1. Null on an empty page.
  """
  countBefore: Int
  edges: [QueryCompendiumConnectionEdge!]!
  pageInfo: PageInfo!

  """How many rows the list holds under its arguments."""
  totalCount: Int!
}

type QueryCompendiumConnectionEdge {
  cursor: String!
  node: Ingredient!

  """
  The word similarity of the query to the entry, 0 to 1 — its best across the label, formal name and folk names. Null without a query.
  """
  score: Float
}

type QueryDeitySuggestionsConnection {
  edges: [QueryDeitySuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryDeitySuggestionsConnectionEdge {
  cursor: String!
  node: DeitySuggestion!
}

type QueryFormSuggestionsConnection {
  edges: [QueryFormSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryFormSuggestionsConnectionEdge {
  cursor: String!
  node: FormSuggestion!
}

type QueryIngredientFormValuesConnection {
  edges: [QueryIngredientFormValuesConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryIngredientFormValuesConnectionEdge {
  cursor: String!
  node: IngredientFormValue!
}

type QueryIngredientSuggestionsConnection {
  edges: [QueryIngredientSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryIngredientSuggestionsConnectionEdge {
  cursor: String!
  node: Ingredient!
}

type QueryPlanetSuggestionsConnection {
  edges: [QueryPlanetSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryPlanetSuggestionsConnectionEdge {
  cursor: String!
  node: CorrespondenceSuggestion!
}

type QueryPossibleDuplicatesConnection {
  edges: [QueryPossibleDuplicatesConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryPossibleDuplicatesConnectionEdge {
  cursor: String!
  node: Ingredient!

  """
  The name's trigram similarity to the entry, 0.4 to 1 — its best across the label, formal name and folk names. 1 is an exact match.
  """
  score: Float!
}

type QueryReferenceSuggestionsConnection {
  edges: [QueryReferenceSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryReferenceSuggestionsConnectionEdge {
  cursor: String!
  node: Reference!
}

type QueryUsersConnection {
  edges: [QueryUsersConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryUsersConnectionEdge {
  cursor: String!
  node: User!
}

type QueryZodiacSuggestionsConnection {
  edges: [QueryZodiacSuggestionsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryZodiacSuggestionsConnectionEdge {
  cursor: String!
  node: CorrespondenceSuggestion!
}

"""A source, kept once and linked from every row it supports."""
type Reference {
  accessed: LocalDate
  audit: AuditInfo!
  authors: String

  """
  Chicago bibliography form, rendered on the server, plain; a surface that shows italics renders the parts itself.
  """
  citation: String!

  """
  The book of a chapter, the journal of an article, the reference work of an entry, or a web page's site.
  """
  container: String
  contributors: String
  edition: String

  """The repository a print work was read through."""
  host: String
  id: ID!
  isGlobal: Boolean!
  issue: String
  kind: ReferenceKind!
  modified: LocalDate
  note: String
  pages: String
  place: String
  published: String
  publisher: String
  series: String
  title: String!
  url: String
  volume: String
}

"""A reference, whole. On an update, a field left out or null is cleared."""
input ReferenceInput {
  accessed: LocalDate
  authors: String
  container: String
  contributors: String
  edition: String
  host: String
  issue: String
  kind: ReferenceKind!
  modified: LocalDate
  note: String
  pages: String
  place: String
  published: String
  publisher: String
  series: String
  title: String!
  url: String
  volume: String
}

enum ReferenceKind {
  article
  book
  chapter
  entry
  web_page
}

"""One row's link to a source."""
type ReferenceLink {
  """Where in the source: "p. 112", "chap. 13"."""
  locator: String
  reference: Reference!
}

input ReferenceLinkInput {
  locator: String
  referenceId: ID!
}

"""
Another ingredient to use in its place: a link to one, or the name of one not entered.
"""
type Substitute {
  """
  The ingredient to follow: null on a typed name, and once the linked ingredient is deleted.
  """
  ingredient: Ingredient

  """
  The linked ingredient's label, its last once deleted; the typed name otherwise.
  """
  name: String!
}

"""
An ingredient to link, or the name of one not entered: exactly one of the two.
"""
input SubstituteInput {
  ingredientId: ID
  name: String
}

type SuggestionClaimant {
  canonicalName: String
  name: String!
}

type User {
  audit: AuditInfo!
  canCreateWorkspace: Boolean!
  email: String!
  emailVerified: Boolean!
  id: ID!
  image: String
  memberships: [WorkspaceMember!]!
  name: String!

  """The sign-in providers linked to the account, by id, sorted."""
  providers: [String!]!
  role: UserRole!
}

enum UserRole {
  admin
  user
}

type Workspace {
  audit: AuditInfo!
  id: ID!
  name: String!
  slug: String!
}

type WorkspaceMember {
  audit: AuditInfo!
  joinedAt: DateTime!
  role: WorkspaceRole!
  workspace: Workspace!
}

enum WorkspaceRole {
  member
  owner
  viewer
}
