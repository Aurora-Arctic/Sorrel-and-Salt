name: PR Check Comment
description: >-
  Posts or updates one marked PR comment for a CI check, in the layout every
  CI comment shares (.github/scripts/lib/pr-comment.cjs). A single-result
  comment has pr-gate (minimize-on-success) and merge-queue (fail-only,
  separate thread) behaviour; a sectioned one (Vitest, Playwright) is written
  one section at a time by the jobs that share it.

inputs:
  check-name:
    description: Human-readable check name for the comment heading, in Title Case, e.g. "Vitest"
    required: true
  marker-slug:
    description: >-
      Lowercase slug for the comment's hidden marker, e.g. "vitest" -> <!-- ci-vitest -->.
      With `section` or `reset`, it names the sectioned layout: `vitest` or `playwright`.
    required: true
  pr-number:
    description: Pull request number to comment on
    required: true
  merge-queue:
    description: >-
      'true' when called for a merge queue — uses a separate marker/thread
      from the pr-gate comment for the same check, and comments only on
      failure (a success takes no action at all, not even resolving a prior
      open failure comment).
    required: false
    default: 'false'
  outcome:
    description: >-
      Outcome of the check step (e.g. steps.run.outcome) — anything other than
      'success' (or 'skipped', for a section) is treated as a failure. Unused with `reset`.
    required: false
    default: ''
  log-file:
    description: Path to the check's captured output log, tailed into the comment on failure
    required: false
    default: ''
  success-mode:
    description: >-
      pr-gate (merge-queue: false) behaviour on success of a single-result
      comment. 'minimize' resolves a prior open failure comment via GitHub's
      resolve mechanism and otherwise does nothing (lint/format/typecheck).
      'comment' always posts/updates a passing comment. Unused with `section`.
    required: false
    default: minimize
  summary:
    description: Short single-line markdown stat (e.g. "3 errors across 2 files"); a section's goes in its table row
    required: false
    default: ''
  details:
    description: Optional longer markdown block (e.g. failing-test list or table), rendered above the log
    required: false
    default: ''
  heading-note:
    description: >-
      With `section`, a short note this section adds to the comment's heading,
      e.g. "2,800 tests"
    required: false
    default: ''
  alert:
    description: >-
      With `section`, one line shown above the section's block that fails the
      comment's heading whatever `outcome` is, for a failure no section reports
    required: false
    default: ''
  duration:
    description: Pre-formatted job duration (e.g. "12s", "1m 34s")
    required: false
    default: ''
  section:
    description: >-
      The one section of a sectioned comment this call writes, e.g. `dom`. The
      other sections are left as the comment has them.
    required: false
    default: ''
  reset:
    description: >-
      'true' to start a sectioned comment for this run: every section shows as
      running, except those in `skipped-sections`.
    required: false
    default: 'false'
  skipped-sections:
    description: With `reset`, a comma-separated list of the sections the path filter skipped
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Comment on PR
      uses: actions/github-script@v9
      env:
        MERGE_QUEUE: ${{ inputs.merge-queue }}
        CHECK_NAME: ${{ inputs.check-name }}
        MARKER_SLUG: ${{ inputs.marker-slug }}
        SUCCESS_MODE: ${{ inputs.success-mode }}
        OUTCOME: ${{ inputs.outcome }}
        LOG_FILE: ${{ inputs.log-file }}
        SUMMARY: ${{ inputs.summary }}
        DETAILS: ${{ inputs.details }}
        HEADING_NOTE: ${{ inputs.heading-note }}
        ALERT: ${{ inputs.alert }}
        DURATION: ${{ inputs.duration }}
        PR_NUMBER: ${{ inputs.pr-number }}
        SECTION: ${{ inputs.section }}
        RESET: ${{ inputs.reset }}
        SKIPPED_SECTIONS: ${{ inputs.skipped-sections }}
      with:
        # A local action resolves from the workspace checkout, so the module is
        # there too, in a container job as on the runner.
        script: |
          const lib = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/lib/pr-comment.cjs`);
          const result = await lib.postComment({
            github,
            context,
            core,
            inputs: lib.inputsFromEnv(process.env),
          });
          core.info(`PR comment: ${result}`);
