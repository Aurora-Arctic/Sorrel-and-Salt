name: PR Check Comment
description: >-
  Posts or updates a single marked PR comment reporting a CI check's
  pass/fail result, with distinct pr-gate (minimize-on-success) and
  merge-queue (fail-only, separate thread) behavior.

inputs:
  check-name:
    description: Human-readable check name for the comment heading, e.g. "Vitest"
    required: true
  marker-slug:
    description: Lowercase slug for the comment's hidden marker, e.g. "vitest" -> <!-- ci-vitest -->
    required: true
  pr-number:
    description: Pull request number to comment on
    required: true
  merge-queue:
    description: >-
      'true' when called from merge-queue.yml — uses a separate marker/thread
      from the pr-gate comment for the same check, and comments only on
      failure (a success takes no action at all, not even resolving a prior
      open failure comment).
    required: false
    default: 'false'
  outcome:
    description: Outcome of the check step (e.g. steps.run.outcome) — anything other than 'success' is treated as a failure
    required: true
  log-file:
    description: Path to the check's captured output log, read for the failure comment body
    required: true
  success-mode:
    description: >-
      pr-gate (merge-queue: false) behavior on success. 'minimize' resolves a
      prior open failure comment via GitHub's resolve mechanism and otherwise
      does nothing (lint/format/typecheck). 'comment' always posts/updates a
      passing comment (vitest/playwright).
    required: false
    default: minimize
  summary:
    description: Short single-line markdown stat (e.g. "3 errors across 2 files"), rendered inline in the callout
    required: false
    default: ''
  details:
    description: Optional longer markdown block (e.g. failing-test list or table), rendered between the callout and the log
    required: false
    default: ''
  duration:
    description: Pre-formatted job duration (e.g. "12s", "1m 34s")
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Comment on PR
      uses: actions/github-script@v9
      env:
        MERGE_QUEUE: ${{ inputs.merge-queue }}
        CHECK_NAME: ${{ inputs.check-name }}
        MARKER_SLUG: ${{ inputs.marker-slug }}
        SUCCESS_MODE: ${{ inputs.success-mode }}
        OUTCOME: ${{ inputs.outcome }}
        LOG_FILE: ${{ inputs.log-file }}
        SUMMARY: ${{ inputs.summary }}
        DETAILS: ${{ inputs.details }}
        DURATION: ${{ inputs.duration }}
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        script: |
          const fs = require('fs');
          const isMergeQueue = process.env.MERGE_QUEUE === 'true';
          const checkName = process.env.CHECK_NAME;
          const slug = process.env.MARKER_SLUG;
          const successMode = process.env.SUCCESS_MODE;
          const outcome = process.env.OUTCOME;
          const logFile = process.env.LOG_FILE;
          const summary = process.env.SUMMARY;
          const details = process.env.DETAILS;
          const duration = process.env.DURATION;
          const marker = isMergeQueue ? `<!-- ci-${slug}-mergequeue -->` : `<!-- ci-${slug} -->`;
          const label = isMergeQueue ? `${checkName} (merge queue)` : checkName;
          const { owner, repo } = context.repo;
          const prNumber = Number(process.env.PR_NUMBER);

          const shortSha = context.sha.slice(0, 7);
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const metaParts = [`\`${shortSha}\``];
          if (duration) metaParts.push(duration);
          metaParts.push(`[view run](${runUrl})`);
          const meta = metaParts.join(' · ');

          const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
          const existing = comments.data.find((c) => c.body.includes(marker));

          if (outcome === 'success' && isMergeQueue) {
            return;
          }

          if (outcome === 'success' && successMode === 'minimize') {
            if (!existing) {
              return;
            }
            const statLine = summary ? ` — ${summary} (previously failed)` : ' (previously failed)';
            const body = `${marker}\n> [!NOTE]\n> ✅ **${label} passed**${statLine} · ${meta}`;
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
            await github.graphql(
              `mutation($id: ID!) {
                minimizeComment(input: { subjectId: $id, classifier: RESOLVED }) {
                  minimizedComment { isMinimized }
                }
              }`,
              { id: existing.node_id },
            );
            return;
          }

          // Remaining cases: success with successMode 'comment' (pr-gate vitest/playwright),
          // or any failure — always upsert, defensively un-minimizing first so the latest
          // result is never left hidden by an earlier minimize.
          const verb = outcome === 'success' ? 'passed' : 'failed';
          const callout = outcome === 'success' ? '[!NOTE]' : '[!CAUTION]';
          const emoji = outcome === 'success' ? '✅' : '❌';
          const statLine = summary ? ` — ${summary}` : '';

          let body = `${marker}\n> ${callout}\n> ${emoji} **${label} ${verb}**${statLine} · ${meta}`;
          if (details) body += `\n\n${details}`;
          if (outcome !== 'success') {
            const log = fs.readFileSync(logFile, 'utf8').split('\n').slice(-100).join('\n');
            body += `\n\n<details><summary>Output</summary>\n\n\`\`\`\n${log}\n\`\`\`\n</details>`;
          }

          if (existing) {
            try {
              await github.graphql(
                `mutation($id: ID!) {
                  unminimizeComment(input: { subjectId: $id }) {
                    unminimizedComment { isMinimized }
                  }
                }`,
                { id: existing.node_id },
              );
            } catch {
              // wasn't minimized — nothing to undo
            }
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
          }
