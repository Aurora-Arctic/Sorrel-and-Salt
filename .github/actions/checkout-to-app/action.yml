name: Checkout into /app
description: >-
  Checks out the repository and copies it into /app, since actions/checkout
  lands at $GITHUB_WORKSPACE rather than /app inside container: jobs.

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    # `cp -a` overlays; it never deletes. **That is safe only because the
    # image carries no source layer** — node_modules and the two manifests are
    # all Docker/Dockerfile.node puts in /app, so a file the branch deleted
    # has nothing to survive as. When the image did bake the repo in, every
    # such file was still on disk afterwards: untracked, not gitignored, and
    # indistinguishable to oxlint, tsc or a `tests/**` glob from a live one.
    # tests/guards/image-source-layer.test.ts keeps the image that way, which
    # is why this step stays a copy and never grows a `git clean`.
    - name: Copy checkout into /app
      shell: bash
      run: cp -a "$GITHUB_WORKSPACE"/. /app/
