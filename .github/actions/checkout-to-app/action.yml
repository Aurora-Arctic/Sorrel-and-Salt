name: Checkout into /app
description: >-
  Checks out the repository and copies it into /app, since actions/checkout
  lands at $GITHUB_WORKSPACE rather than /app inside container: jobs.

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    # `cp -a` overlays without deleting, which is safe only because the image
    # carries no source layer — each Dockerfile copies only its manifests, a
    # decision for review — so this stays a copy and never grows a `git clean`.
    - name: Copy checkout into /app
      shell: bash
      run: cp -a "$GITHUB_WORKSPACE"/. /app/
