version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # better-auth pins its own @better-auth/* packages to its exact version,
      # and src/lib/auth.ts imports @better-auth/core directly; bumped apart,
      # npm installs two copies of core.
      better-auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /Docker
    target-branch: staging
    schedule:
      interval: weekly
