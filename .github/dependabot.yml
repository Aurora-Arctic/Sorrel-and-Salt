version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /Docker
    target-branch: staging
    schedule:
      interval: weekly
