name: Playwright E2E

# Reusable check running the Playwright e2e suite against a built and served
# site. Called via workflow_call from pr-gate, never triggered directly.
# claude-docs/ci.md is the walkthrough.
#
# **This job's `container:` is NOT build-image.yml's shared `testing` image**,
# unlike every other check here. That image is Alpine/musl and Playwright's
# Chromium has no official musl support, so this runs in the dedicated
# Docker/Dockerfile.e2e image instead — which is why pr-gate.yml's
# `playwright` job depends on `build-e2e-image` rather than `build-image`.
on:
  workflow_call:
    inputs:
      image:
        description: E2E testing image ref to run against (from build-e2e-image.yml)
        required: true
        type: string
      db-image:
        description: Postgres service image ref to run against (from build-db-image.yml, built once by the caller — same image vitest.yml uses)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: Set true when called for a merge queue — uses a separate, merge-queue-labeled comment thread and posts only on failure, instead of always commenting pass/fail. Nothing passes it today — merge-queue.yml was deleted with the five check workflows (MB.32) and is restored from git history when M7.A.1 turns the merge queue on.
        required: false
        type: boolean
        default: false
      should-run:
        description: >-
          Set false to skip the actual e2e run while still completing this job under
          its normal name. pr-gate passes this from its path-filter output instead of
          putting an `if:` on the calling job — a job-level `if:` makes GitHub report
          a differently-named, bare check run ("playwright" instead of
          "playwright / playwright") when skipped, which never satisfies the
          "playwright / playwright" required status check and leaves the PR stuck.
          Defaults true so a caller that does no path filtering is unaffected.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  # read, not write: this job only pulls already-published images.
  packages: read
  pull-requests: write

jobs:
  playwright:
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # `--ipc=host` because Chromium crashes on the container default 64 MB
      # /dev/shm. The Playwright base image already runs as root, so the
      # `--user root` the other jobs need would add nothing; Chromium under
      # root expects `--no-sandbox`, which playwright.config.ts owns if it
      # ever launches non-headless — the headless default here does not.
      options: --ipc=host
    services:
      # Same shape as vitest.yml's service, from the same caller-built image:
      # reachable by service name, `POSTGRES_*` inert because PGDATA is
      # populated at image build time, kept as documentation of the
      # credentials Docker/postgres-init/enable-extensions.sql bakes in.
      postgres:
        image: ${{ inputs.db-image }}
        env:
          POSTGRES_USER: sorrel
          POSTGRES_PASSWORD: sorrel
          POSTGRES_DB: sorrel
        options: >-
          --health-cmd="pg_isready -U postgres -d sorrel_template"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    env:
      # playwright.config.ts's webServer.reuseExistingServer reads this and
      # always starts a fresh server rather than reusing one on its port.
      CI: true
      # Where the json reporter writes — read by summarize-playwright.mjs.
      PLAYWRIGHT_JSON_OUTPUT_NAME: /app/playwright-results.json
      # The same shape docker-compose.yaml's `app` service uses locally.
      # e2e/database.ts and playwright.config.ts's webServer.env both derive
      # sorrel_e2e's URL from it.
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      # The webServer runs `npm run build && npm run start` at
      # NODE_ENV=production, where Better Auth requires a real secret — this
      # fixed, non-secret placeholder satisfies it.
      BETTER_AUTH_SECRET: local-dev-not-a-real-secret
    steps:
      - name: Checkout into /app
        if: inputs.should-run
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      # The webServer builds and serves the app itself, so there is no
      # separate build step; the browser and its OS deps are already in
      # `inputs.image`, so there is no install step either.
      - name: Run Playwright e2e tests
        id: run
        if: inputs.should-run
        run: |
          set -o pipefail
          npm run e2e -- --reporter=list,json,html 2>&1 | tee /app/output.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            /app/playwright-report/
            /app/test-results/
          retention-days: 7

      # Unlike the report above, deliberately not failure-only: the point is a
      # coverage report to track on every run, same as vitest.yml's.
      - name: Upload coverage artifact
        if: always() && inputs.should-run
        uses: actions/upload-artifact@v7
        with:
          name: playwright-coverage
          path: /app/coverage-e2e/
          retention-days: 7

      - name: Summarize output
        id: summarize
        if: always() && inputs.should-run
        run: node .github/scripts/summarize-playwright.mjs

      - name: Write job summary
        if: always() && inputs.should-run
        uses: ./.github/actions/job-summary
        with:
          check-name: Playwright E2E
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # Always comments pass/fail from pr-gate, same as vitest.yml; fail-only
      # on a separate thread for a merge-queue caller.
      - name: Comment on PR
        if: always() && inputs.pr-number && inputs.should-run
        uses: ./.github/actions/pr-comment
        with:
          check-name: Playwright E2E
          marker-slug: playwright
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: comment
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}
