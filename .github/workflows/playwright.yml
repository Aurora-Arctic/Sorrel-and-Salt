name: Playwright E2E

# The Playwright e2e suite against a built and served site. workflow_call
# only, from pr-gate, and from e2e-cache.yml with `build-only`.
# claude-docs/ci/reusable-checks.md, "Reusable checks" is the walkthrough.
# Runs in Docker/Dockerfile.e2e's image, not the Alpine `testing` one:
# Playwright's Chromium has no musl support.
on:
  workflow_call:
    inputs:
      image:
        description: E2E testing image ref to run against (from build-e2e-image.yml)
        required: true
        type: string
      db-image:
        description: Postgres service image ref to run against (from build-db-image.yml, built once by the caller — same image vitest.yml uses)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: Set true when called for a merge queue — uses a separate, merge-queue-labeled comment thread and posts only on failure, instead of always commenting pass/fail. Nothing passes it today — merge-queue.yml was deleted with the five check workflows (MB.32) and is restored from git history when M7.A.1 turns the merge queue on.
        required: false
        type: boolean
        default: false
      should-run:
        description: >-
          Set false to skip the job before it starts, so a run the path filter
          rules out never pulls its container. pr-gate passes this from its
          path-filter output instead of putting an `if:` on the calling job, which
          would report one bare "playwright" check in place of "playwright / playwright"
          (claude-docs/design-decisions/mb.39-job-level-if-and-check-names.md).
          Defaults true so a caller that does no path filtering is unaffected.
        required: false
        type: boolean
        default: true
      build-only:
        description: >-
          Set true to build and start the servers, run no spec, and save the e2e
          build cache. Only e2e-cache.yml passes it, on a push to staging: a
          staging cache is the one a pull request's run can restore
          (claude-docs/testing/e2e.md).
        required: false
        type: boolean
        default: false
      suite:
        description: >-
          Which suite to run: `e2e` (the gate suite, the default) or `stories`
          (the story suite under tests/e2e/stories/, pr-gate.yml's `stories` job,
          never a required check). claude-docs/testing/acceptance.md.
        required: false
        type: string
        default: e2e
    outputs:
      outcome:
        description: >-
          The merged run's outcome, failure when a shard failed. The story suite's
          job reports success whatever its stories did (continue-on-error), so a
          caller reads this instead.
        value: ${{ jobs.playwright.outputs.outcome }}

permissions:
  contents: read
  # read: this job pulls images and pushes none.
  packages: read
  pull-requests: write

jobs:
  # One job per shard of the suite: Playwright's `--shard i/n` runs the i-th
  # share of the tests, each shard on a runner and database of its own. The
  # shards write blob reports, which the `playwright` job below merges
  # (claude-docs/ci/runner-budget.md, "Playwright shards").
  playwright-shard:
    if: inputs.should-run
    runs-on: ubuntu-26.04
    strategy:
      # A failed shard must not cancel the others: the merge needs every
      # shard's results.
      fail-fast: false
      matrix:
        # The build-only run builds once and runs no spec, so it takes one shard.
        shard: ${{ fromJSON(inputs.build-only && '[1]' || inputs.suite == 'stories' && '[1,2]' || '[1,2,3]') }}
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Chromium crashes on the container default 64 MB /dev/shm. The base
      # image already runs as root, and headless needs no `--no-sandbox`.
      options: --ipc=host
    services:
      # As vitest.yml's service; `POSTGRES_*` are inert, PGDATA being populated
      # at image build.
      postgres:
        image: ${{ inputs.db-image }}
        env:
          POSTGRES_USER: sorrel
          POSTGRES_PASSWORD: sorrel
          POSTGRES_DB: sorrel
        # Probed every second for the first ten while it starts, not after the
        # first 5s interval, so the job waits on the service rather than the clock.
        options: >-
          --health-cmd="pg_isready -U postgres -d sorrel_template"
          --health-interval=5s
          --health-start-period=10s
          --health-start-interval=1s
          --health-timeout=5s
          --health-retries=10
      # The inbox src/lib/mail.ts's `mailpit` transport sends to and
      # tests/e2e/mailpit.ts reads back; pinned to compose's tag.
      mailpit:
        image: axllent/mailpit:v1.31.2
        # Probed like postgres above.
        options: >-
          --health-cmd="/mailpit readyz"
          --health-interval=5s
          --health-start-period=10s
          --health-start-interval=1s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    env:
      # playwright.config.ts's webServer.reuseExistingServer reads this and
      # always starts a fresh server.
      CI: true
      # Where the blob reporter writes this shard's report.
      PLAYWRIGHT_BLOB_OUTPUT_DIR: /app/.reports/blob-report
      # tests/e2e/database.ts derives each worker's sorrel_e2e_<slot> URL from it.
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      # The webServer's production build needs a Better Auth secret, and a
      # primary admin address on the reserved `.invalid` domain.
      BETTER_AUTH_SECRET: local-dev-not-a-real-secret
      ADMIN_BOOTSTRAP_EMAIL: placeholder@admin-bootstrap.invalid
      # Read at send time by the runner and the served site alike; no secret.
      MAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://mailpit:8025
      # Four workers, so four slot servers, on the runner's four cores rather
      # than tests/e2e/slots.ts's half-the-CPUs default, which stays for local
      # runs: a test mostly waits on the browser, not on the cores. MB.236
      # measured it; claude-docs/testing/e2e.md, "E2E".
      E2E_WORKERS: 4
      # JS coverage is collected only when asked (tests/e2e/coverage.config.ts,
      # M11.18); CI asks, so the coverage artifact below and
      # summarize-playwright.mjs's table are unchanged.
      E2E_COVERAGE: '1'
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      # The e2e build's cache, restored here and saved only under build-only.
      # The absolute /app path, since hashFiles reads $GITHUB_WORKSPACE and the
      # build writes /app; distDir is playwright.config.ts's NEXT_DIST_DIR.
      # Before the run, because slot 0's webServer builds inside it. The
      # image's GNU tar serves actions/cache (claude-docs/testing/e2e.md).
      # A pull request restores what e2e-cache.yml saved on staging, since
      # GitHub never lets one pull request read another's cache. Restore and
      # save are split, not one actions/cache step, because that step would
      # also save on every pull request: 150-240 MB under its merge ref that
      # no other run can read, uploaded after the tests (MB.235).
      - name: Restore Next.js e2e build cache
        id: e2e-cache
        uses: actions/cache/restore@v6
        with:
          path: /app/.next-e2e/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('package-lock.json') }}-

      # The webServer builds and serves; the browser is in the image. `--reporter`
      # replaces the config's list here on purpose: a shard writes the blob its
      # merge job turns into the json, html and story reports, which come from
      # the config's reporters there. Under build-only every title matches `.`,
      # so no spec runs, but Playwright starts the webServers, and so the
      # build, before it loads a spec.
      #
      # `suite: stories` runs the story suite instead. `continue-on-error`
      # there because red scaffolds land on purpose and a story must never
      # fail the job; the merge job's `outcome` still reads the real result.
      # It sits on the step because a job that calls a workflow cannot carry it.
      - name: Run Playwright tests
        id: run
        continue-on-error: ${{ inputs.suite == 'stories' }}
        env:
          E2E_ARGS: ${{ inputs.build-only && '--grep-invert . --pass-with-no-tests' || '' }}
          SUITE: ${{ inputs.suite }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          set -o pipefail
          if [ "$SUITE" = stories ]; then
            npm run test:stories -- --shard "$SHARD" --reporter=list,blob 2>&1 | tee /app/output.log
          else
            # Unquoted on purpose: two flags, or nothing.
            npm run e2e -- --shard "$SHARD" --reporter=list,blob $E2E_ARGS 2>&1 | tee /app/output.log
          fi

      # Only e2e-cache.yml's run on staging saves, and only after a build that
      # succeeded: no always(), since a failed build's cache is not one to
      # hand on. The key is the restore step's, so both name the same entry,
      # and an exact hit has nothing new to save.
      - name: Save Next.js e2e build cache
        if: inputs.build-only && matrix.shard == 1 && steps.e2e-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /app/.next-e2e/cache
          key: ${{ steps.e2e-cache.outputs.cache-primary-key }}

      # Not failure-only: a coverage report on every run that ran a spec. One
      # artifact per suite and shard, since a name may appear once in a run;
      # playwright-coverage.yml merges them.
      - name: Upload coverage artifact
        if: always() && !inputs.build-only
        uses: actions/upload-artifact@v7
        with:
          name: playwright-coverage-${{ inputs.suite == 'stories' && 'stories' || 'gate' }}-${{ matrix.shard }}
          path: /app/.reports/coverage-e2e/
          retention-days: 7

      # The shard's report, which the merge job downloads. Whatever the shard
      # did, since a failed shard's blob holds its failures and their traces.
      # The name carries the suite: the two run in one workflow.
      - name: Upload blob report
        if: always() && !inputs.build-only
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ inputs.suite }}-${{ matrix.shard }}
          path: /app/.reports/blob-report/
          retention-days: 1

      # The slot servers' logs, which a blob does not hold.
      - name: Upload server logs
        if: failure() || steps.run.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-servers-${{ inputs.suite }}-${{ matrix.shard }}
          path: /app/.reports/e2e-servers/
          retention-days: 7

  # The required check, "playwright / playwright": the caller's job name, a
  # slash, this one. Keep this job named `playwright`; renaming it needs the
  # ruleset changed. It joins the shards, so it runs after a failed shard too
  # and fails when one failed.
  playwright:
    needs: [playwright-shard]
    # A run the path filter rules out skips the shards, and this job with them;
    # a build-only run has nothing to merge.
    if: ${{ !cancelled() && inputs.should-run && !inputs.build-only }}
    runs-on: ubuntu-26.04
    outputs:
      # Failure when a shard failed, whatever the merged run found, since a
      # shard that died before its blob leaves the merge nothing to count.
      outcome: ${{ needs.playwright-shard.result == 'success' && steps.run.outcome || 'failure' }}
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: /app
        shell: bash
    env:
      CI: true
      # Read by summarize-playwright.mjs and summarize-stories.mjs, and written
      # by the config's json reporter.
      PLAYWRIGHT_JSON_OUTPUT_NAME: /app/playwright-results.json
      # Read by the story reporter and summarize-stories.mjs.
      STORIES_JSON: /app/stories.json
      # The gate config derives the slot servers' URLs from it as it loads. No
      # database runs here and nothing connects.
      DATABASE_URL: postgres://sorrel:sorrel@localhost:5432/sorrel
      BETTER_AUTH_SECRET: local-dev-not-a-real-secret
      ADMIN_BOOTSTRAP_EMAIL: placeholder@admin-bootstrap.invalid
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      # Every shard of this suite, the other suite's blobs left out by the
      # name. `merge-multiple` puts each blob's file, named for its shard,
      # into the one folder.
      - name: Download the shards' reports
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-${{ inputs.suite }}-*
          merge-multiple: true
          path: /app/.reports/blob-reports

      # The config's own reporters, so the merge writes what a single run did:
      # the list, the json report, the html report, and for the stories the
      # checklist. The suite's config, for the story reporter and the folder.
      - name: Merge the shards' reports
        id: run
        continue-on-error: ${{ inputs.suite == 'stories' }}
        env:
          CONFIG: ${{ inputs.suite == 'stories' && 'playwright.stories.config.ts' || 'playwright.config.ts' }}
        run: |
          set -o pipefail
          npx playwright merge-reports --config "$CONFIG" /app/.reports/blob-reports 2>&1 | tee /app/output.log

      - name: Summarize output
        id: summarize
        if: always()
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          if [ "$SUITE" = stories ]; then
            node .github/scripts/summarize-stories.mjs
          else
            node .github/scripts/summarize-playwright.mjs
          fi

      # A failing story fails only its step, under continue-on-error, so the step's outcome is read as well as
      # the job's. Each suite names its own artifact: the two run in one workflow, where a name may appear once.
      # After the summary, which says whether a test failed and then passed on retry: that run is green, and
      # its report holds the trace of the first attempt.
      - name: Upload Playwright report
        if: failure() || steps.run.outcome == 'failure' || steps.summarize.outputs.flaky == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.suite == 'stories' && 'stories-report' || 'playwright-report' }}
          path: /app/.reports/playwright-report/
          retention-days: 7

      - name: Write job summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          check-name: ${{ inputs.suite == 'stories' && 'Stories' || 'Playwright E2E' }}
          outcome: ${{ needs.playwright-shard.result == 'success' && steps.run.outcome || 'failure' }}
          log-file: /app/output.log
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}
          duration: ${{ steps.summarize.outputs.duration }}

      # This suite's section of the one Playwright comment (.github/actions/pr-comment).
      - name: Comment on PR
        if: ${{ !cancelled() && inputs.pr-number }}
        uses: ./.github/actions/pr-comment
        with:
          check-name: Playwright
          marker-slug: playwright
          section: ${{ inputs.suite == 'stories' && 'stories' || 'gate' }}
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ needs.playwright-shard.result == 'success' && steps.run.outcome || 'failure' }}
          log-file: /app/output.log
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}
          duration: ${{ steps.summarize.outputs.duration }}

      # The last step, so the summary and comment above are written first. The
      # story suite never fails its job (continue-on-error), so it skips this.
      - name: Fail when a shard failed
        if: ${{ !cancelled() && inputs.suite != 'stories' }}
        env:
          SHARDS: ${{ needs.playwright-shard.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "::error::A shard finished $SHARDS."
            exit 1
          fi
