name: Checks

# Reusable check matrix (MB.32): one job description for lint, format,
# typecheck, build and audit, which were five near-identical ~140-line
# workflows until this file replaced them. They only ever differed in one npm
# script and one step that summarised that script's output — the container,
# the root-user option, the checkout, the job-summary and the pr-comment
# scaffolding were copied five times. The summarising steps now live beside
# summarize-vitest.mjs in .github/scripts/, one file per leg.
#
# Called via workflow_call from pr-gate.yml, never triggered directly. Each
# leg reports as `checks / <name>` — the caller's job id, then this job's
# `name:`, which is why `name: ${{ matrix.name }}` below is load-bearing
# rather than cosmetic: without it every leg would report as
# `checks / check (lint)` and friends.
#
# vitest.yml and playwright.yml are deliberately NOT legs here. Both bring a
# `services: postgres:` block, a `db-image` input and their own artifact
# uploads, which is a different job shape rather than a different npm script.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: >-
          Set true when called for a merge queue — uses a separate,
          merge-queue-labeled comment thread and posts only on failure (no
          minimize-on-success). Nothing passes it today: merge-queue.yml was
          deleted with the five workflows (MB.32) because the merge queue is
          off until M7.A.1 turns it on, and that workflow is restored from git
          history when it does. The input stays so the restore is a revert
          rather than a redesign, and so this file matches vitest.yml and
          playwright.yml, which kept theirs.
        required: false
        type: boolean
        default: false
      # One flag per path-filtered leg, rather than one `should-run` for the
      # whole matrix: pr-gate.yml filters lint, typecheck and build
      # independently. format and audit have no flag at all — format because
      # Prettier covers .md/.json too and "did formatting change" is cheap and
      # universal, audit because it is non-blocking and PR-only.
      #
      # These skip the work inside the leg; pr-gate must never put an `if:` on
      # the job that calls this workflow. A job-level `if:` makes GitHub report
      # a differently-named, bare check run ("checks" instead of
      # "checks / lint") when skipped, which never satisfies a
      # "checks / lint" required status check and leaves the PR stuck. Every
      # leg runs either way; a leg whose flag is false exits after checkout.
      run-lint:
        description: Set false to skip the lint run while still completing its leg under its normal name
        required: false
        type: boolean
        default: true
      run-typecheck:
        description: Set false to skip the typecheck run while still completing its leg under its normal name
        required: false
        type: boolean
        default: true
      run-build:
        description: Set false to skip the build while still completing its leg under its normal name
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  check:
    # What each leg reports as, after the caller's own job id: `checks / lint`,
    # `checks / format`, and so on. See this file's header comment.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Never fail-fast. A cancelled leg reports its check as cancelled, which
      # a required status check treats as unsatisfied — so one failing leg
      # would block the PR on four checks that never got to run, and a rerun
      # would be the only way to see the rest.
      fail-fast: false
      matrix:
        include:
          - name: lint
            label: Lint
            command: npm run lint
            summarize: .github/scripts/summarize-lint.sh
            comment: minimize
          - name: format
            label: Format Check
            command: npm run format:check
            summarize: .github/scripts/summarize-format.sh
            comment: minimize
          - name: typecheck
            label: Typecheck
            command: npm run typecheck
            summarize: .github/scripts/summarize-typecheck.sh
            comment: minimize
          # M0.33's gate (missing index.stories.tsx) and M0.36's wrapper around
          # `ladle build` (a story that fails to bundle) ride along on the build
          # leg, chained with `&&` so the first failure still fails the check:
          # both are plain npm scripts, per M0.33's decision record, and this
          # leg already runs on every push that could touch a component.
          # No PR comment, matching build.yml before the collapse — a failing
          # build's own check and job summary are the report.
          - name: build
            label: Build
            command: npm run build && npm run check:stories && npm run workshop:build
            summarize: ''
            comment: ''
          # Non-blocking: `npm audit` exits non-zero when it finds
          # vulnerabilities, and the trailing `|| true` is what keeps that from
          # failing the PR gate. It comments through its own script rather than
          # pr-comment — see the "Comment audit results on PR" step below.
          - name: audit
            label: Dependency Audit
            command: 'npm audit --json > audit-results.json || true'
            summarize: ''
            comment: ''
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user (node, non-root) can't write to the runner's
      # bind-mounted _temp/_runner_file_commands dir, which actions/checkout (and
      # any JS action using core.saveState/setOutput) needs — EACCES otherwise.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # container: jobs default to sh, not bash, unlike normal runs-on jobs —
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container
        # sh (dash) doesn't support `set -o pipefail`, used below.
        shell: bash
    env:
      # Both are for the build leg only, and inert in the other four.
      # `npm run build` traces /api/auth/[...all] (M2.2), which imports
      # src/lib/auth.ts and, through it, src/db/connection.ts.
      # DATABASE_URL: connection.ts throws at import if unset, always — no
      # `services: postgres:` needed, since the driver connects lazily and
      # the build never issues a query, only a syntactically valid URL.
      # BETTER_AUTH_SECRET: `npm run build` runs at NODE_ENV=production,
      # where Better Auth's own check (src/lib/auth.ts) requires a real
      # value — this fixed, non-secret placeholder satisfies it.
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      BETTER_AUTH_SECRET: local-dev-not-a-real-secret
    steps:
      # Resolves the three `run-*` inputs down to one flag for this leg, so
      # every step below reads a single step output instead of re-deriving
      # which input belongs to which matrix name. Runs before the checkout —
      # it needs nothing from the repository.
      #
      # An unset flag means "run": a caller that omits an input gets GitHub's
      # `default: true`, and `act` (which does not apply workflow_call input
      # defaults) gets the same answer from the `:-true` fallback instead of
      # silently passing a check it never ran.
      - name: Resolve this leg's should-run flag
        id: flags
        env:
          CHECK: ${{ matrix.name }}
          RUN_LINT: ${{ inputs.run-lint }}
          RUN_TYPECHECK: ${{ inputs.run-typecheck }}
          RUN_BUILD: ${{ inputs.run-build }}
        run: |
          case "$CHECK" in
            lint) flag="$RUN_LINT" ;;
            typecheck) flag="$RUN_TYPECHECK" ;;
            build) flag="$RUN_BUILD" ;;
            # format and audit are deliberately unfiltered — see the inputs.
            *) flag=true ;;
          esac
          echo "should-run=${flag:-true}" >> "$GITHUB_OUTPUT"

      - name: Checkout into /app
        if: steps.flags.outputs.should-run == 'true'
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      # Next.js persists an incremental build cache to .next/cache — see
      # https://nextjs.org/docs/app/guides/ci-build-caching. checkout-to-app
      # populates both $GITHUB_WORKSPACE (what hashFiles reads) and /app
      # (where npm run build actually writes .next/cache), so the cache path
      # below is the absolute /app location, same reasoning as the /app
      # log-file paths passed to job-summary and pr-comment.
      - name: Cache Next.js build cache
        if: matrix.name == 'build' && steps.flags.outputs.should-run == 'true'
        uses: actions/cache@v6
        with:
          path: /app/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # The brace group keeps `2>&1 | tee` applying to the whole command rather
      # than to the last thing in it — `cmd || true 2>&1 | tee` would redirect
      # `true`, not the audit.
      - name: Run ${{ matrix.name }}
        id: run
        if: steps.flags.outputs.should-run == 'true'
        run: |
          set -o pipefail
          {
            ${{ matrix.command }}
          } 2>&1 | tee /app/output.log

      # Turns the tool's raw output into the one-line stat and the capped,
      # collapsible breakdown that job-summary and pr-comment render. Runs
      # regardless of outcome — a technically passing lint can still have
      # warnings worth reporting. The build and audit legs have no summarising
      # step, so `matrix.summarize` is empty and this step is skipped.
      - name: Summarize output
        id: summarize
        if: always() && matrix.summarize != '' && steps.flags.outputs.should-run == 'true'
        run: bash ${{ matrix.summarize }}

      # Skipped for audit: the step it reports on cannot fail (see the matrix
      # entry), so this would write "Dependency Audit passed" directly above a
      # PR comment warning about the vulnerabilities it found. That leg's own
      # comment is its report.
      - name: Write job summary
        if: always() && matrix.name != 'audit' && steps.flags.outputs.should-run == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: ${{ matrix.label }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # Fail-only from pr-gate (resolving a prior failure comment on success),
      # fail-only on a separate merge-queue-labeled thread when
      # merge-queue: true (no action at all on success) — see
      # .github/actions/pr-comment. Legs with an empty `comment` don't call it.
      - name: Comment on PR
        if: always() && inputs.pr-number && matrix.comment != '' && steps.flags.outputs.should-run == 'true'
        uses: ./.github/actions/pr-comment
        with:
          check-name: ${{ matrix.label }}
          marker-slug: ${{ matrix.name }}
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: ${{ matrix.comment }}
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # The audit leg's own comment: a severity table and a package breakdown,
      # reported as a [!WARNING] on a step that passed, which pr-comment's
      # pass/fail vocabulary cannot express. Guarded on pr-number because it is
      # optional on this workflow (it was required on audit.yml), per the rule
      # M0.17 set — a reusable check must not use an input unguarded that its
      # caller can leave empty.
      - name: Comment audit results on PR
        if: matrix.name == 'audit' && inputs.pr-number
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
        with:
          script: |
            const comment = require('/app/.github/scripts/audit-comment.cjs');
            await comment({ github, context });
