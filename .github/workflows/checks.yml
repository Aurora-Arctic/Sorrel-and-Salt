name: Checks

# One matrix job for lint, format, typecheck, build, destructive-ddl and
# audit, each reporting as `checks / <name>`. workflow_call only, from
# pr-gate.yml. claude-docs/ci.md, "Reusable checks" is the walkthrough.
#
# vitest.yml and playwright.yml are not legs: a `services: postgres:` block
# and artifact uploads are a different job shape, not a different script.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: >-
          Set true when called for a merge queue — uses a separate,
          merge-queue-labeled comment thread and posts only on failure (no
          minimize-on-success). Nothing passes it today: merge-queue.yml was
          deleted with the five workflows (MB.32) because the merge queue is
          off until M7.A.1 turns it on, and that workflow is restored from git
          history when it does. The input stays so the restore is a revert
          rather than a redesign, and so this file matches vitest.yml and
          playwright.yml, which kept theirs.
        required: false
        type: boolean
        default: false
      # One flag per path-filtered leg, since pr-gate.yml filters them
      # independently; format and audit are unfiltered. The flags skip work
      # INSIDE the leg: a job-level `if:` on the calling job would make GitHub
      # report a bare check name ("checks", not "checks / lint") that never
      # satisfies a required check, leaving the PR stuck forever.
      run-lint:
        description: Set false to skip the lint run while still completing its leg under its normal name
        required: false
        type: boolean
        default: true
      run-typecheck:
        description: Set false to skip the typecheck run while still completing its leg under its normal name
        required: false
        type: boolean
        default: true
      run-build:
        description: Set false to skip the build while still completing its leg under its normal name
        required: false
        type: boolean
        default: true
      run-destructive-ddl:
        description: Set false to skip the destructive-DDL scan while still completing its leg under its normal name
        required: false
        type: boolean
        default: true
      destructive-ddl-files:
        description: >-
          JSON array (string) of migration files new/changed in this PR, from
          pr-gate.yml's dorny/paths-filter `list-files: json` output, passed to the
          destructive-ddl leg as DESTRUCTIVE_DDL_FILES. An empty array/string means
          no migration files changed — the script then checks nothing rather than
          falling back to diffing the branch (that fallback is only for a bare local
          `npm run check:destructive-ddl`; see the script's header). The script
          ignores anything that is not a `*.sql` file, so the `meta/*.json` Drizzle
          writes beside each migration cannot be scanned as SQL.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  check:
    # Dropping this renames every leg to `checks / check (<name>)`.
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      # A cancelled leg reports cancelled, which a required check reads as
      # unsatisfied — one failure would block the PR on five legs never run.
      fail-fast: false
      matrix:
        include:
          - name: lint
            label: Lint
            command: npm run lint
            summarize: .github/scripts/summarize-lint.sh
            comment: minimize
          - name: format
            label: Format Check
            command: npm run format:check
            summarize: .github/scripts/summarize-format.sh
            comment: minimize
          - name: typecheck
            label: Typecheck
            command: npm run typecheck
            summarize: .github/scripts/summarize-typecheck.sh
            comment: minimize
          # The workshop build is chained so a failed app build stops first.
          # No PR comment: the check itself is the report.
          - name: build
            label: Build
            command: npm run build && npm run workshop:build
            summarize: ''
            comment: ''
          # Blocking. The script's own output is the report, so no summariser.
          - name: destructive-ddl
            label: Destructive DDL
            command: npm run check:destructive-ddl
            summarize: ''
            comment: minimize
          # Non-blocking and never a required check, hence `|| true`. Reports
          # through its own step below.
          - name: audit
            label: Dependency Audit
            command: 'npm audit --json > audit-results.json || true'
            summarize: ''
            comment: ''
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's bind-mounted
      # _temp/_runner_file_commands; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    env:
      # Build leg only. `npm run build` traces src/db/connection.ts (throws at
      # import on an unset URL, issues no query) and src/lib/auth.ts (needs a
      # secret at NODE_ENV=production, which the `build` script forces).
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      BETTER_AUTH_SECRET: local-dev-not-a-real-secret
      # destructive-ddl leg only. Always set: the script reads set-but-empty
      # as "scan nothing" and unset as "diff the branch", which CI must never do.
      DESTRUCTIVE_DDL_FILES: ${{ inputs.destructive-ddl-files }}
    steps:
      # One flag for this leg. Unset means run: `act` applies no workflow_call
      # defaults, and must not pass a check it never ran.
      - name: Resolve this leg's should-run flag
        id: flags
        env:
          CHECK: ${{ matrix.name }}
          RUN_LINT: ${{ inputs.run-lint }}
          RUN_TYPECHECK: ${{ inputs.run-typecheck }}
          RUN_BUILD: ${{ inputs.run-build }}
          RUN_DESTRUCTIVE_DDL: ${{ inputs.run-destructive-ddl }}
        run: |
          case "$CHECK" in
            lint) flag="$RUN_LINT" ;;
            typecheck) flag="$RUN_TYPECHECK" ;;
            build) flag="$RUN_BUILD" ;;
            destructive-ddl) flag="$RUN_DESTRUCTIVE_DDL" ;;
            # format and audit are unfiltered.
            *) flag=true ;;
          esac
          echo "should-run=${flag:-true}" >> "$GITHUB_OUTPUT"

      - name: Checkout into /app
        if: steps.flags.outputs.should-run == 'true'
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      # The absolute /app path: hashFiles reads $GITHUB_WORKSPACE, the build
      # writes /app. Restore and save run inside the container, hence GNU tar
      # and zstd in Dockerfile.node's `testing` stage.
      - name: Cache Next.js build cache
        if: matrix.name == 'build' && steps.flags.outputs.should-run == 'true'
        uses: actions/cache@v6
        with:
          path: /app/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # The brace group keeps `2>&1 | tee` on the whole command, not on `|| true`.
      - name: Run ${{ matrix.name }}
        id: run
        if: steps.flags.outputs.should-run == 'true'
        run: |
          set -o pipefail
          {
            ${{ matrix.command }}
          } 2>&1 | tee /app/output.log

      # Regardless of outcome: a passing lint can still carry warnings.
      - name: Summarize output
        id: summarize
        if: always() && matrix.summarize != '' && steps.flags.outputs.should-run == 'true'
        run: bash ${{ matrix.summarize }}

      # Skipped for audit, whose own step below writes both summary and
      # comment — "passed" above a table of vulnerabilities would mislead.
      - name: Write job summary
        if: always() && matrix.name != 'audit' && steps.flags.outputs.should-run == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: ${{ matrix.label }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # An empty `comment` skips the step; .github/actions/pr-comment has the modes.
      - name: Comment on PR
        if: always() && inputs.pr-number && matrix.comment != '' && steps.flags.outputs.should-run == 'true'
        uses: ./.github/actions/pr-comment
        with:
          check-name: ${{ matrix.label }}
          marker-slug: ${{ matrix.name }}
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: ${{ matrix.comment }}
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # The audit's own report: a [!WARNING] on a step that passed, which
      # job-summary and pr-comment's pass/fail vocabulary cannot say. The
      # script checks for a PR number itself, so the summary still appears
      # under `act`.
      - name: Summarize and comment audit results
        if: matrix.name == 'audit'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
        with:
          script: |
            const report = require('/app/.github/scripts/audit-comment.cjs');
            await report({ github, context, core });
