name: Checks

# One plain job each for lint, unused, format, typecheck, codegen, build,
# destructive-ddl, migration-order and audit, reporting as `checks / <name>`. workflow_call only, from
# pr-gate.yml. claude-docs/ci/reusable-checks.md, "Reusable checks" is the walkthrough.
#
# The jobs share their steps through .github/actions/run-check. A path-filtered
# job carries a job-level `if:` on its `run-*` input, so a run the filter rules
# out is skipped before it pulls its container; format, codegen and audit are
# unfiltered. A job name is the check name, so each job sets `name:` to the
# name the ruleset and the docs use. The `if:` reads the input as text so an
# unset flag, which `act` leaves empty, still runs the check.
# (claude-docs/design-decisions/mb.39-job-level-if-and-check-names.md)
#
# vitest.yml and playwright.yml are separate workflows: a `services: postgres:`
# block and artifact uploads are a different job shape, not a different script.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: >-
          Set true when called for a merge queue — uses a separate,
          merge-queue-labeled comment thread and posts only on failure (no
          minimize-on-success). Nothing passes it today: merge-queue.yml was
          deleted with the five workflows (MB.32) because the merge queue is
          off until M7.A.1 turns it on, and that workflow is restored from git
          history when it does. The input stays so the restore is a revert
          rather than a redesign, and so this file matches vitest.yml and
          playwright.yml, which kept theirs.
        required: false
        type: boolean
        default: false
      # One flag per path-filtered job, since pr-gate.yml filters them
      # independently; format, codegen and audit are unfiltered.
      run-lint:
        description: Set false to skip the lint run before its job starts
        required: false
        type: boolean
        default: true
      run-typecheck:
        description: Set false to skip the typecheck run before its job starts
        required: false
        type: boolean
        default: true
      run-build:
        description: Set false to skip the build before its job starts
        required: false
        type: boolean
        default: true
      run-destructive-ddl:
        description: Set false to skip the destructive-DDL scan before its job starts
        required: false
        type: boolean
        default: true
      run-migration-order:
        description: Set false to skip the migration-order check before its job starts
        required: false
        type: boolean
        default: true
      migration-order-base:
        description: >-
          The PR's base branch, which the migration-order leg fetches and reads
          its committed journal from as MIGRATION_ORDER_BASE. Only the caller
          sees the pull request; empty means `staging`, which is what `act`
          runs against.
        required: false
        type: string
        default: ''
      destructive-ddl-files:
        description: >-
          JSON array (string) of migration files new/changed in this PR, from
          pr-gate.yml's dorny/paths-filter `list-files: json` output, passed to the
          destructive-ddl leg as DESTRUCTIVE_DDL_FILES. An empty array/string means
          no migration files changed — the script then checks nothing rather than
          falling back to diffing the branch (that fallback is only for a bare local
          `npm run check:destructive-ddl`; see the script's header). The script
          ignores anything that is not a `*.sql` file, so the `meta/*.json` Drizzle
          writes beside each migration cannot be scanned as SQL.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  lint:
    name: lint
    if: ${{ format('{0}', inputs.run-lint) != 'false' }}
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's bind-mounted
      # _temp/_runner_file_commands; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - uses: ./.github/actions/run-check
        with:
          label: Lint
          slug: lint
          command: npm run lint
          summarize: .github/scripts/summarize-lint.sh
          comment: minimize
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}

  # Non-blocking and never a required check: the run-check step continues on
  # error, so knip's findings reach the PR comment without failing the job.
  # It shares lint's path filter.
  unused:
    name: unused
    if: ${{ format('{0}', inputs.run-lint) != 'false' }}
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's bind-mounted
      # _temp/_runner_file_commands; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - uses: ./.github/actions/run-check
        continue-on-error: true
        with:
          label: Unused Code (Non-Blocking)
          slug: unused
          command: npm run lint:unused
          comment: minimize
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}

  format:
    name: format
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's bind-mounted
      # _temp/_runner_file_commands; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - uses: ./.github/actions/run-check
        with:
          label: Format Check
          slug: format
          command: npm run format:check
          summarize: .github/scripts/summarize-format.sh
          comment: minimize
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}

  typecheck:
    name: typecheck
    if: ${{ format('{0}', inputs.run-typecheck) != 'false' }}
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's bind-mounted
      # _temp/_runner_file_commands; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - uses: ./.github/actions/run-check
        with:
          label: Typecheck
          slug: typecheck
          command: npm run typecheck
          summarize: .github/scripts/summarize-typecheck.sh
          comment: minimize
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}

  # Blocking and unfiltered. src/gql/ is committed generated output
  # (claude-docs/graphql/client-types.md): a document added, changed or
  # removed without `npm run codegen` leaves it stale, and `status`
  # sees an added file as well as a changed or deleted one.
  codegen:
    name: codegen
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's bind-mounted
      # _temp/_runner_file_commands; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - uses: ./.github/actions/run-check
        with:
          label: Codegen
          slug: codegen
          command: >-
            npm run codegen &&
            stale="$(git -c safe.directory='*' status --porcelain -- src/gql)" &&
            { [ -z "$stale" ] || { printf 'src/gql is stale: run npm run codegen and commit it.\n%s\n' "$stale"; exit 1; }; }
          comment: minimize
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}

  # The workshop build is chained so a failed app build stops first.
  # No PR comment: the check itself is the report.
  build:
    name: build
    if: ${{ format('{0}', inputs.run-build) != 'false' }}
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's bind-mounted
      # _temp/_runner_file_commands; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    env:
      # `npm run build` traces src/db/connection.ts (throws at import on an
      # unset URL, issues no query) and src/lib/auth.ts (needs a secret at
      # NODE_ENV=production, which the `build` script forces).
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      BETTER_AUTH_SECRET: local-dev-not-a-real-secret
      # auth.ts refuses to load without it at NODE_ENV=production. `.invalid`
      # is reserved (RFC 2606), so no real sign-in can ever match it.
      ADMIN_BOOTSTRAP_EMAIL: placeholder@admin-bootstrap.invalid
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - uses: ./.github/actions/run-check
        with:
          label: Build
          slug: build
          command: npm run build && npm run workshop:build

  # Blocking. The script's own output is the report, so no summariser.
  destructive-ddl:
    name: destructive-ddl
    if: ${{ format('{0}', inputs.run-destructive-ddl) != 'false' }}
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's bind-mounted
      # _temp/_runner_file_commands; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    env:
      # Always set: the script reads set-but-empty as "scan nothing" and unset
      # as "diff the branch", which CI must never do.
      DESTRUCTIVE_DDL_FILES: ${{ inputs.destructive-ddl-files }}
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - uses: ./.github/actions/run-check
        with:
          label: Destructive DDL
          slug: destructive-ddl
          command: npm run check:destructive-ddl
          comment: minimize
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}

  # Blocking. The checkout is the PR's merge commit, shallow, so the
  # base is fetched for its journal; the script's output is the report.
  migration-order:
    name: migration-order
    if: ${{ format('{0}', inputs.run-migration-order) != 'false' }}
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's bind-mounted
      # _temp/_runner_file_commands; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    env:
      MIGRATION_ORDER_BASE: ${{ inputs.migration-order-base }}
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - uses: ./.github/actions/run-check
        with:
          label: Migration Order
          slug: migration-order
          command: >-
            base="${MIGRATION_ORDER_BASE:-staging}" &&
            git -c safe.directory='*' fetch --no-tags --depth=1 origin
            "+refs/heads/${base}:refs/remotes/origin/${base}" &&
            npm run check:migration-order -- --base "origin/${base}"
          comment: minimize
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}

  # Non-blocking and never a required check, hence `|| true`. Reports
  # through its own step below.
  audit:
    name: audit
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's bind-mounted
      # _temp/_runner_file_commands; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - name: Run audit
        id: run
        run: |
          set -o pipefail
          {
            npm audit --json > audit-results.json || true
          } 2>&1 | tee /app/output.log

      # A [!WARNING] on a step that passed, which job-summary and pr-comment's
      # pass/fail vocabulary cannot say. The script checks for a PR number
      # itself, so the summary still appears under `act`.
      - name: Summarize and comment audit results
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
        with:
          script: |
            const report = require('/app/.github/scripts/audit-comment.cjs');
            await report({ github, context, core });
