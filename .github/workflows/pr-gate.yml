name: PR Gate

# The gate on every PR into `main`, `staging` or `release/*`: it fans out to
# `checks` (lint, format, typecheck, build, destructive-ddl and a
# non-blocking npm audit, as one matrix), `vitest`, `playwright` and
# `gitflow`. format, audit and gitflow always run; the rest are path-filtered
# by the `changes` job below. claude-docs/ci.md is the walkthrough.
#
# ⚠️ **NO JOB IN THIS FILE MAY CARRY A JOB-LEVEL `if:`.** Every check reports
# as "<caller job> / <called job>" — `checks / lint`, `vitest / vitest`,
# `gitflow / gitflow` — and those are the names a branch ruleset requires. A
# job-level `if:` does not stop the check reporting; it makes GitHub report it
# under a different, BARE name ("checks" instead of "checks / lint"), and that
# bare name never satisfies the required check, **permanently blocking the
# PR**. So every job here runs unconditionally and passes its filter result
# down as a `workflow_call` input instead — `run-lint`/`run-typecheck`/
# `run-build`/`run-destructive-ddl` on checks.yml, `should-run` elsewhere —
# which skips the work inside the called workflow and leaves the job, and its
# check name, unchanged either way.
#
# `edited` is in the trigger types so that retargeting a PR's base branch
# re-runs gitflow's source->target validation without a new push.
#
# `build-db-image` is a job here rather than a nested `workflow_call` inside
# vitest.yml and playwright.yml: two nested calls would each pay for their own
# checkout, docker login and buildx setup for an image the content-addressed
# tag makes identical either way.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - staging
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # Which downstream checks this push actually needs, so a docs-only edit
  # does not pay for lint/typecheck/build. format is deliberately ungated —
  # Prettier covers .md and .json too.
  #
  # **Every filter also matches whatever runs its check**: the workflow, its
  # summarising script, this file and .github/actions/**. Editing what runs a
  # check must rerun it rather than leave it silently unverified.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      build: ${{ steps.filter.outputs.build }}
      destructive_ddl: ${{ steps.filter.outputs.destructive_ddl }}
      destructive_ddl_migrations_files: ${{ steps.filter.outputs.destructive_ddl_migrations_files }}
      vitest: ${{ steps.filter.outputs.vitest }}
      playwright: ${{ steps.filter.outputs.playwright }}
    steps:
      - name: Determine changed-file categories
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # Adds a `<filter>_files` JSON array beside every filter's boolean.
          # Only destructive_ddl_migrations's is read; it is a step-level
          # setting rather than per-filter, so the rest are simply unused.
          list-files: json
          filters: |
            shared: &shared
              - '.github/workflows/pr-gate.yml'
              - '.github/actions/**'
            # `Docker/Dockerfile.node` is on lint/typecheck/build and only
            # those three: it defines the `testing` image each of them runs
            # inside, so a change to it can break the check without touching a
            # source file. Deliberately NOT in `*shared`, which also feeds
            # destructive_ddl — flipping that leg true on a Dockerfile change
            # would hand the script an empty file list for nothing.
            lint:
              - *shared
              - '.github/workflows/checks.yml'
              - '.github/scripts/summarize-lint.sh'
              - 'Docker/Dockerfile.node'
              - '.oxlintrc.json'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - 'package.json'
              - 'package-lock.json'
            typecheck:
              - *shared
              - '.github/workflows/checks.yml'
              - '.github/scripts/summarize-typecheck.sh'
              - 'Docker/Dockerfile.node'
              - '**/*.ts'
              - '**/*.tsx'
              - 'tsconfig.json'
              - 'package-lock.json'
            build:
              - *shared
              - '.github/workflows/checks.yml'
              - 'Docker/Dockerfile.node'
              - 'src/**'
              - 'public/**'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
            destructive_ddl:
              - *shared
              - '.github/workflows/checks.yml'
              - 'scripts/check-destructive-ddl.ts'
              - 'src/db/migrations/**'
            # Deliberately narrower than destructive_ddl above, whose job is
            # to decide whether the leg runs at all. paths-filter's list-files
            # output includes every changed file matching ANY of a filter's
            # patterns, so destructive_ddl's own `_files` would hand a changed
            # pr-gate.yml to check-destructive-ddl.ts as if it were SQL. This
            # filter only feeds `destructive-ddl-files`.
            #
            # `*.sql` rather than `**`, so the meta/*.json Drizzle writes
            # beside each migration never reaches the script — the script
            # ignores non-`.sql` too, and this is the belt to that braces.
            destructive_ddl_migrations:
              - 'src/db/migrations/*.sql'
            # `tests/**` is the entry that matters most: the suite lives
            # there rather than under `src/**`, so without it a test-only PR —
            # the one kind of PR whose entire content is what this job runs —
            # would skip the job and report green. `.ladle/config.mjs` is the
            # same trap one level down: tests/guards/ pins its theme default,
            # and the edit that guard exists to catch is the edit that would
            # not have run it. The configs and setup file are listed
            # explicitly because they are not under `src/**` either.
            vitest:
              - *shared
              - '.github/workflows/vitest.yml'
              - '.github/workflows/build-db-image.yml'
              - '.github/scripts/summarize-vitest.mjs'
              - '.github/scripts/summarize-stories.mjs'
              - '.github/scripts/lib/**'
              - 'src/**'
              - 'tests/**'
              - '.ladle/config.mjs'
              - 'vitest.config.mts'
              - 'vitest.stories.config.mts'
              - 'vitest.setup.ts'
              - 'package.json'
              - 'package-lock.json'
            # Matches build-e2e-image.yml/Dockerfile.e2e — the image this
            # job's container runs in — and build-db-image.yml, same reasoning
            # as vitest's filter above.
            playwright:
              - *shared
              - '.github/workflows/playwright.yml'
              - '.github/workflows/build-e2e-image.yml'
              - '.github/workflows/build-db-image.yml'
              - '.github/scripts/summarize-playwright.mjs'
              - '.github/scripts/lib/**'
              - 'Docker/Dockerfile.e2e'
              - 'src/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'next.config.ts'
              - 'package.json'
              - 'package-lock.json'

  # `cancel-in-progress: false`, unlike every job below: cancelling this
  # mid-push can freeze a half-written layer into the shared GHA layer cache
  # and its content-addressed tag, which every later run with the same hash
  # then keeps reusing — a corruption that does not self-heal on retry. A
  # superseded run queues behind the one in flight instead. The jobs below
  # share no mutable state and are cheap to rerun, so they stay cancellable.
  build-image:
    concurrency:
      group: pr-gate-build-image-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-image.yml

  # One matrix job covering lint, format, typecheck, build, destructive-ddl
  # and audit, each reporting as `checks / <name>`. The four path-filtered
  # legs take their flag from `changes`; format and audit are unfiltered
  # inside that workflow.
  checks:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-checks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/checks.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see checks.yml's run-* inputs for why.
      run-lint: ${{ needs.changes.outputs.lint == 'true' }}
      run-typecheck: ${{ needs.changes.outputs.typecheck == 'true' }}
      run-build: ${{ needs.changes.outputs.build == 'true' }}
      run-destructive-ddl: ${{ needs.changes.outputs.destructive_ddl == 'true' }}
      # The one thing a called workflow cannot read off its own trigger: it
      # sees no `pull_request` event, so only the caller can say which
      # migration files changed.
      destructive-ddl-files: ${{ needs.changes.outputs.destructive_ddl_migrations_files }}

  # The preseeded Postgres image both vitest and playwright need for their
  # `services: postgres:` block — built once here and passed down as
  # `db-image`. Unconditional and uncancellable for the same reasons
  # build-image above is.
  build-db-image:
    concurrency:
      group: pr-gate-build-db-image-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-db-image.yml

  vitest:
    needs: [build-image, build-db-image, changes, gitflow]
    concurrency:
      group: pr-gate-vitest-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/vitest.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      db-image: ${{ needs.build-db-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see vitest.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.vitest == 'true' }}

  # The dedicated Playwright image: build-image.yml's shared `testing` image
  # is Alpine and carries no browser, so playwright.yml runs in this one
  # instead. Unconditional and uncancellable, like build-image above.
  build-e2e-image:
    concurrency:
      group: pr-gate-build-e2e-image-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-e2e-image.yml

  playwright:
    needs: [build-e2e-image, build-db-image, changes, gitflow]
    concurrency:
      group: pr-gate-playwright-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/playwright.yml
    with:
      image: ${{ needs.build-e2e-image.outputs.image }}
      db-image: ${{ needs.build-db-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see playwright.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.playwright == 'true' }}

  # Ungated, and needs no image — it reads the PR's head and base refs and
  # nothing else. Every check job above `needs: gitflow`, so a PR from the
  # wrong source branch burns no CI time on the rest.
  gitflow:
    concurrency:
      group: pr-gate-gitflow-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/gitflow.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
