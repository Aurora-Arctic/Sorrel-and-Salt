name: PR Gate

# Runs on every pull request targeting `main`, `staging`, or `release/*`. Fans
# out to every check ported so far (lint, format, typecheck, build, vitest,
# playwright, destructive-ddl, gitflow) plus a non-blocking npm audit, gating
# the PR before it can be merged. format and gitflow always run; the rest are
# path-filtered by the `changes` job below so a PR only pays for the checks
# its changed files could actually affect.
#
# `vitest` and `playwright` (M1.14) are real `workflow_call` checks now, not
# the M0-era no-op stubs — job names are unchanged from the stubs, so no
# required-status-check rename was ever needed. `playwright` runs in its own
# dedicated e2e image (`build-e2e-image` below), not `build-image`'s shared
# `testing` image — see playwright.yml's header comment for why. Both also
# need the CI Postgres image — `build-db-image` below builds it once (same
# shape as `build-image`/`build-e2e-image`) and both `vitest`/`playwright`
# take it as their `db-image` input, rather than each independently calling
# build-db-image.yml itself: two nested `workflow_call`s to the same file
# would each pay for their own checkout/docker-login/buildx-setup for a
# result the content-addressed tag makes identical either way.
#
# lint/typecheck/build/format/destructive-ddl/gitflow are required status
# checks in branch protection (as "<job> / <job>", the name GitHub gives a
# job inside a called reusable workflow) — audit is deliberately not among
# them; it's PR-only and never gates a merge (see the audit job below).
# Filtering must therefore never skip the calling job itself for those six —
# a job-level `if:` makes GitHub report the check under a different, bare
# name ("lint" instead of "lint / lint") instead of not reporting it at all,
# and that bare name never satisfies the "lint / lint" required check,
# permanently blocking the PR. So those jobs (audit included, for the same
# consistent-naming reason even though it isn't required) always run and
# instead pass their filter result through as a `should-run` workflow_call
# input — see e.g. lint.yml — which skips the actual work internally but
# keeps the job (and its check name) the same either way.
#
# `edited` (in addition to the default opened/synchronize/reopened) is kept
# from upstream so retargeting a PR's base branch re-triggers gitflow's
# source->target validation even without a new push.
#
# lint/format/typecheck/build/destructive-ddl/playwright/vitest also
# `needs: gitflow`, so a PR from the wrong source/target branch never burns
# CI time on them — see the gitflow job below for why the actual check only
# makes sense here (merge-queue.yml calls it with should-run: false instead).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - staging
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # Determines which downstream checks a given push actually needs to run,
  # so e.g. a docs-only edit doesn't pay for lint/typecheck/build/audit.
  # format is deliberately NOT gated by this — Prettier covers .md/.json too,
  # and "did formatting change" is cheap and universal enough that it should
  # just run on every push rather than be filtered. Each filter also matches
  # its own reusable workflow file plus pr-gate.yml and .github/actions/**,
  # so editing the check's own workflow (or a shared composite action it
  # depends on) always reruns it rather than silently going unverified.
  changes:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      build: ${{ steps.filter.outputs.build }}
      destructive_ddl: ${{ steps.filter.outputs.destructive_ddl }}
      destructive_ddl_migrations_files: ${{ steps.filter.outputs.destructive_ddl_migrations_files }}
      vitest: ${{ steps.filter.outputs.vitest }}
      playwright: ${{ steps.filter.outputs.playwright }}
    steps:
      - name: Determine changed-file categories
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # list-files: json adds a `<filter>_files` output (JSON array
          # string) alongside every filter's boolean — only
          # destructive_ddl_migrations's is used (destructive-ddl.yml's list
          # of migration files to scan), but it's a step-level setting, not
          # per-filter, so it applies uniformly; the other filters' _files
          # outputs are simply unused.
          list-files: json
          filters: |
            shared: &shared
              - '.github/workflows/pr-gate.yml'
              - '.github/actions/**'
            lint:
              - *shared
              - '.github/workflows/lint.yml'
              - '.oxlintrc.json'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - 'package.json'
              - 'package-lock.json'
            typecheck:
              - *shared
              - '.github/workflows/typecheck.yml'
              - '**/*.ts'
              - '**/*.tsx'
              - 'tsconfig.json'
              - 'package-lock.json'
            build:
              - *shared
              - '.github/workflows/build.yml'
              - 'src/**'
              - 'public/**'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
            destructive_ddl:
              - *shared
              - '.github/workflows/destructive-ddl.yml'
              - 'src/db/migrations/**'
            # Deliberately narrower than destructive_ddl above: this filter's
            # only job is to produce a `_files` list of the migration files to
            # scan. destructive_ddl's `*shared` entries exist so the job
            # reruns when its own workflow changes, but dorny/paths-filter's
            # list-files output for a filter includes every changed file
            # matching *any* of that filter's patterns — so destructive_ddl's
            # own `_files` output would include a changed pr-gate.yml itself,
            # and check-destructive-ddl.ts would then scan that YAML file as
            # if it were a SQL migration (see MB.4). destructive_ddl still
            # drives should-run; this one only feeds changed-files.
            destructive_ddl_migrations:
              - 'src/db/migrations/**'
            # vitest also matches build-db-image.yml/Dockerfile.postgres/
            # postgres-init — the build-db-image job below (its `db-image`
            # input) is what actually consumes that image, so a change there
            # needs vitest to rerun even though `changes` filters by
            # build.yml/lint.yml's own narrower conventions. vitest.config.mts
            # and vitest.setup.ts aren't under src/**, so they're listed
            # explicitly.
            vitest:
              - *shared
              - '.github/workflows/vitest.yml'
              - '.github/workflows/build-db-image.yml'
              - '.github/scripts/summarize-vitest.mjs'
              - '.github/scripts/lib/**'
              - 'src/**'
              - 'vitest.config.mts'
              - 'vitest.setup.ts'
              - 'package.json'
              - 'package-lock.json'
            # playwright also matches build-e2e-image.yml/Dockerfile.e2e —
            # the image playwright.yml's container actually runs in — and
            # build-db-image.yml/Dockerfile.postgres/postgres-init, same
            # reasoning as vitest's filter above.
            playwright:
              - *shared
              - '.github/workflows/playwright.yml'
              - '.github/workflows/build-e2e-image.yml'
              - '.github/workflows/build-db-image.yml'
              - '.github/scripts/summarize-playwright.mjs'
              - '.github/scripts/lib/**'
              - 'Docker/Dockerfile.e2e'
              - 'src/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'next.config.ts'
              - 'package.json'
              - 'package-lock.json'

  # build-image pushes to a shared, content-addressed GHCR tag and GHA layer
  # cache (cache-to: type=gha,mode=max) keyed off Dockerfile.node +
  # package-lock.json. Cancelling it mid-push can freeze a half-written layer
  # into that cache/tag, which every later run with the same hash would then
  # keep reusing — a corruption that doesn't self-heal on retry. So
  # cancel-in-progress is false here: a superseded run's build-image queues
  # behind the one in flight instead of being killed. The jobs below are
  # cheap to rerun and don't share mutable state, so they get their own
  # cancellable concurrency groups instead. Always runs unconditionally (not
  # gated on `changes`) since format always needs its image output regardless
  # of what changed.
  build-image:
    concurrency:
      group: pr-gate-build-image-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-image.yml

  lint:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-lint-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/lint.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see lint.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.lint == 'true' }}

  # Deliberately ungated on `changes` — runs on every push regardless of what
  # changed, but still gated on gitflow below.
  format:
    needs: [build-image, gitflow]
    concurrency:
      group: pr-gate-format-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/format.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}

  typecheck:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-typecheck-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/typecheck.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see typecheck.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.typecheck == 'true' }}

  build:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      # No job-level `if:` here on purpose — see build.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.build == 'true' }}

  # Blocking, unlike audit below — this gates a merge, since a destructive
  # migration slipping through breaks the "revert is a deploy rollback"
  # guarantee CLAUDE.md rule 10 exists for. Needs the real PR body (for the
  # acknowledgement line) as well as a file list, neither of which
  # `workflow_call` can read off its own trigger — both are passed in
  # explicitly. See destructive-ddl.yml's own header comment for why.
  destructive-ddl:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-destructive-ddl-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/destructive-ddl.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see destructive-ddl.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.destructive_ddl == 'true' }}
      changed-files: ${{ needs.changes.outputs.destructive_ddl_migrations_files }}
      pr-body: ${{ github.event.pull_request.body }}

  # Non-blocking and PR-only — not a required status check. Gated on the
  # trigger itself (always true here since pr-gate only runs on
  # pull_request) rather than assuming it, per the rule M0.17 set: a
  # reusable check whose input is used unguarded downstream (audit.yml's
  # `pr-number`) must not be reachable from a trigger where that input could
  # be empty.
  audit:
    needs: build-image
    if: github.event_name == 'pull_request'
    concurrency:
      group: pr-gate-audit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/audit.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}

  # Publishes (or reuses, if content-addressed and unchanged) the preseeded
  # Postgres 17 image both vitest and playwright below need for their
  # `services: postgres:` block — built once here, same shape as
  # build-image/build-e2e-image, rather than each of vitest.yml/
  # playwright.yml separately calling build-db-image.yml as a nested
  # workflow_call (which used to mean two independent checkout/docker-login/
  # buildx-setup sequences for what the content-addressed tag makes an
  # identical result either way). Unconditional, like build-image, for the
  # same "the jobs below need its output either way" reasoning.
  build-db-image:
    concurrency:
      group: pr-gate-build-db-image-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-db-image.yml

  vitest:
    needs: [build-image, build-db-image, changes, gitflow]
    concurrency:
      group: pr-gate-vitest-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/vitest.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      db-image: ${{ needs.build-db-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see vitest.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.vitest == 'true' }}

  # build-e2e-image (M1.14) publishes the dedicated Playwright image —
  # build-image.yml's shared `testing` image deliberately excludes
  # Playwright's browser/system deps (see Docker/Dockerfile.node's header
  # comment), so playwright.yml runs in this image instead. Unconditional,
  # like build-image above, for the same "the job below needs its output
  # either way" reasoning.
  build-e2e-image:
    concurrency:
      group: pr-gate-build-e2e-image-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-e2e-image.yml

  playwright:
    needs: [build-e2e-image, build-db-image, changes, gitflow]
    concurrency:
      group: pr-gate-playwright-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/playwright.yml
    with:
      image: ${{ needs.build-e2e-image.outputs.image }}
      db-image: ${{ needs.build-db-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see playwright.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.playwright == 'true' }}

  # Deliberately ungated — runs on every push regardless of what changed, and
  # doesn't need build-image since it never touches the testing container.
  # merge-queue.yml also calls gitflow.yml, but with should-run: false — see
  # that file for why the actual check only makes sense here, against a
  # PR's real source branch.
  gitflow:
    concurrency:
      group: pr-gate-gitflow-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/gitflow.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
