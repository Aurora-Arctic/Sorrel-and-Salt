name: PR Gate

# The run's title in the Actions list. The default is the PR's title alone,
# under which an edit's run and a close's run — both of which stand down in
# `changes`, the edit's unless its commit is ungated — look like the gate they
# queue behind. The group keys on
# `github.workflow`, the name above, which this does not touch.
run-name: >-
  ${{ github.event.pull_request.title }}${{
  github.event.action == 'edited' && ' · edit: waits, then cancels itself unless retargeted or the commit is ungated'
  || github.event.action == 'closed' && ' · close: cancels the runs for this PR, then itself'
  || '' }}

# The gate on every PR into `main`, `staging` or `release/*`. format, audit
# and gitflow always run; the rest are path-filtered by `changes`.
# claude-docs/ci/aggregating-workflows.md, "Aggregating workflows" is the walkthrough.
#
# NO JOB HERE MAY CARRY A JOB-LEVEL `if:`, bar `playwright-coverage`'s, which is no
# required check and so has no name to satisfy. A job-level `if:` makes GitHub report the check
# under a bare name ("checks" instead of "checks / lint") that never
# satisfies the required check, permanently blocking the PR. Every job runs
# unconditionally and passes its filter result down as a workflow_call input.
#
# `edited` is in the trigger types so retargeting a PR's base re-runs the gate
# against the new one. Every other edit — a title or a description —
# changes nothing the gate checks, so its run must not cancel the run in
# flight: the group's cancel excludes `edited`, the run waits its turn, and
# `changes` cancels it unless the payload carries `changes.base` or no other
# run of this gate has tested the PR's head commit. That second case is a
# push's run that was still waiting when the edit came: GitHub holds one
# pending run per group, so the edit's run replaced it before it started.
# `closed` is there so closing a PR cancels its runs: the close starts a run
# in the PR's group below, which cancels the rest, and then cancels itself in
# `changes`. GitHub fires `edited` on a closed PR too, and that run cancels
# itself the same way.
# Every job `needs: changes`, so a run that cancels itself starts nothing
# else: a job that had started would leave a cancelled check run under its own
# name, newer than the real run's, and a required check reads the newest.
# `build-db-image` is built once here rather than nested in vitest.yml and
# playwright.yml, which would pay twice for an identical image, and
# `build-e2e-image` once for both Playwright suites.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]
    branches:
      - main
      - staging
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # An edit joins the group without cancelling; GitHub holds one pending run
  # per group, a later run replacing an earlier one — a push's run included.
  cancel-in-progress: ${{ github.event.action != 'edited' }}

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # Which checks this push needs. Every filter also matches whatever runs its
  # check — the workflow, its script, this file and .github/actions/** — so
  # editing what runs a check reruns it.
  changes:
    runs-on: ubuntu-26.04
    # Replaces the workflow's set for this job: paths-filter lists the PR's
    # files through the API, and the first step cancels the run.
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      build: ${{ steps.filter.outputs.build }}
      destructive_ddl: ${{ steps.filter.outputs.destructive_ddl }}
      destructive_ddl_migrations_files: ${{ steps.filter.outputs.destructive_ddl_migrations_files }}
      migration_order: ${{ steps.filter.outputs.migration_order }}
      vitest: ${{ steps.filter.outputs.vitest }}
      playwright: ${{ steps.filter.outputs.playwright }}
      stories: ${{ steps.filter.outputs.stories }}
      workshop: ${{ steps.filter.outputs.workshop }}
    steps:
      # A step-level `if:`, so the header's rule holds. Every other job needs
      # this one, so nothing else starts. `changes.base` is in the payload only
      # when the edit retargeted the PR; that run goes on to gate. An edit's
      # run also gates when no other run of this gate for this PR has tested
      # the head commit — finished other than cancelled or skipped, or still
      # going — since that commit's own run was replaced while it waited (see
      # the header). A run whose `pull_requests` comes back empty counts as
      # not covering, so the doubt costs a run rather than an untested commit.
      - name: Cancel this run if the PR is closed, or was edited without a retarget and its commit is gated
        if: github.event.pull_request.state == 'closed' || (github.event.action == 'edited' && github.event.changes.base == null)
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED: ${{ github.event.pull_request.state == 'closed' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$CLOSED" != true ]; then
            workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
            covering=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
              --jq "[.workflow_runs[]
                | select(.id != $GITHUB_RUN_ID)
                | select(any(.pull_requests[]; .number == $PR_NUMBER))
                | select(.status != \"completed\" or (.conclusion != \"cancelled\" and .conclusion != \"skipped\"))
              ] | length")
            if [ "$covering" = 0 ]; then
              echo "No run of this gate has tested $HEAD_SHA, so this edit's run gates it."
              exit 0
            fi
          fi
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          # The cancel is asynchronous; the sleep is killed when it lands,
          # usually in seconds, so this job never finishes and hands the check
          # jobs an output to start on. 30s is only the bound.
          sleep 30

      - name: Determine changed-file categories
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # Step-wide; only destructive_ddl_migrations's `_files` output is read.
          list-files: json
          # Lets a filter carry `!` exclusions (vitest's below); a filter
          # without one behaves exactly as under the default `some`.
          predicate-quantifier: some-with-excludes
          filters: |
            shared: &shared
              - '.github/workflows/pr-gate.yml'
              - '.github/actions/**'
            # Docker/Dockerfile.node defines the image lint/typecheck/build run
            # inside; it is not in `*shared`, which also feeds destructive_ddl.
            lint:
              - *shared
              - '.github/workflows/checks.yml'
              - '.github/scripts/summarize-lint.sh'
              - 'Docker/Dockerfile.node'
              - '.oxlintrc.json'
              - 'knip.json'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - 'package.json'
              - 'package-lock.json'
            typecheck:
              - *shared
              - '.github/workflows/checks.yml'
              - '.github/scripts/summarize-typecheck.sh'
              - 'Docker/Dockerfile.node'
              - '**/*.ts'
              - '**/*.tsx'
              - 'tsconfig.json'
              - 'package-lock.json'
            build:
              - *shared
              - '.github/workflows/checks.yml'
              - 'Docker/Dockerfile.node'
              - 'src/**'
              - 'public/**'
              - 'next.config.ts'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
            destructive_ddl:
              - *shared
              - '.github/workflows/checks.yml'
              - 'scripts/check-destructive-ddl.ts'
              - 'src/db/migrations/**'
            # Only the journal orders migrations; the destructive-DDL script
            # is here because this one imports its base resolution.
            migration_order:
              - *shared
              - '.github/workflows/checks.yml'
              - 'scripts/check-migration-order.ts'
              - 'scripts/check-destructive-ddl.ts'
              - 'src/db/migrations/meta/_journal.json'
            # Narrower than destructive_ddl: `_files` lists every changed file
            # matching ANY pattern, so its list would hand pr-gate.yml to the
            # script as SQL. `*.sql` keeps Drizzle's meta/*.json out too.
            destructive_ddl_migrations:
              - 'src/db/migrations/*.sql'
            # `tests/**`, `.storybook/main.ts` and the configs are not under
            # `src/**`, and a test-only PR is exactly what this job runs.
            # tests/e2e/ is Playwright's and nothing Vitest runs imports it.
            # The db image's inputs too, so a Postgres bump is tested on its own PR.
            vitest:
              - *shared
              - '.github/workflows/vitest.yml'
              - '.github/workflows/build-db-image.yml'
              - 'Docker/Dockerfile.postgres'
              - 'Docker/postgres-init/**'
              - '.github/scripts/summarize-vitest.mjs'
              - '.github/scripts/lib/**'
              - 'src/**'
              - 'tests/**'
              - '!tests/e2e/**'
              - '.storybook/main.ts'
              - 'vitest.config.mts'
              - 'codegen.ts'
              - 'package.json'
              - 'package-lock.json'
            # Plus the e2e image's inputs, as with Dockerfile.node above, and
            # tests/support/**, which tests/e2e/database.ts imports.
            playwright:
              - *shared
              - '.github/workflows/playwright.yml'
              - '.github/workflows/build-e2e-image.yml'
              - '.github/workflows/build-db-image.yml'
              - 'Docker/Dockerfile.postgres'
              - 'Docker/postgres-init/**'
              - '.github/scripts/summarize-playwright.mjs'
              - '.github/scripts/merge-playwright-coverage.mjs'
              - '.github/workflows/playwright-coverage.yml'
              - '.github/scripts/lib/**'
              - 'Docker/Dockerfile.e2e'
              - 'src/**'
              - 'tests/e2e/**'
              - 'tests/support/**'
              - 'playwright.config.ts'
              - 'next.config.ts'
              - 'package.json'
              - 'package-lock.json'
            # The playwright filter's, with the story suite's summariser and
            # config in place of the gate suite's.
            stories:
              - *shared
              - '.github/workflows/playwright.yml'
              - '.github/workflows/build-e2e-image.yml'
              - '.github/workflows/build-db-image.yml'
              - 'Docker/Dockerfile.postgres'
              - 'Docker/postgres-init/**'
              - '.github/scripts/summarize-stories.mjs'
              - '.github/scripts/merge-playwright-coverage.mjs'
              - '.github/workflows/playwright-coverage.yml'
              - 'Docker/Dockerfile.e2e'
              - 'src/**'
              - 'tests/e2e/**'
              - 'tests/support/**'
              - 'playwright.config.ts'
              - 'playwright.stories.config.ts'
              - 'next.config.ts'
              - 'package.json'
              - 'package-lock.json'
            # The workshop specs measure a component in its workshop story: the
            # e2e image for the browser, the workshop config (Storybook's) and stories, and
            # the components under src/**. No database and no Next build.
            workshop:
              - *shared
              - '.github/workflows/build-e2e-image.yml'
              - 'Docker/Dockerfile.e2e'
              - '.storybook/**'
              - '**/*.stories.tsx'
              - 'src/**'
              - 'tests/e2e/workshop/**'
              - 'playwright.workshop.config.ts'
              - 'package.json'
              - 'package-lock.json'

  # Cancellable like every job here: a cancelled build leaves no tag and no
  # cache index behind, so the next run rebuilds rather than reusing half an
  # image. claude-docs/ci/aggregating-workflows.md, "Aggregating workflows".
  build-image:
    needs: [changes]
    uses: ./.github/workflows/build-image.yml

  checks:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-checks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/checks.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` — see the header.
      run-lint: ${{ needs.changes.outputs.lint == 'true' }}
      run-typecheck: ${{ needs.changes.outputs.typecheck == 'true' }}
      run-build: ${{ needs.changes.outputs.build == 'true' }}
      run-destructive-ddl: ${{ needs.changes.outputs.destructive_ddl == 'true' }}
      # A called workflow sees no `pull_request`; only the caller can list these.
      destructive-ddl-files: ${{ needs.changes.outputs.destructive_ddl_migrations_files }}
      run-migration-order: ${{ needs.changes.outputs.migration_order == 'true' }}
      migration-order-base: ${{ github.base_ref }}

  # Built once for vitest and playwright.
  build-db-image:
    needs: [changes]
    uses: ./.github/workflows/build-db-image.yml

  vitest:
    needs: [build-image, build-db-image, changes, gitflow]
    concurrency:
      group: pr-gate-vitest-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/vitest.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      db-image: ${{ needs.build-db-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` — see the header.
      should-run: ${{ needs.changes.outputs.vitest == 'true' }}

  # The `testing` image is Alpine and carries no browser.
  build-e2e-image:
    needs: [changes]
    uses: ./.github/workflows/build-e2e-image.yml

  playwright:
    needs: [build-e2e-image, build-db-image, changes, gitflow]
    concurrency:
      group: pr-gate-playwright-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/playwright.yml
    with:
      image: ${{ needs.build-e2e-image.outputs.image }}
      db-image: ${{ needs.build-db-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` — see the header.
      should-run: ${{ needs.changes.outputs.playwright == 'true' }}

  # The story suite (M9.1), on the same images as `playwright` and beside it,
  # so it adds nothing to the gate's time. Never a required check: its run step
  # carries `continue-on-error`, so a red scaffold shows in the Stories comment
  # without blocking a merge (claude-docs/testing/acceptance.md).
  stories:
    needs: [build-e2e-image, build-db-image, changes, gitflow]
    concurrency:
      group: pr-gate-stories-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/playwright.yml
    with:
      image: ${{ needs.build-e2e-image.outputs.image }}
      db-image: ${{ needs.build-db-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      suite: stories
      # No job-level `if:` — see the header.
      should-run: ${{ needs.changes.outputs.stories == 'true' }}

  # The gate suite's and the story suite's JavaScript coverage, merged (M14.28):
  # playwright-coverage.yml downloads whichever coverage artifacts the two
  # uploaded and posts a "Playwright Coverage" comment. Never a required check
  # (it carries `continue-on-error`, and nothing waits on it). Its `if:` is
  # the one job-level `if:` in this file (see the header): without it a failed
  # suite would skip the merge. It is a called workflow, not a job here, so
  # that an edit's run which cancels itself in `changes` leaves it skipped like
  # the other called workflows, not cancelled and failing.
  playwright-coverage:
    needs: [build-image, changes, playwright, stories]
    if: ${{ !cancelled() }}
    concurrency:
      group: pr-gate-playwright-coverage-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/playwright-coverage.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      should-run: ${{ needs.changes.outputs.playwright == 'true' || needs.changes.outputs.stories == 'true' }}
      # The stories job passes whatever its stories did, so its run step's outcome is read too.
      suites-failed: ${{ needs.playwright.result == 'failure' || needs.stories.result == 'failure' || needs.stories.outputs.outcome == 'failure' }}

  # The workshop specs (tests/e2e/workshop/, M12.31): a component measured in
  # its workshop story, `npm run e2e:workshop`. In the e2e image, as playwright.yml
  # runs, for its browser; Storybook is the one server, so no database and no
  # build. Never a required check: `continue-on-error`, so a red run shows
  # without blocking a merge. Under its own `workshop` filter, by a step-level
  # `if:` (see the header).
  workshop:
    needs: [build-e2e-image, changes, gitflow]
    concurrency:
      group: pr-gate-workshop-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    continue-on-error: true
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.build-e2e-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # As playwright.yml: Chromium crashes on the default 64 MB /dev/shm.
      options: --ipc=host
    defaults:
      run:
        working-directory: /app
        shell: bash
    env:
      # playwright.workshop.config.ts starts a fresh Storybook and retries under it.
      CI: true
    steps:
      - name: Checkout into /app
        if: needs.changes.outputs.workshop == 'true'
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main
      - name: Run the workshop specs
        if: needs.changes.outputs.workshop == 'true'
        run: npm run e2e:workshop

  # Every check job `needs: gitflow`, so a wrong source branch burns no CI time.
  gitflow:
    needs: [changes]
    concurrency:
      group: pr-gate-gitflow-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/gitflow.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
