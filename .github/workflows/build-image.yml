name: Build Testing Image

# Builds or reuses the shared `testing` image every checks.yml leg and
# vitest.yml runs inside. workflow_call only, from pr-gate. The tag is
# content-addressed off the two files that determine the image's contents;
# build-db-image.yml and build-e2e-image.yml tag the same way.
on:
  workflow_call:
    outputs:
      image:
        description: Fully qualified, content-addressed testing image ref
        value: ${{ jobs.build-image.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute content-addressed image tag
        id: tag
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          hash="${{ hashFiles('Docker/Dockerfile.node', 'package-lock.json') }}"
          echo "image=ghcr.io/${repo_lower}/testing:${hash}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Skip rather than re-push identical content. The real build below is
      # what pr-gate.yml's concurrency group protects from cancellation.
      - name: Check if image already exists
        id: check
        run: |
          if docker buildx imagetools inspect ${{ steps.tag.outputs.image }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # No `playwright install`: this image is Alpine and carries no browser.
      - name: Build and push testing image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile.node
          target: testing
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
