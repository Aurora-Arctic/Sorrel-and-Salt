name: Build Testing Image

# Builds (or reuses, if unchanged) the shared `testing` image every
# checks.yml leg and vitest.yml runs inside, and publishes its ref as an
# output. Called via workflow_call from pr-gate. claude-docs/ci.md is the
# walkthrough.
#
# The tag is content-addressed off `github.repository` lowercased plus a hash
# of the only two files that determine the image's contents, so it lands
# under this repo's own GHCR namespace with nothing to change when ported.
# build-db-image.yml and build-e2e-image.yml tag the same way.
on:
  workflow_call:
    outputs:
      image:
        description: Fully qualified, content-addressed testing image ref
        value: ${{ jobs.build-image.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute content-addressed image tag
        id: tag
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          hash="${{ hashFiles('Docker/Dockerfile.node', 'package-lock.json') }}"
          echo "image=ghcr.io/${repo_lower}/testing:${hash}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Most pushes touch neither file, so the tag from a prior run usually
      # already exists — skip rather than re-push the same content. It keeps
      # this job to a few-second read with nothing mutable in flight; it is
      # the real-build path below that pr-gate.yml's concurrency group
      # protects from cancellation.
      - name: Check if image already exists
        id: check
        run: |
          if docker buildx imagetools inspect ${{ steps.tag.outputs.image }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Layers are GHA-cached, so even a rebuild is fast. No `playwright
      # install` here: this image is Alpine and deliberately carries no
      # browser — Docker/Dockerfile.e2e is where e2e runs.
      - name: Build and push testing image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile.node
          target: testing
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
