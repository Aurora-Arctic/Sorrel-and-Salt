name: Build Testing Image

# Builds or reuses the shared `testing` image every checks.yml leg and
# vitest.yml runs inside. workflow_call only, from pr-gate. The tag is
# content-addressed off the two files that determine the image's contents;
# build-db-image.yml and build-e2e-image.yml go through the same action.
on:
  workflow_call:
    outputs:
      image:
        description: Fully qualified, content-addressed testing image ref
        value: ${{ jobs.build-image.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `playwright install`: this image is Alpine and carries no browser.
      # No cache-scope: this image has always used the unscoped `type=gha` key.
      - name: Build or reuse the testing image
        id: image
        uses: ./.github/actions/build-image
        with:
          path: testing
          content-hash: ${{ hashFiles('Docker/Dockerfile.node', 'package-lock.json') }}
          dockerfile: Docker/Dockerfile.node
          target: testing
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
