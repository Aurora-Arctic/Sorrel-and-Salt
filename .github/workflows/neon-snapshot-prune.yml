name: Neon Snapshot Prune

# Prunes migrate.yml's `snapshot-*` Neon branches: the free tier caps a
# project at 10 branches, shared with production, staging and every hotfix
# preview. claude-docs/ci.md, "Neon snapshots". The only scheduled workflow;
# guarded the same warn-and-skip way as migrate.yml's Neon step.

on:
  schedule:
    # Sundays 06:00 UTC, outside any deploy window.
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Newest snapshots kept; comfortably under the 10-branch quota.
  KEEP_SNAPSHOTS: 3

jobs:
  prune:
    runs-on: ubuntu-26.04
    steps:
      - name: Check Neon secrets
        id: guard
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::Neon secrets not configured yet (M0.27) — skipping prune."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prune old snapshot branches
        id: prune
        if: steps.guard.outputs.enabled == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -eo pipefail
          {
            echo "Listing branches..."
            to_delete=$(curl -sf "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              | jq -r --argjson keep "${KEEP_SNAPSHOTS}" '
                  [.branches[] | select(.name | startswith("snapshot-"))]
                  | sort_by(.created_at) | reverse
                  | .[$keep:]
                  | .[] | "\(.id) \(.name)"
                ')

            if [ -z "$to_delete" ]; then
              echo "Nothing to prune — ${KEEP_SNAPSHOTS} or fewer snapshot branches exist."
            else
              echo "$to_delete" | while read -r id name; do
                echo "Deleting ${name} (${id})..."
                curl -sf -X DELETE "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${id}" \
                  -H "Authorization: Bearer ${NEON_API_KEY}"
                echo
              done
            fi
          } 2>&1 | tee prune.log

      - name: Write job summary
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: Neon snapshot prune
          outcome: ${{ steps.prune.outcome }}
          log-file: prune.log
