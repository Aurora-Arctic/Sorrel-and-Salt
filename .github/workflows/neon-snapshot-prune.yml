name: Neon Snapshot Prune

# Scheduled cleanup for the pre-migration snapshot branches migrate.yml
# creates. **Neon's free tier caps a project at 10 branches in total**, and
# `production`, `staging`, every retained snapshot and every open hotfix
# preview's ephemeral branch draw on that one quota — so `snapshot-*` cannot
# be left to accumulate. See claude-docs/ci.md's "Neon snapshots" section.
#
# The only scheduled workflow in the repo; nothing calls it. Guarded the same
# warn-and-skip way as migrate.yml's Neon step, since NEON_API_KEY and
# NEON_PROJECT_ID are not set yet (claude-docs/secrets.md).

on:
  schedule:
    # Sundays at 06:00 UTC — outside any deploy window, and a week of
    # production migrations cannot outrun it at this repo's cadence.
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # How many of the newest snapshot-* branches to keep — comfortably under
  # the 10-branch quota with production, staging and in-flight previews.
  KEEP_SNAPSHOTS: 3

jobs:
  prune:
    runs-on: ubuntu-26.04
    steps:
      - name: Check Neon secrets
        id: guard
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::Neon secrets not configured yet (M0.27) — skipping prune."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prune old snapshot branches
        id: prune
        if: steps.guard.outputs.enabled == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -eo pipefail
          {
            echo "Listing branches..."
            to_delete=$(curl -sf "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              | jq -r --argjson keep "${KEEP_SNAPSHOTS}" '
                  [.branches[] | select(.name | startswith("snapshot-"))]
                  | sort_by(.created_at) | reverse
                  | .[$keep:]
                  | .[] | "\(.id) \(.name)"
                ')

            if [ -z "$to_delete" ]; then
              echo "Nothing to prune — ${KEEP_SNAPSHOTS} or fewer snapshot branches exist."
            else
              echo "$to_delete" | while read -r id name; do
                echo "Deleting ${name} (${id})..."
                curl -sf -X DELETE "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${id}" \
                  -H "Authorization: Bearer ${NEON_API_KEY}"
                echo
              done
            fi
          } 2>&1 | tee prune.log

      - name: Write job summary
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: Neon snapshot prune
          outcome: ${{ steps.prune.outcome }}
          log-file: prune.log
