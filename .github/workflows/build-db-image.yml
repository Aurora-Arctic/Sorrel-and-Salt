name: Build DB Image

# Builds Docker/Dockerfile.postgres and publishes it to GHCR for CI;
# docker-compose.yaml builds the same file locally. claude-docs/ci/database-image.md,
# "Database image" is the walkthrough.
#
# Content-addressed tag, no `latest`; the build-image action skips a tag
# that is already published. No `push` trigger: every PR that changes the
# image builds it through pr-gate.yml first, so a push found the tag and did
# nothing. No `pull_request` trigger either: pr-gate.yml already calls this,
# and a second run would report a duplicate check.
on:
  workflow_dispatch:
  # pr-gate.yml's `build-db-image` job, feeding vitest.yml and playwright.yml.
  workflow_call:
    outputs:
      image:
        description: Fully qualified, content-addressed db image ref
        value: ${{ jobs.build-db-image.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-db-image:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build or reuse the db image
        id: image
        uses: ./.github/actions/build-image
        with:
          path: db
          content-hash: ${{ hashFiles('Docker/Dockerfile.postgres', 'Docker/postgres-init/**') }}
          dockerfile: Docker/Dockerfile.postgres
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
