name: Build DB Image

# Builds the preseeded Postgres 17 image (Docker/Dockerfile.postgres, M0.18)
# and publishes it to GHCR. Content-addressed: the image is tagged with a
# hash of everything that actually determines its contents — src/db/**, the
# Dockerfile, and its init script — plus `latest`, so identical inputs always
# produce the identical tag and M0.19's consumers (the CI `services:` block
# and docker-compose.yaml) can pin to it exactly.
#
# The path filter below *is* "rebuild is skipped for PRs that do not touch
# src/db": an unrelated PR never triggers this workflow at all, rather than
# triggering a job that runs and no-ops. Because the tag is a hash of those
# same paths, a run that does trigger always produces a tag that either
# matches an already-published one (content unchanged) or is new (content
# changed) — there is no separate "did anything change" check to get wrong.
#
# Runs on pull_request too, not just push: the tag is content-addressed and
# branch-agnostic, so a PR branch and staging producing the same src/db
# content get the same tag and the same image — building early on a PR is
# free reuse, not throwaway work. `latest` only moves on a push to `staging`
# or `main`, so a PR's build never repoints the floating tag other workflows
# default to.
on:
  push:
    branches: [staging, main]
    paths: &db-image-paths
      - 'src/db/**'
      - 'Docker/Dockerfile.postgres'
      - 'Docker/postgres-init/**'
      - '.github/workflows/build-db-image.yml'
  pull_request:
    paths: *db-image-paths
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-db-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.hash-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute tags
        id: tags
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          hash="${{ hashFiles('src/db/**', 'Docker/Dockerfile.postgres', 'Docker/postgres-init/**') }}"
          hash_tag="ghcr.io/${repo_lower}/db:${hash}"
          echo "hash-tag=${hash_tag}" >> "$GITHUB_OUTPUT"

          tags="$hash_tag"
          if [ "${{ github.event_name }}" = 'push' ]; then
            tags=$(printf '%s\n%s' "$tags" "ghcr.io/${repo_lower}/db:latest")
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push db image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile.postgres
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=db-image
          cache-to: type=gha,mode=max,scope=db-image
