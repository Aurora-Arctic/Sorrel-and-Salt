name: Build DB Image

# Builds Docker/Dockerfile.postgres and publishes it to GHCR for CI;
# docker-compose.yaml builds the same file locally. claude-docs/ci.md,
# "Database image" is the walkthrough.
#
# Content-addressed tag, no `latest`. Two skips, one per trigger: the `push`
# path filter gates only direct triggers, and `workflow_call` — every PR's
# path — bypasses it, so the build-image action's already-published check
# covers that one. `push` exists to seed the branch-isolated GHA layer cache
# from `staging` and `main`. No `pull_request` trigger: pr-gate.yml already
# calls this, and a second run would report a duplicate check.
on:
  push:
    branches: [staging, main]
    paths:
      - 'Docker/Dockerfile.postgres'
      - 'Docker/postgres-init/**'
      - '.github/workflows/build-db-image.yml'
  workflow_dispatch:
  # pr-gate.yml's `build-db-image` job, feeding vitest.yml and playwright.yml.
  workflow_call:
    outputs:
      image:
        description: Fully qualified, content-addressed db image ref
        value: ${{ jobs.build-db-image.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-db-image:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build or reuse the db image
        id: image
        uses: ./.github/actions/build-image
        with:
          path: db
          content-hash: ${{ hashFiles('Docker/Dockerfile.postgres', 'Docker/postgres-init/**') }}
          dockerfile: Docker/Dockerfile.postgres
          cache-scope: db-image
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
