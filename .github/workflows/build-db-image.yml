name: Build DB Image

# Builds Docker/Dockerfile.postgres and publishes it to GHCR for CI;
# docker-compose.yaml builds the same file locally. claude-docs/ci.md,
# "Database image" is the walkthrough.
#
# Content-addressed tag, no `latest`. Two skips, one per trigger: the `push`
# path filter gates only direct triggers, and `workflow_call` — every PR's
# path — bypasses it, so the `Check if image already exists` step covers that
# one. `push` exists to seed the branch-isolated GHA layer cache from
# `staging` and `main`. No `pull_request` trigger: pr-gate.yml already calls
# this, and a second run would report a duplicate check.
on:
  push:
    branches: [staging, main]
    paths:
      - 'Docker/Dockerfile.postgres'
      - 'Docker/postgres-init/**'
      - '.github/workflows/build-db-image.yml'
  workflow_dispatch:
  # pr-gate.yml's `build-db-image` job, feeding vitest.yml and playwright.yml.
  workflow_call:
    outputs:
      image:
        description: Fully qualified, content-addressed db image ref
        value: ${{ jobs.build-db-image.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-db-image:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.tags.outputs.hash-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute tags
        id: tags
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          hash="${{ hashFiles('Docker/Dockerfile.postgres', 'Docker/postgres-init/**') }}"
          hash_tag="ghcr.io/${repo_lower}/db:${hash}"
          echo "hash-tag=${hash_tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Skip rather than re-push identical content (the workflow_call path;
      # a `push` run is already a miss by its path filter).
      - name: Check if image already exists
        id: check
        run: |
          if docker buildx imagetools inspect ${{ steps.tags.outputs.hash-tag }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push db image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile.postgres
          push: true
          tags: ${{ steps.tags.outputs.hash-tag }}
          cache-from: type=gha,scope=db-image
          cache-to: type=gha,mode=max,scope=db-image
