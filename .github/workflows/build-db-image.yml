name: Build DB Image

# Builds the preseeded Postgres 18 image (Docker/Dockerfile.postgres) and
# publishes it to GHCR for CI. docker-compose.yaml builds the same Dockerfile
# locally rather than pulling this. claude-docs/ci.md's "Database image"
# section is the walkthrough.
#
# Content-addressed on the Dockerfile and its init script, so identical
# inputs always produce the identical tag and every caller pins it exactly.
# **No `latest` tag**: nothing in the repo ever read one.
#
# Two mechanisms skip redundant work, one per trigger, because they cover
# different paths. The `push` path filter below is workflow-level — it gates
# this workflow's own direct triggers only, and `workflow_call` (the path
# every PR takes) bypasses it entirely. So the `Check if image already
# exists` step is the job-level skip that covers that path. Between them
# buildx runs only on a genuine miss.
#
# The `push` trigger's real job is seeding the GHA layer cache for branches
# that have not built this image yet. That cache is branch-isolated — reads
# fall back to the PR's base branch and the default branch — so only a push
# to `staging` or `main` writes an entry another branch can restore. A cold
# build step is ~25s, a warm one ~6-8s.
#
# **No `pull_request` trigger**: pr-gate.yml has an unconditional
# `build-db-image` job of its own, so one would only push the identical tag
# a second time and report a duplicate status check.
on:
  push:
    branches: [staging, main]
    paths:
      - 'Docker/Dockerfile.postgres'
      - 'Docker/postgres-init/**'
      - '.github/workflows/build-db-image.yml'
  workflow_dispatch:
  # The caller is pr-gate.yml's own top-level `build-db-image` job, which
  # passes the result down as a `db-image` input to both vitest.yml and
  # playwright.yml. A call bypasses `push`'s path filter entirely, so every
  # run gets a current image whatever the PR touched.
  workflow_call:
    outputs:
      image:
        description: Fully qualified, content-addressed db image ref
        value: ${{ jobs.build-db-image.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-db-image:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.tags.outputs.hash-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute tags
        id: tags
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          hash="${{ hashFiles('Docker/Dockerfile.postgres', 'Docker/postgres-init/**') }}"
          hash_tag="ghcr.io/${repo_lower}/db:${hash}"
          echo "hash-tag=${hash_tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Most pushes touch nothing in the hash, so the tag from a prior run
      # usually already exists — skip rather than re-push the same content.
      # This only matters on the workflow_call path; a `push` run that fires
      # at all is already a genuine miss, by its path filter.
      - name: Check if image already exists
        id: check
        run: |
          if docker buildx imagetools inspect ${{ steps.tags.outputs.hash-tag }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push db image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile.postgres
          push: true
          tags: ${{ steps.tags.outputs.hash-tag }}
          cache-from: type=gha,scope=db-image
          cache-to: type=gha,mode=max,scope=db-image
