name: Deploy

# CLI-driven Vercel deploys, and **the only path that ships code**:
# vercel.json sets `deploymentEnabled: { "**": false }`, so Vercel's Git
# integration deploys nothing. claude-docs/ci.md's "Deploy" section is the
# walkthrough.
#
#   push to main            -> vercel deploy --prebuilt --prod (sorrelandsalt.com)
#   push to staging         -> preview, aliased to staging.sorrelandsalt.com
#   PR from hotfix/** -> main -> preview, aliased to a per-hotfix domain
#                          hotfix-<slug>.sorrelandsalt.com, URL posted as a PR
#                          comment; the alias is removed when the PR closes.
#
# Hotfixes deploy on the PR rather than on push: an urgent fix wants a
# review-time preview URL, and it reaches production through its own main PR
# anyway. The hotfix->staging PR create-pr also opens is skipped here, so a
# hotfix deploys once. Nothing else deploys at all.
#
# `pull_request`, not `pull_request_target`: hotfix branches live in this
# repo and are never forks, so no untrusted checkout runs with these secrets.
#
# `deploy` needs `migrate`, so a failed migration blocks the promotion
# instead of racing it — and so does a failed reference seed, which rides
# inside that same job.

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  # One run per branch or per PR, never cancelled mid-flight: a half-run
  # `vercel deploy`/`alias` can leave an alias on a dead deployment.
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  # Pure string computation shared by `migrate` and `deploy`, split out so
  # the migration can complete before the deploy starts. It needs no secrets,
  # so it runs even when the guard downstream skips the real work.
  resolve-target:
    # push to main/staging, or an open hotfix -> main PR (not its close event).
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-26.04
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      git_branch: ${{ steps.target.outputs.git_branch }}
      prod_flag: ${{ steps.target.outputs.prod_flag }}
      alias: ${{ steps.target.outputs.alias }}
    steps:
      - name: Resolve deploy target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # hotfix/<slug> -> hotfix-<sanitised slug>.sorrelandsalt.com, kept
            # inside the 63-char DNS label limit (7 for the "hotfix-" prefix).
            raw="${HEAD_REF#hotfix/}"
            slug="$(printf '%s' "$raw" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"
            slug="${slug:0:56}"
            slug="${slug%-}"
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "git_branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
            echo "alias=hotfix-${slug}.sorrelandsalt.com" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "git_branch=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
            echo "alias=" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "git_branch=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
            echo "alias=staging.sorrelandsalt.com" >> "$GITHUB_OUTPUT"
          fi

  # Did this push touch either reference seed? Reference data has no journal
  # of its own to say what is pending, so this diff is that journal, and the
  # answer feeds `migrate`, which seeds in the job it migrates in.
  #
  # **No job-level `if:`, deliberately**: a skipped dependency skips its
  # dependents, so gating this on `github.event_name == 'push'` would take
  # every hotfix preview deploy down with it. Non-push events answer "no"
  # from inside the step instead.
  seed-changed:
    needs: resolve-target
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Both ends of the comparison below have to be in the clone, and a
          # push can carry more than one commit.
          fetch-depth: 0

      - name: Look for changes to the seed
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Only a push has a `before` to diff against, and staging and
          # production are the two databases the seed is meant to reach anyway
          # — a hotfix preview runs on a disposable Neon branch.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A new branch, or a force-push past what the runner fetched, reports
          # an all-zero `before`. Seed in that case rather than guess: the seed
          # adds only what is missing, so the cost of a false positive is one
          # extra `npm run` and the cost of a false negative is an empty
          # vocabulary in production.
          if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::No usable 'before' commit — seeding anyway."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            src/db/seed/categories.ts \
            src/db/seed/forms.ts \
            src/db/seed/bootstrap-admin.ts \
            src/lib/slugify.ts \
            scripts/db-seed.ts \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: [resolve-target, seed-changed]
    concurrency:
      # One migration at a time, full stop. The seed rides inside this job,
      # so it inherits the lock rather than needing one against it.
      group: migrate
      cancel-in-progress: false
    uses: ./.github/workflows/migrate.yml
    with:
      environment: ${{ needs.resolve-target.outputs.environment }}
      git-branch: ${{ needs.resolve-target.outputs.git_branch }}
      seed-reference: ${{ needs.seed-changed.outputs.changed == 'true' }}
    secrets: inherit

  deploy:
    needs: [resolve-target, migrate]
    # `success()` because a custom `if:` on a job with `needs:` overrides the
    # implicit "needs all succeeded" check — without it a failed migrate would
    # not block deploy at all.
    if: success()
    runs-on: ubuntu-26.04
    # Bare runner, not the `testing` GHCR image the checks use: this needs
    # the Vercel CLI and writes .vercel/output.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: guard
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
        run: |
          if [ -z "$VERCEL_DEPLOY_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets not configured yet (M0.27) — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          # Must match Docker/Dockerfile.node. Node 22 ships npm 10, which
          # cannot read this repo's npm-11 lockfile for typescript@7's
          # per-platform optional deps and fails `npm ci`.
          node-version: 26.6.0
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm install --global vercel@59

      # Two pulls, one per target, because `--git-branch` is legal on exactly
      # one of them.
      #
      # **On preview it is load-bearing.** Vercel resolves a branch-scoped
      # environment variable only when the pull names the branch, and
      # staging's DATABASE_URL is exactly such a variable — the one thing
      # keeping staging off the Neon integration's per-preview ephemeral
      # branches (claude-docs/design-decisions/m1.1-neon-branch-strategy.md).
      # Drop it and nothing fails; the build simply addresses another
      # database, which is why tests/guards/vercel-pull-git-branch.test.ts
      # exists.
      #
      # **On production it is rejected outright**, and passing it broke every
      # production deploy until it was split in two:
      #
      #   Invalid request: `target` must be "preview" when specifying a `gitBranch`
      #
      # Two steps rather than one command with an optional flag: a command
      # that merely *might* carry the flag cannot satisfy the preview half,
      # and a YAML `if:` is data the guard reads where a shell `if` would be a
      # string it had to parse. `== 'preview'` rather than `!= 'production'`
      # so a third environment skips both arms and fails by name rather than
      # pulling the wrong one.
      - name: Pull Vercel environment (preview)
        if: steps.guard.outputs.enabled == 'true' && needs.resolve-target.outputs.environment == 'preview'
        run: vercel pull --yes --environment=preview --git-branch="$GIT_BRANCH" --token="$VERCEL_DEPLOY_TOKEN"
        env:
          # Through env rather than interpolated: a branch name may legally
          # contain shell metacharacters, and a hotfix branch's name arrives
          # from a pull request.
          GIT_BRANCH: ${{ needs.resolve-target.outputs.git_branch }}
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      - name: Pull Vercel environment (production)
        if: steps.guard.outputs.enabled == 'true' && needs.resolve-target.outputs.environment == 'production'
        run: vercel pull --yes --environment=production --token="$VERCEL_DEPLOY_TOKEN"
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      # Put back what the pull could not read. `DATABASE_URL` and
      # `BETTER_AUTH_SECRET` are marked Sensitive in Vercel, and **a Sensitive
      # variable cannot be read back by `vercel pull`** — it writes the
      # literal string `[SENSITIVE]`, with or without `--git-branch`, as a
      # diagnostic run on staging confirmed. No arrangement of flags fixes it.
      #
      # Written INTO the file rather than exported, because `vercel build`
      # reads the file and a step-level `env:` would not reach the Next build.
      # The runtime is untouched — a deployed function reads its environment
      # from the platform.
      #
      # The selection mirrors migrate.yml's, and
      # tests/guards/ci-secret-environments.test.ts holds the two together:
      # choosing differently would migrate one database and serve another.
      - name: Override what the pull could not read
        if: steps.guard.outputs.enabled == 'true'
        env:
          ENV_FILE: .vercel/.env.${{ needs.resolve-target.outputs.environment }}.local
          ENVIRONMENT: ${{ needs.resolve-target.outputs.environment }}
          GIT_BRANCH: ${{ needs.resolve-target.outputs.git_branch }}
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE not found after vercel pull"
            exit 1
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            db_url="$DATABASE_URL_PRODUCTION"
          elif [ "$GIT_BRANCH" = "staging" ]; then
            db_url="$DATABASE_URL_STAGING"
          else
            # A hotfix preview has no named secret: its Neon branch is made
            # per deployment. Leave what the pull carried — the build issues
            # no query, and the assertion below reports what it got.
            db_url=""
          fi

          # Drop the pulled line, append ours. Never echoes a value; an empty
          # secret leaves the pulled value alone rather than blanking it.
          override() {
            key="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "no GitHub secret for $key — leaving whatever the pull carried"
              return 0
            fi
            grep -v "^${key}=" "$ENV_FILE" > "$ENV_FILE.tmp" || true
            mv "$ENV_FILE.tmp" "$ENV_FILE"
            printf '%s="%s"\n' "$key" "$value" >> "$ENV_FILE"
            echo "overrode $key from a GitHub secret"
          }

          override DATABASE_URL "$db_url"
          override BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"

      # Read what the pull returned, before handing it to a build that cannot
      # say. `vercel build` runs `next build` at NODE_ENV=production, which
      # traces /api/auth/[...all] -> src/lib/auth.ts -> src/db/connection.ts:
      # auth.ts throws on an unset secret and connection.ts calls `postgres()`
      # at module scope, parsing its URL eagerly. A missing secret or
      # placeholder URL fails the build either way — the difference is whether
      # the log names the cause or prints a stack trace with the value masked
      # out of it. The script reports every key, classified, never valued,
      # and prints that report even when it is about to fail.
      - name: Assert the pulled environment
        if: steps.guard.outputs.enabled == 'true'
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/assert-pulled-env.ts \
            --file ".vercel/.env.${{ needs.resolve-target.outputs.environment }}.local" \
            --require DATABASE_URL,BETTER_AUTH_SECRET

      # Open the connection before building against it. The assertion above
      # reads the file's SHAPE; this opens what is in it — a URL can be
      # well-formed and still name a deleted Neon branch, a rotated password
      # or a host that no longer resolves, none of which a build notices,
      # because it parses the URL without issuing a query.
      #
      # **Advisory here, and fatal in migrate.yml.** A build genuinely does
      # not need the database, so failing a deploy on a transient blip would
      # trade one outage for another; what the warning buys is that a deploy
      # about to serve 500s says so at build time.
      # tests/guards/database-probe.test.ts asserts the two apart.
      - name: Probe the database
        if: steps.guard.outputs.enabled == 'true'
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/probe-database.ts \
            --file ".vercel/.env.${{ needs.resolve-target.outputs.environment }}.local" \
            --on-failure warn

      - name: Build
        if: steps.guard.outputs.enabled == 'true'
        run: vercel build ${{ needs.resolve-target.outputs.prod_flag }} --token="$VERCEL_DEPLOY_TOKEN"
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      - name: Deploy
        id: deploy
        if: steps.guard.outputs.enabled == 'true'
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          PROD_FLAG: ${{ needs.resolve-target.outputs.prod_flag }}
          GIT_BRANCH: ${{ needs.resolve-target.outputs.git_branch }}
        run: |
          # The --meta pair is the deploy-side half of the --git-branch fix
          # above, and equally load-bearing. The CLI infers a deployment's
          # branch from the local checkout, and actions/checkout leaves a
          # detached HEAD — so without it the deployment has no branch
          # association, and branch association is what makes Vercel resolve
          # branch-scoped Preview variables. --git-branch fixes the BUILD's
          # DATABASE_URL; this fixes the RUNTIME's, which is the one
          # src/db/connection.ts reads. Either alone leaves staging on the
          # integration's Preview-wide value. Production ignores the metadata,
          # so main carries it harmlessly.
          #
          # stdout is always the deployment URL and stderr the build logs —
          # keep them apart, as Vercel's own CI example does.
          if vercel deploy --prebuilt $PROD_FLAG \
              --meta githubDeployment=1 --meta githubCommitRef="$GIT_BRANCH" \
              --token="$VERCEL_DEPLOY_TOKEN" \
              > deploy-url.txt 2> deploy.log; then
            url="$(cat deploy-url.txt)"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Deployed: $url"
            cat deploy.log
          else
            echo "Deploy failed:"
            cat deploy.log
            exit 1
          fi

      - name: Alias
        id: alias
        if: steps.guard.outputs.enabled == 'true' && needs.resolve-target.outputs.alias != ''
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ needs.resolve-target.outputs.alias }}
        run: |
          set -o pipefail
          scope_arg=""
          [ -n "$VERCEL_SCOPE" ] && scope_arg="--scope=$VERCEL_SCOPE"
          if vercel alias set "$DEPLOY_URL" "$ALIAS" --token="$VERCEL_DEPLOY_TOKEN" $scope_arg 2>&1 | tee -a deploy.log; then
            echo "url=https://$ALIAS" >> "$GITHUB_OUTPUT"
            echo "Aliased $ALIAS -> $DEPLOY_URL"
          else
            echo "::error::vercel alias set failed for $ALIAS"
            exit 1
          fi

      - name: Write job summary
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: Deploy (${{ needs.resolve-target.outputs.environment }})
          outcome: ${{ steps.deploy.outcome }}
          log-file: deploy.log
          summary: ${{ steps.deploy.outputs.url && format('Deployed {0}', steps.deploy.outputs.url) || 'Deploy did not complete' }}
          details: "${{ steps.alias.outputs.url && format('Preview: {0}', steps.alias.outputs.url) || '' }}"

      - name: Comment preview URL on PR
        if: >-
          always() && steps.guard.outputs.enabled == 'true' &&
          github.event_name == 'pull_request'
        uses: ./.github/actions/pr-comment
        with:
          check-name: Hotfix preview
          marker-slug: hotfix-preview
          pr-number: ${{ github.event.pull_request.number }}
          outcome: ${{ steps.deploy.outcome }}
          log-file: deploy.log
          success-mode: comment
          summary: ${{ steps.alias.outputs.url || steps.deploy.outputs.url || 'deploy failed' }}

  teardown:
    # A closed hotfix -> main PR, merged or abandoned: drop its preview alias
    # so stale per-hotfix domains do not pile up against the Hobby 50-domain
    # cap. It recomputes the slug from github.head_ref because a closed PR
    # runs no `resolve-target` to read it from.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-26.04
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: guard
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
        run: |
          if [ -z "$VERCEL_DEPLOY_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets not configured yet (M0.27) — skipping teardown."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26.6.0

      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm install --global vercel@59

      - name: Remove preview alias
        if: steps.guard.outputs.enabled == 'true'
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          raw="${HEAD_REF#hotfix/}"
          slug="$(printf '%s' "$raw" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"
          slug="${slug:0:56}"
          slug="${slug%-}"
          scope_arg=""
          [ -n "$VERCEL_SCOPE" ] && scope_arg="--scope=$VERCEL_SCOPE"
          vercel alias rm "hotfix-${slug}.sorrelandsalt.com" --yes --token="$VERCEL_DEPLOY_TOKEN" $scope_arg || {
            echo "::notice::alias hotfix-${slug}.sorrelandsalt.com already gone"
          }
