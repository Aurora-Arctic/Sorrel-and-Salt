name: Deploy

# CLI-driven Vercel deploys. Replaces Vercel's Git integration (which
# vercel.json now disables for every branch) as the thing that ships code —
# see claude-docs/design-decisions/m0.26-*.md.
#
#   push to main            -> vercel deploy --prebuilt --prod (assigns sorrelandsalt.com)
#   push to staging         -> preview deploy, aliased to staging.sorrelandsalt.com
#   PR from hotfix/** -> main -> preview deploy, aliased to a per-hotfix domain
#                          hotfix-<slug>.sorrelandsalt.com, URL posted as a PR
#                          comment; the alias is removed when the PR closes.
#
# Hotfixes deploy on the PR, not on push: an urgent fix wants a review-time
# preview URL its reviewers can click, and it reaches production through its
# own main PR anyway. The hotfix->staging PR the create-pr skill also opens
# is ignored here (trigger is `branches: [main]`) so a hotfix deploys once.
#
# Nothing else deploys: no other branch/PR is in the trigger and the Git
# integration is off. Feature branches are covered by local dev + pr-gate.
#
# pull_request (not pull_request_target) is safe here: hotfix branches live in
# this repo, never a fork, so the secrets below are available and no
# untrusted checkout runs with them.
#
# The VERCEL_* secrets are defined in M0.27's env/secrets matrix and do not
# exist yet. Until they do, the "Check secrets" gate skips every real step and
# the workflow still completes green — the same stub-now/wire-later shape
# pr-gate.yml uses for its vitest/playwright jobs.
#
# `deploy` needs: [resolve-target, migrate] — migrate.yml (M1.4) applies
# pending migrations to the same environment before `deploy` is allowed to
# run, so a failed migration blocks the promotion instead of racing it. It
# also seeds the two reference vocabularies — DESIGN.md §6's categories (M4.3)
# and §5's ingredient forms (M4.3a) — in that same job and only when the push
# actually changed one of them; see the `seed-changed` job.

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  # One run per branch (push) or per PR (hotfix); never cancel one mid-flight
  # — a half-run `vercel deploy`/`alias` can leave an alias pointing at a dead
  # deployment.
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  # Pure string computation shared by `migrate` (needs the target
  # environment) and `deploy` (needs environment, prod_flag, and alias) —
  # split out so migrate.yml can run, and complete, before the deploy job
  # below. No secrets needed here, so it always runs even when the VERCEL_*
  # guard downstream would skip the real work.
  resolve-target:
    # push to main/staging, or an open hotfix -> main PR (not its close event).
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-26.04
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      prod_flag: ${{ steps.target.outputs.prod_flag }}
      alias: ${{ steps.target.outputs.alias }}
    steps:
      - name: Resolve deploy target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # hotfix/<slug> -> hotfix-<sanitised slug>.sorrelandsalt.com, kept
            # inside the 63-char DNS label limit (7 for the "hotfix-" prefix).
            raw="${HEAD_REF#hotfix/}"
            slug="$(printf '%s' "$raw" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"
            slug="${slug:0:56}"
            slug="${slug%-}"
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
            echo "alias=hotfix-${slug}.sorrelandsalt.com" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
            echo "alias=" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
            echo "alias=staging.sorrelandsalt.com" >> "$GITHUB_OUTPUT"
          fi

  # Did this push touch the category seed? The seed is reference data rather
  # than schema, so it has no journal of its own to tell CI what is pending —
  # this diff is that journal, and the answer is an input to `migrate`, which
  # seeds in the same job it migrates in.
  #
  # No `if:` on the job, deliberately. `migrate` needs this output, and a
  # dependency that skips skips its dependents — gating this on
  # `github.event_name == 'push'` would take every hotfix preview deploy down
  # with it. Non-push events answer "no" from inside the step instead.
  seed-changed:
    needs: resolve-target
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Both ends of the comparison below have to be in the clone, and a
          # push can carry more than one commit.
          fetch-depth: 0

      - name: Look for changes to the seed
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Only a push has a `before` to diff against, and staging and
          # production are the two databases the seed is meant to reach anyway
          # — a hotfix preview runs on a disposable Neon branch.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A new branch, or a force-push past what the runner fetched, reports
          # an all-zero `before`. Seed in that case rather than guess: the seed
          # adds only what is missing, so the cost of a false positive is one
          # extra `npm run` and the cost of a false negative is an empty
          # vocabulary in production.
          if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::No usable 'before' commit — seeding anyway."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            src/db/seed/categories.ts \
            src/db/seed/forms.ts \
            src/db/seed/bootstrap-admin.ts \
            src/lib/slugify.ts \
            scripts/db-seed.ts \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: [resolve-target, seed-changed]
    concurrency:
      # One migration at a time, full stop — never let two merges (staging
      # and main, or two rapid staging pushes) apply migrations concurrently.
      # The seed rides inside this job, so it inherits the same lock rather
      # than needing one of its own against it.
      group: migrate
      cancel-in-progress: false
    uses: ./.github/workflows/migrate.yml
    with:
      environment: ${{ needs.resolve-target.outputs.environment }}
      seed-reference: ${{ needs.seed-changed.outputs.changed == 'true' }}
    secrets: inherit

  deploy:
    needs: [resolve-target, migrate]
    # `success()` here because a custom `if:` on a job with `needs:`
    # overrides the implicit "needs all succeeded" check — without it, a
    # failed migrate wouldn't actually block deploy. A failed *seed* blocks it
    # too, since the seed is a step inside that same job.
    if: success()
    runs-on: ubuntu-26.04
    # Bare runner, not the `testing` GHCR image the check workflows use: this
    # job needs the Vercel CLI and writes .vercel/output, neither of which the
    # test image is built for. Same call composite-actions-check.yml made.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: guard
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
        run: |
          if [ -z "$VERCEL_DEPLOY_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets not configured yet (M0.27) — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          # Match Docker/Dockerfile.node and local dev. Node 22 ships npm 10,
          # which can't reconcile the npm-11-generated package-lock.json for
          # typescript@7's per-platform optional deps and fails `npm ci`.
          node-version: 26.6.0
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm install --global vercel@59

      - name: Pull Vercel environment
        if: steps.guard.outputs.enabled == 'true'
        run: vercel pull --yes --environment=${{ needs.resolve-target.outputs.environment }} --token="$VERCEL_DEPLOY_TOKEN"
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      - name: Build
        if: steps.guard.outputs.enabled == 'true'
        run: vercel build ${{ needs.resolve-target.outputs.prod_flag }} --token="$VERCEL_DEPLOY_TOKEN"
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      - name: Deploy
        id: deploy
        if: steps.guard.outputs.enabled == 'true'
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          PROD_FLAG: ${{ needs.resolve-target.outputs.prod_flag }}
        run: |
          # stdout is always the deployment URL; stderr carries build/progress
          # logs — keep them apart (Vercel's own CI example does this).
          if vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_DEPLOY_TOKEN" \
              > deploy-url.txt 2> deploy.log; then
            url="$(cat deploy-url.txt)"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Deployed: $url"
            cat deploy.log
          else
            echo "Deploy failed:"
            cat deploy.log
            exit 1
          fi

      - name: Alias
        id: alias
        if: steps.guard.outputs.enabled == 'true' && needs.resolve-target.outputs.alias != ''
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ needs.resolve-target.outputs.alias }}
        run: |
          set -o pipefail
          scope_arg=""
          [ -n "$VERCEL_SCOPE" ] && scope_arg="--scope=$VERCEL_SCOPE"
          if vercel alias set "$DEPLOY_URL" "$ALIAS" --token="$VERCEL_DEPLOY_TOKEN" $scope_arg 2>&1 | tee -a deploy.log; then
            echo "url=https://$ALIAS" >> "$GITHUB_OUTPUT"
            echo "Aliased $ALIAS -> $DEPLOY_URL"
          else
            echo "::error::vercel alias set failed for $ALIAS"
            exit 1
          fi

      - name: Write job summary
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: Deploy (${{ needs.resolve-target.outputs.environment }})
          outcome: ${{ steps.deploy.outcome }}
          log-file: deploy.log
          summary: ${{ steps.deploy.outputs.url && format('Deployed {0}', steps.deploy.outputs.url) || 'Deploy did not complete' }}
          details: "${{ steps.alias.outputs.url && format('Preview: {0}', steps.alias.outputs.url) || '' }}"

      - name: Comment preview URL on PR
        if: >-
          always() && steps.guard.outputs.enabled == 'true' &&
          github.event_name == 'pull_request'
        uses: ./.github/actions/pr-comment
        with:
          check-name: Hotfix preview
          marker-slug: hotfix-preview
          pr-number: ${{ github.event.pull_request.number }}
          outcome: ${{ steps.deploy.outcome }}
          log-file: deploy.log
          success-mode: comment
          summary: ${{ steps.alias.outputs.url || steps.deploy.outputs.url || 'deploy failed' }}

  teardown:
    # A closed hotfix -> main PR (merged or abandoned): drop its preview alias
    # so stale per-hotfix domains don't pile up against the Hobby 50-domain cap.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-26.04
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: guard
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
        run: |
          if [ -z "$VERCEL_DEPLOY_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets not configured yet (M0.27) — skipping teardown."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26.6.0

      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm install --global vercel@59

      - name: Remove preview alias
        if: steps.guard.outputs.enabled == 'true'
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          raw="${HEAD_REF#hotfix/}"
          slug="$(printf '%s' "$raw" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"
          slug="${slug:0:56}"
          slug="${slug%-}"
          scope_arg=""
          [ -n "$VERCEL_SCOPE" ] && scope_arg="--scope=$VERCEL_SCOPE"
          vercel alias rm "hotfix-${slug}.sorrelandsalt.com" --yes --token="$VERCEL_DEPLOY_TOKEN" $scope_arg || {
            echo "::notice::alias hotfix-${slug}.sorrelandsalt.com already gone"
          }
