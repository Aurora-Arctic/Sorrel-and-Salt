name: Deploy

# The only path that ships code: vercel.json disables Vercel's Git
# integration. claude-docs/ci.md, "Deploy" is the walkthrough.
#
#   push to main               -> production (sorrelandsalt.com)
#   push to staging            -> preview, aliased staging.sorrelandsalt.com
#   PR from hotfix/** -> main  -> preview, aliased hotfix-<slug>.sorrelandsalt.com
#                                 and commented on the PR; removed on close
#
# A hotfix deploys on its PR rather than on push so it has a review-time
# preview URL. `pull_request` rather than `pull_request_target`: hotfix
# branches are never forks. `deploy` needs `migrate`, so a failed migration or
# reference seed blocks the promotion rather than racing it.

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  # Never cancelled mid-flight: a half-run alias can point at a dead deployment.
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  # Shared by `migrate` and `deploy`; needs no secrets.
  resolve-target:
    # push to main/staging, or an open hotfix -> main PR (not its close event).
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-26.04
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      git_branch: ${{ steps.target.outputs.git_branch }}
      prod_flag: ${{ steps.target.outputs.prod_flag }}
      alias: ${{ steps.target.outputs.alias }}
    steps:
      - name: Resolve deploy target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # 56 chars: the 63-char DNS label minus the `hotfix-` prefix.
            raw="${HEAD_REF#hotfix/}"
            slug="$(printf '%s' "$raw" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"
            slug="${slug:0:56}"
            slug="${slug%-}"
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "git_branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
            echo "alias=hotfix-${slug}.sorrelandsalt.com" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "git_branch=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
            echo "alias=" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "git_branch=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
            echo "alias=staging.sorrelandsalt.com" >> "$GITHUB_OUTPUT"
          fi

  # Whether this push touched a reference seed, for `migrate`. No job-level
  # `if:`: a skipped dependency skips its dependents, which would take every
  # hotfix preview down with it — non-push events answer "no" from the step.
  seed-changed:
    needs: resolve-target
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Both ends of the diff have to be in the clone.
          fetch-depth: 0

      - name: Look for changes to the seed
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Only a push has a `before`; a hotfix preview's database is disposable.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An all-zero or unfetched `before` seeds rather than guesses: the
          # seed is additive, so a false positive costs one extra `npm run`.
          if [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::notice::No usable 'before' commit — seeding anyway."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            src/db/seed/categories.ts \
            src/db/seed/forms.ts \
            src/db/seed/bootstrap-admin.ts \
            src/lib/slugify.ts \
            scripts/db-seed.ts \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: [resolve-target, seed-changed]
    concurrency:
      # One migration at a time; the seed inside inherits the lock.
      group: migrate
      cancel-in-progress: false
    uses: ./.github/workflows/migrate.yml
    with:
      environment: ${{ needs.resolve-target.outputs.environment }}
      git-branch: ${{ needs.resolve-target.outputs.git_branch }}
      seed-reference: ${{ needs.seed-changed.outputs.changed == 'true' }}
    secrets: inherit

  deploy:
    needs: [resolve-target, migrate]
    # `success()`: a custom `if:` on a job with `needs:` replaces the implicit
    # needs-all-succeeded check, so a bare condition would not block on migrate.
    if: success()
    runs-on: ubuntu-26.04
    # Bare runner: this needs the Vercel CLI.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Ahead of the guard, ungated: a local action needs the repo on disk.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check secrets
        id: guard
        uses: ./.github/actions/vercel-secrets-guard
        with:
          token: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          skipping: deploy

      - name: Set up Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          # Must match Docker/Dockerfile.node: Node 22's npm 10 cannot read
          # this npm-11 lockfile.
          node-version: 26.6.0
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm install --global vercel@59

      # Two pulls, one per target: `--git-branch` is what makes Vercel resolve
      # staging's branch-scoped DATABASE_URL on preview, and production
      # rejects the flag outright. Two steps rather than one optional flag so
      # tests/guards/vercel-pull-git-branch.test.ts reads the condition as
      # data; `== 'preview'` so an unknown environment fails by name.
      - name: Pull Vercel environment (preview)
        if: steps.guard.outputs.enabled == 'true' && needs.resolve-target.outputs.environment == 'preview'
        run: vercel pull --yes --environment=preview --git-branch="$GIT_BRANCH" --token="$VERCEL_DEPLOY_TOKEN"
        env:
          # Through env: a hotfix branch name comes from a PR and may carry
          # shell metacharacters.
          GIT_BRANCH: ${{ needs.resolve-target.outputs.git_branch }}
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      - name: Pull Vercel environment (production)
        if: steps.guard.outputs.enabled == 'true' && needs.resolve-target.outputs.environment == 'production'
        run: vercel pull --yes --environment=production --token="$VERCEL_DEPLOY_TOKEN"
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      # DATABASE_URL and BETTER_AUTH_SECRET are Sensitive in Vercel, and
      # `vercel pull` writes the literal `[SENSITIVE]` for those. Written into
      # the file because `vercel build` reads the file, not step `env:`. The
      # selection mirrors migrate.yml's; tests/guards/ci-secret-environments.test.ts
      # holds the two together.
      - name: Override what the pull could not read
        if: steps.guard.outputs.enabled == 'true'
        env:
          ENV_FILE: .vercel/.env.${{ needs.resolve-target.outputs.environment }}.local
          ENVIRONMENT: ${{ needs.resolve-target.outputs.environment }}
          GIT_BRANCH: ${{ needs.resolve-target.outputs.git_branch }}
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE not found after vercel pull"
            exit 1
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            db_url="$DATABASE_URL_PRODUCTION"
          elif [ "$GIT_BRANCH" = "staging" ]; then
            db_url="$DATABASE_URL_STAGING"
          else
            # A hotfix preview has no named secret; leave what the pull carried.
            db_url=""
          fi

          # An empty secret leaves the pulled value alone. Never echoes a value.
          override() {
            key="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "no GitHub secret for $key — leaving whatever the pull carried"
              return 0
            fi
            grep -v "^${key}=" "$ENV_FILE" > "$ENV_FILE.tmp" || true
            mv "$ENV_FILE.tmp" "$ENV_FILE"
            printf '%s="%s"\n' "$key" "$value" >> "$ENV_FILE"
            echo "overrode $key from a GitHub secret"
          }

          override DATABASE_URL "$db_url"
          override BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"

      # `vercel build` fails on a missing secret or placeholder URL with the
      # value masked out of the trace; this names the cause first, and prints
      # a report of every key, never a value.
      - name: Assert the pulled environment
        if: steps.guard.outputs.enabled == 'true'
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/assert-pulled-env.ts \
            --file ".vercel/.env.${{ needs.resolve-target.outputs.environment }}.local" \
            --require DATABASE_URL,BETTER_AUTH_SECRET

      # The assertion reads the file's shape; this opens the connection, which
      # a build never does. Advisory here and fatal in migrate.yml — a build
      # does not need the database, but a deploy about to serve 500s should say
      # so. tests/guards/database-probe.test.ts asserts the two apart.
      - name: Probe the database
        if: steps.guard.outputs.enabled == 'true'
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/probe-database.ts \
            --file ".vercel/.env.${{ needs.resolve-target.outputs.environment }}.local" \
            --on-failure warn

      - name: Build
        if: steps.guard.outputs.enabled == 'true'
        run: vercel build ${{ needs.resolve-target.outputs.prod_flag }} --token="$VERCEL_DEPLOY_TOKEN"
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      - name: Deploy
        id: deploy
        if: steps.guard.outputs.enabled == 'true'
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          PROD_FLAG: ${{ needs.resolve-target.outputs.prod_flag }}
          GIT_BRANCH: ${{ needs.resolve-target.outputs.git_branch }}
        run: |
          # --meta is the runtime half of --git-branch: actions/checkout leaves
          # a detached HEAD, so without it the deployment has no branch
          # association and resolves the Preview-wide DATABASE_URL. Production
          # ignores it. stdout is the URL and stderr the build log; keep them apart.
          if vercel deploy --prebuilt $PROD_FLAG \
              --meta githubDeployment=1 --meta githubCommitRef="$GIT_BRANCH" \
              --token="$VERCEL_DEPLOY_TOKEN" \
              > deploy-url.txt 2> deploy.log; then
            url="$(cat deploy-url.txt)"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Deployed: $url"
            cat deploy.log
          else
            echo "Deploy failed:"
            cat deploy.log
            exit 1
          fi

      - name: Alias
        id: alias
        if: steps.guard.outputs.enabled == 'true' && needs.resolve-target.outputs.alias != ''
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ needs.resolve-target.outputs.alias }}
        run: |
          set -o pipefail
          scope_arg=""
          [ -n "$VERCEL_SCOPE" ] && scope_arg="--scope=$VERCEL_SCOPE"
          if vercel alias set "$DEPLOY_URL" "$ALIAS" --token="$VERCEL_DEPLOY_TOKEN" $scope_arg 2>&1 | tee -a deploy.log; then
            echo "url=https://$ALIAS" >> "$GITHUB_OUTPUT"
            echo "Aliased $ALIAS -> $DEPLOY_URL"
          else
            echo "::error::vercel alias set failed for $ALIAS"
            exit 1
          fi

      - name: Write job summary
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: Deploy (${{ needs.resolve-target.outputs.environment }})
          outcome: ${{ steps.deploy.outcome }}
          log-file: deploy.log
          summary: ${{ steps.deploy.outputs.url && format('Deployed {0}', steps.deploy.outputs.url) || 'Deploy did not complete' }}
          details: "${{ steps.alias.outputs.url && format('Preview: {0}', steps.alias.outputs.url) || '' }}"

      - name: Comment preview URL on PR
        if: >-
          always() && steps.guard.outputs.enabled == 'true' &&
          github.event_name == 'pull_request'
        uses: ./.github/actions/pr-comment
        with:
          check-name: Hotfix preview
          marker-slug: hotfix-preview
          pr-number: ${{ github.event.pull_request.number }}
          outcome: ${{ steps.deploy.outcome }}
          log-file: deploy.log
          success-mode: comment
          summary: ${{ steps.alias.outputs.url || steps.deploy.outputs.url || 'deploy failed' }}

  teardown:
    # A closed hotfix PR, merged or not: drop its alias so per-hotfix domains
    # do not pile up against the Hobby 50-domain cap. Recomputes the slug
    # because a closed PR runs no `resolve-target`.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-26.04
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Only so the guard action resolves — nothing else in this job reads
      # the repo, hence the sparse checkout.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - name: Check secrets
        id: guard
        uses: ./.github/actions/vercel-secrets-guard
        with:
          token: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          skipping: teardown

      - name: Set up Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26.6.0

      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm install --global vercel@59

      - name: Remove preview alias
        if: steps.guard.outputs.enabled == 'true'
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          raw="${HEAD_REF#hotfix/}"
          slug="$(printf '%s' "$raw" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//')"
          slug="${slug:0:56}"
          slug="${slug%-}"
          scope_arg=""
          [ -n "$VERCEL_SCOPE" ] && scope_arg="--scope=$VERCEL_SCOPE"
          vercel alias rm "hotfix-${slug}.sorrelandsalt.com" --yes --token="$VERCEL_DEPLOY_TOKEN" $scope_arg || {
            echo "::notice::alias hotfix-${slug}.sorrelandsalt.com already gone"
          }
