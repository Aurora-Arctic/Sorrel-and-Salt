name: Format Check

# Reusable check that runs Prettier in check mode. Called via
# workflow_call from pr-gate and merge-queue, never triggered directly.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: Set true when called from merge-queue.yml — uses a separate, merge-queue-labeled comment thread and posts only on failure (no minimize-on-success)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user (node, non-root) can't write to the runner's
      # bind-mounted _temp/_runner_file_commands dir, which actions/checkout (and
      # any JS action using core.saveState/setOutput) needs — EACCES otherwise.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # container: jobs default to sh, not bash, unlike normal runs-on jobs —
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container
        # sh (dash) doesn't support `set -o pipefail`, used below.
        shell: bash
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - name: Start timer
        id: timer-start
        uses: ./.github/actions/timer-start

      - name: Run format check
        id: run
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee /app/output.log

      - name: Compute duration
        id: timer
        if: always()
        uses: ./.github/actions/timer-elapsed
        with:
          start: ${{ steps.timer-start.outputs.start }}

      # prettier --check prints one `[warn] <file>` line per non-conforming
      # file plus a trailing summary sentence — count the file lines directly
      # rather than parse the sentence (singular/plural wording differs).
      - name: Summarize output
        id: summarize
        if: always()
        run: |
          files=$(grep -E '^\[warn\] ' /app/output.log | grep -v 'Code style issues found' | wc -l | tr -d ' ' || true)
          if [ "$files" -eq 0 ]; then
            summary="0 files need formatting"
          else
            file_word="files"; verb="need"
            [ "$files" -eq 1 ] && file_word="file" && verb="needs"
            summary="$files $file_word $verb formatting"
          fi
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

          # Collapsible list of non-conforming files (capped, with a pointer
          # to the full raw log below for anything past the cap).
          max=15
          file_list=$(grep -E '^\[warn\] ' /app/output.log | grep -v 'Code style issues found' | sed -E 's/^\[warn\] //' || true)
          delim="ghadelim_$RANDOM$RANDOM"
          {
            echo "details<<$delim"
            if [ -n "$file_list" ]; then
              total=$(echo "$file_list" | wc -l | tr -d ' ')
              echo '<details><summary>Files</summary>'
              echo ''
              echo "$file_list" | head -n "$max" | sed -E 's/^(.*)$/- `\1`/'
              if [ "$total" -gt "$max" ]; then
                echo ''
                echo "*…and $((total - max)) more.*"
              fi
              echo ''
              echo '</details>'
            fi
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          check-name: Format Check
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          duration: ${{ steps.timer.outputs.duration }}
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # Fail-only from pr-gate (resolves a prior failure comment on success),
      # fail-only on a separate merge-queue-labeled thread from merge-queue
      # (no action at all on success) — see .github/actions/pr-comment.
      - name: Comment on PR
        if: always() && inputs.pr-number
        uses: ./.github/actions/pr-comment
        with:
          check-name: Format Check
          marker-slug: format
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: minimize
          duration: ${{ steps.timer.outputs.duration }}
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}
