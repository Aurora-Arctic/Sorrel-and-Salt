name: Build & Audit Check

# Exercises the two reusable check workflows (build, audit) end-to-end,
# independent of pr-gate.yml — so a change to either can be validated on its
# own, without waiting on the full gate. Same shape as
# lint-format-typecheck-check.yml, including its `build-image` job: both call
# build-image.yml for the same content-addressed `testing` image every real
# caller uses. Until MB.15 each built that target ad hoc instead, under a
# `testing:smoke-<run id>` tag never reused across runs — written
# that way at M0.17 only because build-image.yml (M0.24) did not exist yet.
#
# audit.yml's `pr-number` input is required and used unguarded (unlike
# lint/format/typecheck's optional, `if`-guarded one) — it comments on a real
# PR, so the audit job only runs for the `pull_request` trigger, where
# `github.event.pull_request.number` is guaranteed to be set. build has no
# such dependency and runs on both triggers, matching lint-format-typecheck-check.yml.
on:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/audit.yml'
      - '.github/workflows/build-audit-check.yml'
      - '.github/actions/**'
      - 'Docker/Dockerfile.node'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # No caller-side concurrency group — see lint-format-typecheck-check.yml's
  # build-image job for why racing to push an identical tag is harmless.
  build-image:
    uses: ./.github/workflows/build-image.yml

  build:
    needs: build-image
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ needs.build-image.outputs.image }}

  audit:
    if: github.event_name == 'pull_request'
    needs: build-image
    uses: ./.github/workflows/audit.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
