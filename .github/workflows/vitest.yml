name: Vitest

# The Vitest suite with coverage. The story checklist is pr-gate.yml's
# `stories` job.
# workflow_call only, from pr-gate. claude-docs/ci/reusable-checks.md, "Reusable checks" is
# the walkthrough. `services: postgres:` is why the `db` project can run; the
# image is built once by the caller and shared with playwright.yml.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      db-image:
        description: Postgres service image ref to run against (from build-db-image.yml, built once by the caller)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: Set true when called for a merge queue — uses a separate, merge-queue-labeled comment thread and posts only on failure, instead of always commenting pass/fail. Nothing passes it today — merge-queue.yml was deleted with the five check workflows (MB.32) and is restored from git history when M7.A.1 turns the merge queue on.
        required: false
        type: boolean
        default: false
      should-run:
        description: >-
          Set false to skip every job here before it starts, so a run the path
          filter rules out never pulls its container. pr-gate passes this from its
          path-filter output instead of putting an `if:` on the calling job, which
          would report one bare "vitest" check in place of "vitest / vitest"
          (claude-docs/design-decisions/mb.39-job-level-if-and-check-names.md).
          Defaults true so a caller that does no path filtering is unaffected.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  # read: this job pulls images and pushes none.
  packages: read
  pull-requests: write

jobs:
  # Three parts run side by side, then `vitest` merges them. claude-docs/ci/runner-budget.md,
  # "Splitting the Vitest job". The parts and the merge skip together on
  # `should-run`, never one without the others: the thresholds cover the whole
  # tree, so a missing part would fail the merge.
  vitest-dom:
    if: inputs.should-run
    # The `dom` project (happy-dom). No Postgres service: nothing in it reaches a database.
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's file-commands
      # directory; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    env:
      # tests/support/db-global-setup.ts rewrites the database name per worker.
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      # The blob reporter writes this part's results and its coverage map for
      # the `vitest` job to merge. The 80% thresholds are switched off here and
      # applied there: a part covers only its own projects' share of src/.
      - name: Run vitest (dom)
        run: |
          set -o pipefail
          echo "nproc: $(nproc)"
          npx vitest run --project dom --coverage --reporter=blob --outputFile.blob=/app/.reports/blobs/blob-dom.json --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0

      # A failing test still leaves a blob, so the merge job reports it.
      - name: Upload blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-dom
          path: /app/.reports/blobs/
          if-no-files-found: error
          retention-days: 1

  vitest-node:
    if: inputs.should-run
    # The `unit` and `rsc` projects (node). No Postgres service.
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's file-commands
      # directory; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    env:
      # tests/support/db-global-setup.ts rewrites the database name per worker.
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      # The blob reporter writes this part's results and its coverage map for
      # the `vitest` job to merge. The 80% thresholds are switched off here and
      # applied there: a part covers only its own projects' share of src/.
      - name: Run vitest (unit rsc)
        run: |
          set -o pipefail
          echo "nproc: $(nproc)"
          npx vitest run --project unit --project rsc --coverage --reporter=blob --outputFile.blob=/app/.reports/blobs/blob-node.json --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0

      # A failing test still leaves a blob, so the merge job reports it.
      - name: Upload blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-node
          path: /app/.reports/blobs/
          if-no-files-found: error
          retention-days: 1

  vitest-db:
    if: inputs.should-run
    # The `db`, `db-mocking` and `workflow` projects, which build the template database (tests/support/db-global-setup.ts) against the Postgres service.
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's file-commands
      # directory; actions/checkout fails EACCES without it.
      options: --user root
    services:
      # `POSTGRES_*` are inert — PGDATA is populated at image build — and
      # document the credentials enable-extensions.sql bakes in.
      postgres:
        image: ${{ inputs.db-image }}
        env:
          POSTGRES_USER: sorrel
          POSTGRES_PASSWORD: sorrel
          POSTGRES_DB: sorrel
        # Probed every second for the first ten while it starts, not after the
        # first 5s interval, so the job waits on the service rather than the clock.
        options: >-
          --health-cmd="pg_isready -U postgres -d sorrel_template"
          --health-interval=5s
          --health-start-period=10s
          --health-start-interval=1s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    env:
      # tests/support/db-global-setup.ts rewrites the database name per worker.
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      # The blob reporter writes this part's results and its coverage map for
      # the `vitest` job to merge. The 80% thresholds are switched off here and
      # applied there: a part covers only its own projects' share of src/.
      - name: Run vitest (db db-mocking workflow)
        run: |
          set -o pipefail
          echo "nproc: $(nproc)"
          npx vitest run --project db --project db-mocking --project workflow --coverage --reporter=blob --outputFile.blob=/app/.reports/blobs/blob-db.json --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.branches=0 --coverage.thresholds.statements=0

      # A failing test still leaves a blob, so the merge job reports it.
      - name: Upload blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-db
          path: /app/.reports/blobs/
          if-no-files-found: error
          retention-days: 1

  # The required check, "vitest / vitest": the caller's job name, a slash, this
  # one. Keep this job named `vitest`; renaming it needs the ruleset changed.
  vitest:
    needs: [vitest-dom, vitest-node, vitest-db]
    # Run after a failed part too, so the PR comment still appears. A
    # path-filtered run skips the three parts, so it skips this job as well.
    if: ${{ !cancelled() && inputs.should-run }}
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's file-commands
      # directory; actions/checkout fails EACCES without it.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - name: Download blobs
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: /app/.reports/blobs

      # Merges the three results into one run and applies the coverage
      # thresholds over it. Exits non-zero on a failed test in any part, or
      # when a part left no blob (it crashed before writing one).
      - name: Run vitest
        id: run
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ls /app/.reports/blobs
          if [ "$(ls /app/.reports/blobs/blob-*.json | wc -l)" -ne 3 ]; then
            echo "::error::A vitest part left no blob; see its job."
            exit 1
          fi
          npx vitest run --mergeReports /app/.reports/blobs --coverage --reporter=default --reporter=json --outputFile=/app/vitest-results.json 2>&1 | tee /app/output.log

      - name: Summarize output
        id: summarize
        if: ${{ !cancelled() }}
        run: node .github/scripts/summarize-vitest.mjs

      # Not failure-only: a coverage report on every run.
      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: /app/.reports/coverage/
          retention-days: 7

      - name: Write job summary
        if: ${{ !cancelled() }}
        uses: ./.github/actions/job-summary
        with:
          check-name: Vitest
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # .github/actions/pr-comment has the modes.
      - name: Comment on PR
        if: ${{ !cancelled() && inputs.pr-number }}
        uses: ./.github/actions/pr-comment
        with:
          check-name: Vitest
          marker-slug: vitest
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: comment
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}
