name: Vitest

# Reusable check (M1.14) that runs the Vitest unit/component/db test suite
# with coverage. Called via workflow_call from pr-gate and merge-queue,
# never triggered directly. Ported from resume-2026's vitest.yml — the
# workflow_call inputs, container/checkout/timer/summarize/job-summary/
# pr-comment steps, and the coverage-threshold-is-the-exit-code reasoning
# all transfer directly. What's new here, since resume-2026 has no database
# at all, is the `build-db-image` job and the `services: postgres:` block —
# see DESIGN.md §11's CI table ("Actions services: postgres:17, reachable by
# service name from the existing job container:") and
# claude-docs/design-decisions/m1.9-test-db-isolation.md for why the `db`
# project needs a real Postgres rather than SQLite.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: Set true when called from merge-queue.yml — uses a separate, merge-queue-labeled comment thread and posts only on failure, instead of always commenting pass/fail
        required: false
        type: boolean
        default: false
      should-run:
        description: >-
          Set false to skip the actual vitest run while still completing this job
          under its normal name. pr-gate passes this from its path-filter output
          instead of putting an `if:` on the calling job — a job-level `if:` makes
          GitHub report a differently-named, bare check run ("vitest" instead of
          "vitest / vitest") when skipped, which never satisfies the "vitest / vitest"
          required status check and leaves the PR stuck. Defaults true so merge-queue
          (no path filtering) is unaffected.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  # write, not read like lint.yml/typecheck.yml's copy of this block — the
  # build-db-image job below calls build-db-image.yml, which pushes to GHCR
  # and needs packages: write for itself. A reusable workflow can't grant a
  # nested call broader permissions than it was itself given, so `read` here
  # made that inner call a startup_failure (zero jobs even created) the
  # first time pr-gate.yml actually exercised this path.
  packages: write
  pull-requests: write

jobs:
  # Publishes (or reuses, if content-addressed and unchanged) the preseeded
  # Postgres 17 image build-db-image.yml owns, so `vitest`'s `services:`
  # block below always has a real, current image to pull — regardless of
  # whether this specific PR touched src/db/**. Runs unconditionally
  # (not gated on `should-run`) for the same reason pr-gate.yml's
  # `build-image` job does: cheap, and the check below needs its output
  # either way to complete under its normal name.
  build-db-image:
    uses: ./.github/workflows/build-db-image.yml

  vitest:
    needs: build-db-image
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user (node, non-root) can't write to the runner's
      # bind-mounted _temp/_runner_file_commands dir, which actions/checkout (and
      # any JS action using core.saveState/setOutput) needs — EACCES otherwise.
      options: --user root
    services:
      # Reachable by service name ("postgres") from this job's own
      # `container:`, per DESIGN.md §11's CI table. `needs.build-db-image.
      # outputs.image` is the hash tag build-db-image.yml computed and
      # pushed — never reconstructed here. `POSTGRES_*` env vars are inert
      # the same way they are in Docker/docker-compose.yaml's `postgres`
      # service (PGDATA is already populated at image build time, so the
      # entrypoint's first-boot init never runs) — kept only as
      # documentation of the credentials actually baked in
      # (Docker/postgres-init/enable-extensions.sql).
      postgres:
        image: ${{ needs.build-db-image.outputs.image }}
        env:
          POSTGRES_USER: sorrel
          POSTGRES_PASSWORD: sorrel
          POSTGRES_DB: sorrel
        options: >-
          --health-cmd="pg_isready -U postgres -d sorrel_template"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: /app
        # container: jobs default to sh, not bash, unlike normal runs-on jobs —
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container
        # sh (dash) doesn't support `set -o pipefail`, used below.
        shell: bash
    env:
      # Same host/credentials shape Docker/docker-compose.yaml's `app` service
      # uses locally — `postgres` is this job's service container, reachable
      # by name since `vitest` itself runs inside a `container:`.
      # src/test/db-global-setup.ts / db-setup.ts rewrite the database name
      # per worker off this same base URL.
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
    steps:
      - name: Checkout into /app
        if: inputs.should-run
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - name: Start timer
        id: timer-start
        if: inputs.should-run
        uses: ./.github/actions/timer-start

      # @vitest/coverage-v8's coverage.thresholds (vitest.config.mts) fails this
      # command itself when coverage drops below 80% — same exit-code path as a
      # failing test, so steps.run.outcome already reflects combined test+coverage
      # pass/fail with no extra workflow logic needed.
      - name: Run vitest
        id: run
        if: inputs.should-run
        run: |
          set -o pipefail
          npm run test:coverage -- --reporter=default --reporter=json --outputFile=/app/vitest-results.json 2>&1 | tee /app/output.log

      - name: Compute duration
        id: timer
        if: always() && inputs.should-run
        uses: ./.github/actions/timer-elapsed
        with:
          start: ${{ steps.timer-start.outputs.start }}

      - name: Summarize output
        id: summarize
        if: always() && inputs.should-run
        run: node .github/scripts/summarize-vitest.mjs

      # Unlike playwright.yml's report upload, this is deliberately not
      # failure-only — the point is a downloadable coverage report to review/
      # track on every run, pass or fail.
      - name: Upload coverage artifact
        if: always() && inputs.should-run
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: /app/coverage/
          retention-days: 7

      - name: Write job summary
        if: always() && inputs.should-run
        uses: ./.github/actions/job-summary
        with:
          check-name: Vitest
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          duration: ${{ steps.timer.outputs.duration }}
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # Always comments pass/fail from pr-gate; fail-only on a separate
      # merge-queue-labeled thread from merge-queue (no action at all on
      # success) — see .github/actions/pr-comment.
      - name: Comment on PR
        if: always() && inputs.pr-number && inputs.should-run
        uses: ./.github/actions/pr-comment
        with:
          check-name: Vitest
          marker-slug: vitest
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: comment
          duration: ${{ steps.timer.outputs.duration }}
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}
