name: Vitest

# The Vitest suite with coverage, then the acceptance story checklist.
# workflow_call only, from pr-gate. claude-docs/ci.md, "Reusable checks" is
# the walkthrough. `services: postgres:` is why the `db` project can run; the
# image is built once by the caller and shared with playwright.yml.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      db-image:
        description: Postgres service image ref to run against (from build-db-image.yml, built once by the caller)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: Set true when called for a merge queue — uses a separate, merge-queue-labeled comment thread and posts only on failure, instead of always commenting pass/fail. Nothing passes it today — merge-queue.yml was deleted with the five check workflows (MB.32) and is restored from git history when M7.A.1 turns the merge queue on.
        required: false
        type: boolean
        default: false
      should-run:
        description: >-
          Set false to skip the actual vitest run while still completing this job
          under its normal name. pr-gate passes this from its path-filter output
          instead of putting an `if:` on the calling job — a job-level `if:` makes
          GitHub report a differently-named, bare check run ("vitest" instead of
          "vitest / vitest") when skipped, which never satisfies the "vitest / vitest"
          required status check and leaves the PR stuck. Defaults true so a caller
          that does no path filtering is unaffected.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  # read: this job pulls images and pushes none.
  packages: read
  pull-requests: write

jobs:
  vitest:
    runs-on: ubuntu-26.04
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user cannot write the runner's file-commands
      # directory; actions/checkout fails EACCES without it.
      options: --user root
    services:
      # `POSTGRES_*` are inert — PGDATA is populated at image build — and
      # document the credentials enable-extensions.sql bakes in.
      postgres:
        image: ${{ inputs.db-image }}
        env:
          POSTGRES_USER: sorrel
          POSTGRES_PASSWORD: sorrel
          POSTGRES_DB: sorrel
        options: >-
          --health-cmd="pg_isready -U postgres -d sorrel_template"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: /app
        # A `container:` job defaults to sh, which has no `set -o pipefail`.
        shell: bash
    env:
      # tests/support/db-global-setup.ts rewrites the database name per worker.
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
    steps:
      - name: Checkout into /app
        if: inputs.should-run
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      # Coverage thresholds fail this command on the same exit path as a test.
      - name: Run vitest
        id: run
        if: inputs.should-run
        run: |
          set -o pipefail
          npm run test:coverage -- --reporter=default --reporter=json --outputFile=/app/vitest-results.json 2>&1 | tee /app/output.log

      - name: Summarize output
        id: summarize
        if: always() && inputs.should-run
        run: node .github/scripts/summarize-vitest.mjs

      # Its own config and no `--coverage`: a story never moves the 80%
      # threshold. `always()` because the checklist is a progress report; a
      # failing story still fails the job.
      - name: Run acceptance stories
        id: stories
        if: always() && inputs.should-run
        run: |
          set -o pipefail
          npm run test:stories -- --outputFile=/app/stories.json 2>&1 | tee /app/stories.log

      - name: Summarize stories
        id: summarize-stories
        if: always() && inputs.should-run
        run: node .github/scripts/summarize-stories.mjs

      # Not failure-only: a coverage report on every run.
      - name: Upload coverage artifact
        if: always() && inputs.should-run
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: /app/coverage/
          retention-days: 7

      - name: Write job summary
        if: always() && inputs.should-run
        uses: ./.github/actions/job-summary
        with:
          check-name: Vitest
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # Its own section and thread, so the checklist reads on its own.
      - name: Write stories job summary
        if: always() && inputs.should-run
        uses: ./.github/actions/job-summary
        with:
          check-name: Stories
          outcome: ${{ steps.stories.outcome }}
          log-file: /app/stories.log
          summary: ${{ steps.summarize-stories.outputs.summary }}
          details: ${{ steps.summarize-stories.outputs.details }}

      # .github/actions/pr-comment has the modes.
      - name: Comment on PR
        if: always() && inputs.pr-number && inputs.should-run
        uses: ./.github/actions/pr-comment
        with:
          check-name: Vitest
          marker-slug: vitest
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: comment
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      - name: Comment stories on PR
        if: always() && inputs.pr-number && inputs.should-run
        uses: ./.github/actions/pr-comment
        with:
          check-name: Stories
          marker-slug: stories
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.stories.outcome }}
          log-file: /app/stories.log
          success-mode: comment
          summary: ${{ steps.summarize-stories.outputs.summary }}
          details: ${{ steps.summarize-stories.outputs.details }}
