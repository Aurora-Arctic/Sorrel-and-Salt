name: Migrate

# Prepares a target database ahead of a Vercel deploy: applies pending
# Drizzle migrations, then — when `seed-reference` says so — seeds DESIGN.md
# §6's category vocabulary and §5's ingredient forms into the schema those
# migrations just created. Called via workflow_call from deploy.yml, never
# triggered directly, with a `needs:` dependency so `deploy` never promotes a
# build against a schema its migrations have not reached.
#
# The seed is a step here rather than a workflow of its own: it needs exactly
# what the migration needs and nothing else, so a second job would pay for a
# checkout, `npm ci` and the Vercel CLI twice to run one `npm run`, and would
# need its own lock against this one to avoid seeding mid-migration. Sharing
# the job makes that ordering structural. The two still report separately —
# one job summary each — so a failed seed is not read as a failed migration.
#
# `environment` and `git-branch` both come from deploy.yml's resolved target,
# and **the two workflows must resolve DATABASE_URL identically**;
# tests/guards/vercel-pull-git-branch.test.ts and
# tests/guards/ci-secret-environments.test.ts hold them to it.
# claude-docs/ci.md's "Deploy" section is the walkthrough, and
# claude-docs/design-decisions/m1.1-neon-branch-strategy.md is why each
# target resolves to the database it does.
#
# Production alone snapshots before migrating — see claude-docs/ci.md's
# "Neon snapshots" section. Preview never does; a staging or hotfix database
# is already disposable.
on:
  workflow_call:
    inputs:
      environment:
        description: Vercel environment to pull DATABASE_URL for (preview or production)
        required: true
        type: string
      git-branch:
        description: >-
          Git branch the deploy targets, so `vercel pull` resolves the
          branch-scoped environment variables rather than the environment-wide
          ones. Required: a caller that cannot say which branch it is
          migrating cannot be given the right DATABASE_URL, and guessing is
          what MB.27 fixed. Used by the preview pull only — branch-scoped
          overrides are a Preview-only Vercel feature and production rejects
          the flag (MB.45) — but still required of every caller, because one
          that cannot name its branch cannot be trusted with preview either.
        required: true
        type: string
      seed-reference:
        description: >-
          Seed the two reference vocabularies after migrating — DESIGN.md §6's
          categories and §5's ingredient forms. deploy.yml passes true only
          when the push changed a seed's own files — both seeds are additive
          and idempotent, so running them again would be harmless, but
          "harmless" is not a reason to write to production on every merge.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-26.04
    # Bare runner, not the `testing` GHCR image: this needs the Vercel CLI.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: guard
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
        run: |
          if [ -z "$VERCEL_DEPLOY_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets not configured yet (M0.27) — skipping migrate."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          # Must match Docker/Dockerfile.node and deploy.yml — see there.
          node-version: 26.6.0
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm install --global vercel@59

      # Two pulls, one per target. `--git-branch` resolves the branch-scoped
      # DATABASE_URL on preview and is rejected outright on production:
      #
      #   Invalid request: `target` must be "preview" when specifying a `gitBranch`
      #
      # Branch-scoped overrides are Preview-only, so production has nothing to
      # resolve and loses nothing by omitting the flag. Two steps rather than
      # one command with an optional flag, so that
      # tests/guards/vercel-pull-git-branch.test.ts can read the condition as
      # data and pair it with the flags it makes legal.
      - name: Pull Vercel environment (preview)
        if: steps.guard.outputs.enabled == 'true' && inputs.environment == 'preview'
        run: vercel pull --yes --environment=preview --git-branch="$GIT_BRANCH" --token="$VERCEL_DEPLOY_TOKEN"
        env:
          # Through env rather than interpolated: a branch name may legally
          # contain shell metacharacters, and a hotfix branch's name arrives
          # from a pull request.
          GIT_BRANCH: ${{ inputs.git-branch }}
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      - name: Pull Vercel environment (production)
        if: steps.guard.outputs.enabled == 'true' && inputs.environment == 'production'
        run: vercel pull --yes --environment=production --token="$VERCEL_DEPLOY_TOKEN"
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      # Report what the pull returned, before anything consumes it.
      #
      # **Report-only**: DATABASE_URL no longer comes from this file on either
      # long-lived target, so requiring it here would fail on a value nothing
      # reads. The report answers the question CI could not answer at all
      # before — which variables a pull carries, and which came back as
      # `[SENSITIVE]` — and the hotfix-preview arm below still depends on
      # POSTGRES_URL being in here. It never prints a value, which
      # tests/guards/pulled-env-assertion.test.ts asserts rather than assumes.
      - name: Assert the pulled environment
        if: steps.guard.outputs.enabled == 'true'
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/assert-pulled-env.ts \
            --file ".vercel/.env.${{ inputs.environment }}.local"

      # DATABASE_URL comes from a GitHub secret, not from the pull: it is
      # marked Sensitive in Vercel, so `vercel pull` writes the literal string
      # `[SENSITIVE]` in its place, with or without `--git-branch`. That is
      # what the setting means, not a fault to route around, so CI holds its
      # own copy for the two long-lived databases.
      #
      # One secret per target rather than a GitHub Environment, which would
      # need a new workflow_call input, a new resolve-target output and an
      # `environment:` key on two jobs to say what the secret's name says.
      #
      # The fallback covers the one target no static secret can name: a hotfix
      # preview's Neon branch is created per deployment, and the integration
      # writes its string into the pulled file as POSTGRES_URL — which is NOT
      # Sensitive and so can be read. That is why this step reads the file.
      - name: Resolve DATABASE_URL
        if: steps.guard.outputs.enabled == 'true'
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
          ENVIRONMENT: ${{ inputs.environment }}
          GIT_BRANCH: ${{ inputs.git-branch }}
          ENV_FILE: .vercel/.env.${{ inputs.environment }}.local
          RESOLVED_ENV_FILE: ${{ runner.temp }}/resolved.env
        run: |
          # Production is decided by the Vercel environment rather than the
          # branch name — a mis-picked production secret is the failure with
          # no second chance.
          if [ "$ENVIRONMENT" = "production" ]; then
            db_url="$DATABASE_URL_PRODUCTION"
            source="the DATABASE_URL_PRODUCTION secret"
          elif [ "$GIT_BRANCH" = "staging" ]; then
            db_url="$DATABASE_URL_STAGING"
            source="the DATABASE_URL_STAGING secret"
          else
            db_url=$(grep -m1 '^POSTGRES_URL=' "$ENV_FILE" | cut -d '=' -f2- | sed -e 's/^"//' -e 's/"$//')
            source="the pulled POSTGRES_URL (a per-deployment Neon branch)"
          fi

          if [ -z "$db_url" ]; then
            echo "::error::No DATABASE_URL for $ENVIRONMENT / $GIT_BRANCH. A named secret is missing, or the pull carried no POSTGRES_URL."
            exit 1
          fi

          echo "::add-mask::$db_url"
          echo "DATABASE_URL=$db_url" >> "$GITHUB_ENV"

          # To a file, because the probe below reads a file path — for the
          # same reason assert-pulled-env.ts does: **argv is visible to `ps`
          # and echoed by `set -x`**, and a step-level `env:` carrying the
          # value is printed in that step's own env block. `umask 077` first,
          # so the file is never briefly world-readable. It lives in
          # RUNNER_TEMP, which the runner deletes with the job, rather than in
          # the workspace, which later steps archive.
          (umask 077 && printf 'DATABASE_URL="%s"\n' "$db_url" > "$RESOLVED_ENV_FILE")

          # Which source won, never the value: every candidate is masked, so
          # the value itself can never tell you which database you migrated.
          echo "Resolved DATABASE_URL from $source"

      # Connect before migrating, so a failure has a cause. **`drizzle-kit
      # migrate` catches whatever postgres.js throws and exits 1 without
      # printing it** — an unreachable host, a wrong password, an `sslmode`
      # mismatch and a `channel_binding` parameter all produce the same
      # spinner frame and the same bare `exit code 1`.
      #
      # It reads the RESOLVED value rather than the pulled file, so it covers
      # whichever source won; tests/guards/database-probe.test.ts asserts that
      # it is pointed there. Fatal here, and advisory in deploy.yml: a
      # migration cannot proceed without a connection, so a probe that warned
      # would leave this job as silent as it was.
      - name: Probe the database
        if: steps.guard.outputs.enabled == 'true'
        env:
          RESOLVED_ENV_FILE: ${{ runner.temp }}/resolved.env
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/probe-database.ts \
            --file "$RESOLVED_ENV_FILE"

      - name: Check Neon secrets
        id: neon-guard
        if: steps.guard.outputs.enabled == 'true' && inputs.environment == 'production'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::Neon secrets not configured yet (M0.27) — skipping pre-migration snapshot."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Snapshot production before migrating
        id: snapshot
        if: steps.neon-guard.outputs.enabled == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -eo pipefail
          branch_name="snapshot-${GITHUB_SHA:0:7}"

          {
            echo "Resolving 'main' branch id..."
            parent_id=$(curl -sf "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              | jq -r '.branches[] | select(.name == "main") | .id')

            if [ -z "$parent_id" ]; then
              echo "No Neon branch named 'main' found in project ${NEON_PROJECT_ID}"
              exit 1
            fi
            echo "main branch id: ${parent_id}"

            echo "Creating snapshot branch ${branch_name}..."
            curl -sf -X POST "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"branch\": {\"name\": \"${branch_name}\", \"parent_id\": \"${parent_id}\"}}"
            echo
            echo "Snapshot branch ${branch_name} created from main, preceding commit ${GITHUB_SHA}."
          } 2>&1 | tee snapshot.log

          echo "branch_name=${branch_name}" >> "$GITHUB_OUTPUT"

      - name: Write snapshot job summary
        if: always() && steps.neon-guard.outputs.enabled == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: Neon snapshot (production)
          outcome: ${{ steps.snapshot.outcome }}
          log-file: snapshot.log
          summary: ${{ steps.snapshot.outcome == 'success' && format('Created {0}', steps.snapshot.outputs.branch_name) || 'Snapshot failed' }}

      - name: Apply pending migrations
        id: migrate
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -o pipefail
          npm run db:migrate 2>&1 | tee migrate.log

      - name: Write job summary
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: Migrate (${{ inputs.environment }})
          outcome: ${{ steps.migrate.outcome }}
          log-file: migrate.log
          summary: ${{ steps.migrate.outcome == 'success' && 'Migrations applied' || 'Migration failed' }}

      # After the migrations, because the tables they write into are the ones
      # those create. This is how the two vocabularies reach staging and
      # production at all: deploys are CI-only and there is no shell on either
      # database, so reference data arrives with the deploy that needs it. One
      # step rather than two — a form vocabulary seeded while the categories
      # failed is not a state worth reporting separately.
      - name: Seed the reference vocabularies
        id: seed
        if: steps.guard.outputs.enabled == 'true' && inputs.seed-reference
        run: |
          set -o pipefail
          npm run db:seed:categories 2>&1 | tee seed.log
          npm run db:seed:forms 2>&1 | tee -a seed.log

      - name: Write seed job summary
        if: always() && steps.guard.outputs.enabled == 'true' && inputs.seed-reference
        uses: ./.github/actions/job-summary
        with:
          check-name: Seed reference data (${{ inputs.environment }})
          outcome: ${{ steps.seed.outcome }}
          log-file: seed.log
          summary: ${{ steps.seed.outcome == 'success' && 'Category and form vocabularies seeded' || 'Seed failed' }}
