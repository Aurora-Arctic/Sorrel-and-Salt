name: Migrate

# Reusable workflow that prepares a target database ahead of a Vercel deploy:
# it applies pending Drizzle migrations, and then — when `seed-reference`
# says so — seeds DESIGN.md §6's category vocabulary and §5's ingredient form
# vocabulary into the schema those migrations just created. Called via
# workflow_call from deploy.yml with a
# `needs:` dependency so `deploy` never promotes a build against a schema its
# own migrations haven't reached yet — DESIGN.md §12, "New migrate.yml" row.
#
# The seed is a step here rather than a workflow of its own (M4.3). It needs
# exactly what the migration needs and nothing else — a checkout, `npm ci`,
# the Vercel CLI, and the same pulled `DATABASE_URL` — so a second job would
# pay for all of that twice to run one `npm run`, and would need its own
# concurrency lock against this one to avoid seeding a schema mid-migration.
# Sharing the job makes the ordering structural instead. The two still report
# separately: one job summary each, so a failed seed is not read as a failed
# migration.
#
# `environment` and `git-branch` both match deploy.yml's own resolved
# target: `production`/`main` for a push to main, `preview`/`staging` for a
# push to staging, `preview`/`hotfix/<slug>` for a hotfix -> main PR.
# `vercel pull` resolves the right DATABASE_URL for each — the
# branch-scoped override for staging, the integration's per-deployment
# ephemeral Neon branch for a hotfix preview — see
# claude-docs/design-decisions/m1.1-neon-branch-strategy.md.
#
# The branch is what makes that resolution happen at all (MB.27): a pull
# without --git-branch gets the environment-wide value, so this workflow
# would migrate whichever database the integration last injected while
# deploy.yml served another. M1.1's "Cross-task impact" is the rule — the
# two must resolve DATABASE_URL identically — and
# tests/guards/vercel-pull-git-branch.test.ts holds them to it. Never
# triggered directly, same as checks.yml.
#
# Production only (M1.6): before applying migrations, branch the `main`
# Neon branch as `snapshot-<short sha>` — a known-good point the restore
# runbook (claude-docs/db.md, "Snapshot before production migrations") can
# promote back to if the migration corrupts data. Guarded the same
# stub-now/wire-later way as the Vercel secrets above: NEON_API_KEY /
# NEON_PROJECT_ID don't exist until M0.27 wires up the secrets matrix, so
# the step warns and skips rather than failing the job. Preview never
# snapshots — staging/hotfix databases are already disposable.
on:
  workflow_call:
    inputs:
      environment:
        description: Vercel environment to pull DATABASE_URL for (preview or production)
        required: true
        type: string
      git-branch:
        description: >-
          Git branch the deploy targets, so `vercel pull` resolves the
          branch-scoped environment variables rather than the environment-wide
          ones. Required: a caller that cannot say which branch it is
          migrating cannot be given the right DATABASE_URL, and guessing is
          what MB.27 fixed. Used by the preview pull only — branch-scoped
          overrides are a Preview-only Vercel feature and production rejects
          the flag (MB.45) — but still required of every caller, because one
          that cannot name its branch cannot be trusted with preview either.
        required: true
        type: string
      seed-reference:
        description: >-
          Seed the two reference vocabularies after migrating — DESIGN.md §6's
          categories and §5's ingredient forms. deploy.yml passes true only
          when the push changed a seed's own files — both seeds are additive
          and idempotent, so running them again would be harmless, but
          "harmless" is not a reason to write to production on every merge.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-26.04
    # Bare runner, not the `testing` GHCR image the check workflows use:
    # this job needs the Vercel CLI, same call deploy.yml makes.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: guard
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
        run: |
          if [ -z "$VERCEL_DEPLOY_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets not configured yet (M0.27) — skipping migrate."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          # Match Docker/Dockerfile.node, local dev, and deploy.yml.
          node-version: 26.6.0
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.guard.outputs.enabled == 'true'
        run: npm install --global vercel@59

      # Two pulls, one per target. --git-branch resolves the branch-scoped
      # DATABASE_URL on preview (MB.27) and is rejected outright on production
      # (MB.45):
      #
      #   Invalid request: `target` must be "preview" when specifying a `gitBranch`
      #
      # Branch-scoped overrides are a Preview-only feature, so production has
      # nothing to resolve and loses nothing by omitting the flag. The two arms
      # are steps rather than one command with an optional flag so that
      # tests/guards/vercel-pull-git-branch.test.ts can read the condition as
      # data and pair it with the flags it makes legal.
      - name: Pull Vercel environment (preview)
        if: steps.guard.outputs.enabled == 'true' && inputs.environment == 'preview'
        run: vercel pull --yes --environment=preview --git-branch="$GIT_BRANCH" --token="$VERCEL_DEPLOY_TOKEN"
        env:
          # Quoted and passed through env rather than interpolated: a branch
          # name may legally contain shell metacharacters, and a hotfix
          # branch's name arrives from a pull request.
          GIT_BRANCH: ${{ inputs.git-branch }}
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      - name: Pull Vercel environment (production)
        if: steps.guard.outputs.enabled == 'true' && inputs.environment == 'production'
        run: vercel pull --yes --environment=production --token="$VERCEL_DEPLOY_TOKEN"
        env:
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}

      # MB.46 — the guard below used to be `[ -z "$db_url" ]` and nothing else,
      # so anything non-empty reached drizzle-kit: Vercel's `[SENSITIVE]`
      # placeholder, a quote the `sed` failed to strip, a `psql '…'` wrapper
      # pasted from the Neon console. drizzle-kit then died on `new URL()` with
      # the value masked out of its own stack trace, which is a failure that
      # tells you nothing.
      #
      # The script reads the file itself rather than being handed the value:
      # it never prints a value (asserted, not assumed, in
      # tests/guards/pulled-env-assertion.test.ts), so it is safe to run before
      # the mask exists — and it reports every key it found, which is the half
      # that would have made MB.27's dropped variables visible.
      - name: Assert the pulled environment
        if: steps.guard.outputs.enabled == 'true'
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/assert-pulled-env.ts \
            --file ".vercel/.env.${{ inputs.environment }}.local" \
            --require DATABASE_URL

      - name: Load DATABASE_URL from pulled environment
        if: steps.guard.outputs.enabled == 'true'
        run: |
          env_file=".vercel/.env.${{ inputs.environment }}.local"
          db_url=$(grep -m1 '^DATABASE_URL=' "$env_file" | cut -d '=' -f2- | sed -e 's/^"//' -e 's/"$//')
          echo "::add-mask::$db_url"
          echo "DATABASE_URL=$db_url" >> "$GITHUB_ENV"

      - name: Check Neon secrets
        id: neon-guard
        if: steps.guard.outputs.enabled == 'true' && inputs.environment == 'production'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::Neon secrets not configured yet (M0.27) — skipping pre-migration snapshot."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Snapshot production before migrating
        id: snapshot
        if: steps.neon-guard.outputs.enabled == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -eo pipefail
          branch_name="snapshot-${GITHUB_SHA:0:7}"

          {
            echo "Resolving 'main' branch id..."
            parent_id=$(curl -sf "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              | jq -r '.branches[] | select(.name == "main") | .id')

            if [ -z "$parent_id" ]; then
              echo "No Neon branch named 'main' found in project ${NEON_PROJECT_ID}"
              exit 1
            fi
            echo "main branch id: ${parent_id}"

            echo "Creating snapshot branch ${branch_name}..."
            curl -sf -X POST "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"branch\": {\"name\": \"${branch_name}\", \"parent_id\": \"${parent_id}\"}}"
            echo
            echo "Snapshot branch ${branch_name} created from main, preceding commit ${GITHUB_SHA}."
          } 2>&1 | tee snapshot.log

          echo "branch_name=${branch_name}" >> "$GITHUB_OUTPUT"

      - name: Write snapshot job summary
        if: always() && steps.neon-guard.outputs.enabled == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: Neon snapshot (production)
          outcome: ${{ steps.snapshot.outcome }}
          log-file: snapshot.log
          summary: ${{ steps.snapshot.outcome == 'success' && format('Created {0}', steps.snapshot.outputs.branch_name) || 'Snapshot failed' }}

      - name: Apply pending migrations
        id: migrate
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set -o pipefail
          npm run db:migrate 2>&1 | tee migrate.log

      - name: Write job summary
        if: always() && steps.guard.outputs.enabled == 'true'
        uses: ./.github/actions/job-summary
        with:
          check-name: Migrate (${{ inputs.environment }})
          outcome: ${{ steps.migrate.outcome }}
          log-file: migrate.log
          summary: ${{ steps.migrate.outcome == 'success' && 'Migrations applied' || 'Migration failed' }}

      # M4.3, extended by M4.3a — after the migrations, because the tables they
      # write into are the ones those create. It is how §6's category
      # vocabulary and §5's form vocabulary reach staging and production at
      # all: deploys are CI-only (CLAUDE.md) and there is no shell on either
      # database, so reference data has to arrive with the deploy that needs
      # it. One step rather than two: they share a gate, a log and a summary,
      # and a form vocabulary seeded while the categories failed is not a state
      # worth reporting separately.
      - name: Seed the reference vocabularies
        id: seed
        if: steps.guard.outputs.enabled == 'true' && inputs.seed-reference
        run: |
          set -o pipefail
          npm run db:seed:categories 2>&1 | tee seed.log
          npm run db:seed:forms 2>&1 | tee -a seed.log

      - name: Write seed job summary
        if: always() && steps.guard.outputs.enabled == 'true' && inputs.seed-reference
        uses: ./.github/actions/job-summary
        with:
          check-name: Seed reference data (${{ inputs.environment }})
          outcome: ${{ steps.seed.outcome }}
          log-file: seed.log
          summary: ${{ steps.seed.outcome == 'success' && 'Category and form vocabularies seeded' || 'Seed failed' }}
