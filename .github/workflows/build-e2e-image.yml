name: Build E2E Image

# Builds (or reuses, if unchanged) the dedicated Playwright e2e image
# (Docker/Dockerfile.e2e) and publishes its ref as an output. Called via
# workflow_call from pr-gate, same content-addressed tagging as
# build-image.yml. Its own file rather than a job there because it shares no
# base image with Dockerfile.node — only the tagging convention.
on:
  workflow_call:
    outputs:
      image:
        description: Fully qualified, content-addressed e2e image ref
        value: ${{ jobs.build-e2e-image.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-e2e-image:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute content-addressed image tag
        id: tag
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          hash="${{ hashFiles('Docker/Dockerfile.e2e', 'package-lock.json') }}"
          echo "image=ghcr.io/${repo_lower}/e2e:${hash}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Most pushes touch neither file, so the tag from a prior run usually
      # already exists — skip rather than re-run buildx, and re-download
      # Chromium, to re-push the same content.
      - name: Check if image already exists
        id: check
        run: |
          if docker buildx imagetools inspect ${{ steps.tag.outputs.image }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push e2e image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile.e2e
          # **Explicit, and must stay so.** Dockerfile.e2e has a second
          # (`headed`) stage, and an unqualified build picks the LAST one —
          # so without this line CI would silently publish the display stage.
          target: e2e
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,mode=max,scope=e2e-image
