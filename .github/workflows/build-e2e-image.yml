name: Build E2E Image

# Builds or reuses the Playwright e2e image (Docker/Dockerfile.e2e), through
# the same action as build-image.yml. Its own file because it shares no base
# image.
on:
  workflow_call:
    outputs:
      image:
        description: Fully qualified, content-addressed e2e image ref
        value: ${{ jobs.build-e2e-image.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-e2e-image:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build or reuse the e2e image
        id: image
        uses: ./.github/actions/build-image
        with:
          path: e2e
          content-hash: ${{ hashFiles('Docker/Dockerfile.e2e', 'package-lock.json') }}
          dockerfile: Docker/Dockerfile.e2e
          # Must stay explicit: an unqualified build picks the LAST stage, `headed`.
          target: e2e
          cache-scope: e2e-image
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
