name: probe-plain
on:
  workflow_call:
    inputs:
      run-yes:
        type: boolean
        default: true
      run-no:
        type: boolean
        default: false
jobs:
  plain-yes:
    if: inputs.run-yes
    runs-on: ubuntu-latest
    steps:
      - run: echo yes
  plain-no:
    if: inputs.run-no
    runs-on: ubuntu-latest
    steps:
      - run: echo no
  control-yes:
    runs-on: ubuntu-latest
    steps:
      - if: inputs.run-yes
        run: echo yes
  control-no:
    runs-on: ubuntu-latest
    steps:
      - if: inputs.run-no
        run: echo no
