name: Stories

# The story suite: one browser flow per v1 story, under tests/e2e/stories/,
# tagged @story-N. It has its own workflow, not a job of pr-gate.yml, because
# it is never a required check: scaffolds land red on purpose, and keeping
# it off the merge gate keeps the gate's time down. A story that is flaky
# reads as failing. claude-docs/testing/acceptance.md is the walkthrough.
#
# It calls playwright.yml with `suite: stories`, so the image, database,
# mail inbox and build are the gate suite's by construction.
on:
  pull_request:
    branches:
      - staging
      - main
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'tests/support/**'
      - 'playwright.config.ts'
      - 'playwright.stories.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/stories.yml'
      - '.github/workflows/playwright.yml'
      - '.github/scripts/summarize-stories.mjs'
      - '.github/actions/**'
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: stories-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Both find the content-addressed images the gate already published, and
  # build only if one is missing.
  e2e-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-e2e-image.yml

  db-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-db-image.yml

  stories:
    needs: [e2e-image, db-image]
    # playwright.yml declares pull-requests: write for its PR comment, and a
    # called workflow may not ask for more than its caller grants.
    permissions:
      contents: read
      packages: read
      pull-requests: write
    uses: ./.github/workflows/playwright.yml
    with:
      image: ${{ needs.e2e-image.outputs.image }}
      db-image: ${{ needs.db-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      suite: stories
