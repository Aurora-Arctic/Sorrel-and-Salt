name: PR Title Names Its Tasks

# A merge commit carries its PR's title as the first line of its body, and the
# progress tally reads task ids from there; the PR body never reaches git. This
# fails a PR into `staging` whose title does not open with every task id its
# `Closes #N` lines name. It runs apart from the PR Gate, whose runs stand down
# on a title edit. claude-docs/task-tracking.md, "Progress tally".

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [staging]

permissions:
  contents: read
  issues: read

jobs:
  title:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the title names every task the body closes
        env:
          GH_TOKEN: ${{ github.token }}
          # Env vars, never interpolated into the script: a PR title and body are untrusted text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: node scripts/check-pr-title.mjs
