name: Gitflow Rules

# The source of truth for which branch may PR into which target — a ruleset
# cannot express "only X may merge into Y".
#
#   target `main`        <- `release/MAJOR.MINOR.PATCH` or `hotfix/*`
#   target `staging`     <- `feature/*`, `release/MAJOR.MINOR.PATCH`, `hotfix/*`,
#                           `main-sync/YYYY-MM-DD-HH-MM-SS`, or any branch
#                           when the PR author is `dependabot[bot]`
#   target `release/*`   <- `staging` or `hotfix/*`
#
# Dependabot is checked by PR author, never by branch name, which anyone could
# claim. A merge-queue caller passes `should-run: false`: `merge_group` has
# only a synthetic head ref, but the job must still report under its name.
on:
  workflow_call:
    inputs:
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: Set true when called for a merge queue — uses a separate, merge-queue-labeled comment thread and posts only on failure (no minimize-on-success). Nothing passes it today — merge-queue.yml was deleted with the five check workflows (MB.32) and is restored from git history when M7.A.1 turns the merge queue on.
        required: false
        type: boolean
        default: false
      should-run:
        description: >-
          Set false to skip the actual source->target validation while still completing
          this job under its normal name. A merge-queue caller passes false — merge_group
          events have no real PR source branch to validate, but the job still needs to
          report success so the "gitflow / gitflow" required status check isn't left
          permanently pending. Defaults true so pr-gate (which has a real PR to check)
          is unaffected.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gitflow:
    runs-on: ubuntu-26.04
    steps:
      # The `./.github/actions/...` references resolve against $GITHUB_WORKSPACE.
      - name: Checkout
        if: inputs.should-run
        uses: actions/checkout@v7

      - name: Validate source -> target branch
        id: run
        if: inputs.should-run
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          ACTOR="${{ github.event.pull_request.user.login }}"

          case "$BASE_REF" in
            main)      pattern='^(release/[0-9]+\.[0-9]+\.[0-9]+|hotfix/.+)$' ;;
            staging)   pattern='^(feature/.+|release/[0-9]+\.[0-9]+\.[0-9]+|hotfix/.+|main-sync/[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2})$' ;;
            release/*) pattern='^(staging|hotfix/.+)$' ;;
            *)         pattern='' ;;
          esac

          {
            echo "Source branch: $HEAD_REF"
            echo "Target branch: $BASE_REF"
          } | tee output.log

          if [ "$BASE_REF" = "staging" ] && [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "Dependabot exception: allowing '$HEAD_REF' -> '$BASE_REF'." | tee -a output.log
          elif [ -n "$pattern" ] && ! [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "::error::PRs into '$BASE_REF' must come from a branch matching /$pattern/ (got '$HEAD_REF')." | tee -a output.log
            exit 1
          else
            echo "No Gitflow violation for '$HEAD_REF' -> '$BASE_REF'." | tee -a output.log
          fi

      - name: Write job summary
        if: always() && inputs.should-run
        uses: ./.github/actions/job-summary
        with:
          check-name: Gitflow Rules
          outcome: ${{ steps.run.outcome }}
          log-file: output.log
          summary: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }}

      # .github/actions/pr-comment has the modes.
      - name: Comment on PR
        if: always() && inputs.pr-number && inputs.should-run
        uses: ./.github/actions/pr-comment
        with:
          check-name: Gitflow Rules
          marker-slug: gitflow
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: output.log
          success-mode: minimize
          summary: ${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }}
