name: Dependency Audit

# Reusable, non-blocking check that runs `npm audit` and comments the
# results on the PR. Called via workflow_call from pr-gate only.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on
        required: true
        type: string

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user (node, non-root) can't write to the runner's
      # bind-mounted _temp/_runner_file_commands dir, which actions/checkout (and
      # any JS action using core.saveState/setOutput) needs — EACCES otherwise.
      options: --user root
    defaults:
      run:
        working-directory: /app
    steps:
      - name: Checkout into /app
        uses: Aurora-Arctic/Sorrel-and-Salt/.github/actions/checkout-to-app@main

      - name: Start timer
        id: timer-start
        uses: ./.github/actions/timer-start

      # Non-blocking: npm audit exits non-zero when it finds vulnerabilities, but
      # this check should only report, never fail the PR gate.
      - name: Run npm audit
        continue-on-error: true
        run: npm audit --json > audit-results.json || true

      - name: Compute duration
        id: timer
        if: always()
        uses: ./.github/actions/timer-elapsed
        with:
          start: ${{ steps.timer-start.outputs.start }}

      - name: Comment audit results on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-audit -->';
            const shortSha = context.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const duration = `${{ steps.timer.outputs.duration }}`;
            const meta = [`\`${shortSha}\``, duration, 'non-blocking', `[view run](${runUrl})`]
              .filter(Boolean)
              .join(' · ');

            const severityOrder = ['critical', 'high', 'moderate', 'low', 'info'];
            const severityRank = (severity) => {
              const i = severityOrder.indexOf(severity);
              return i === -1 ? severityOrder.length : i;
            };
            const fixCell = (fixAvailable) => {
              if (fixAvailable === true) return 'Yes';
              if (fixAvailable === false) return 'No';
              if (fixAvailable && typeof fixAvailable === 'object') {
                const { name, version, isSemVerMajor } = fixAvailable;
                return `Yes (${name}@${version}${isSemVerMajor ? ', major' : ''})`;
              }
              return 'No';
            };

            let body;
            try {
              const data = JSON.parse(fs.readFileSync('/app/audit-results.json', 'utf8'));
              const vulns = data.metadata?.vulnerabilities ?? {};
              const total = vulns.total ?? 0;

              if (total === 0) {
                body = `${marker}\n> [!NOTE]\n> ✅ **npm audit passed** — 0 vulnerabilities · ${meta}`;
              } else {
                const severityTable = [
                  '| Severity | Count |',
                  '| --- | --- |',
                  ...severityOrder.map(
                    (s) => `| ${s[0].toUpperCase()}${s.slice(1)} | ${vulns[s] ?? 0} |`,
                  ),
                ].join('\n');

                const packages = Object.values(data.vulnerabilities ?? {}).sort((a, b) => {
                  const rankDiff = severityRank(a.severity) - severityRank(b.severity);
                  return rankDiff !== 0 ? rankDiff : a.name.localeCompare(b.name);
                });

                const max = 20;
                const rows = packages
                  .slice(0, max)
                  .map((p) => `| ${p.name} | ${p.severity} | ${fixCell(p.fixAvailable)} |`);
                const packageTable = [
                  '| Package | Severity | Fix available |',
                  '| --- | --- | --- |',
                  ...rows,
                ].join('\n');
                const more =
                  packages.length > max
                    ? `\n\n*…and ${packages.length - max} more — run \`npm audit\` locally for the rest.*`
                    : '';

                const label = total === 1 ? 'vulnerability' : 'vulnerabilities';
                body =
                  `${marker}\n> [!WARNING]\n> ⚠️ **npm audit found ${total} ${label}** · ${meta}` +
                  `\n\n${severityTable}` +
                  `\n\n<details><summary>Vulnerable packages</summary>\n\n${packageTable}${more}\n\n</details>`;
              }
            } catch (error) {
              body = `${marker}\n> [!WARNING]\n> ⚠️ **npm audit: could not parse audit output** (${error.message}) · ${meta}`;
            }

            const { owner, repo } = context.repo;
            const prNumber = ${{ inputs.pr-number }};
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
            const existing = comments.data.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
