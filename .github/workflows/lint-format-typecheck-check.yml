name: Lint, Format & Typecheck Check

# Exercises the three reusable check workflows (lint, format, typecheck)
# end-to-end, independent of pr-gate.yml — so a change to one of them can be
# validated on its own, without waiting on the full gate.
#
# Each of lint.yml/format.yml/typecheck.yml requires an `image` input to run
# its container: job against, and this workflow supplies the same one every
# real caller does, by calling build-image.yml. Until MB.15 it built the
# `testing` target ad hoc instead, under a `testing:smoke-<run id>` tag
# never reused across runs — written that way at M0.16 only because
# build-image.yml (M0.24) did not exist yet. It does now, so this workflow
# inherits its content-addressed tag and skips the build entirely whenever
# Docker/Dockerfile.node and package-lock.json are unchanged.
on:
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - '.github/workflows/format.yml'
      - '.github/workflows/typecheck.yml'
      - '.github/workflows/lint-format-typecheck-check.yml'
      - '.github/actions/**'
      - 'Docker/Dockerfile.node'
      - '.oxlintrc.json'
      - '.prettierrc'
      - '.prettierignore'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # No caller-side concurrency group, unlike pr-gate.yml's build-image job. A
  # PR touching Dockerfile.node can have this workflow, build-audit-check.yml
  # and pr-gate.yml all racing to push the same content-addressed tag from
  # three separate workflow runs — which is harmless, since identical inputs
  # produce identical content under an identical tag and the shared GHA layer
  # cache makes the losers near-free. A concurrency group would not help
  # anyway: it does not reach across workflow runs.
  build-image:
    uses: ./.github/workflows/build-image.yml

  lint:
    needs: build-image
    uses: ./.github/workflows/lint.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}

  format:
    needs: build-image
    uses: ./.github/workflows/format.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}

  typecheck:
    needs: build-image
    uses: ./.github/workflows/typecheck.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
