name: Lint, Format & Typecheck Check

# Exercises the three newly-ported reusable check workflows (lint, format,
# typecheck) end-to-end, independent of pr-gate.yml (M0.20) — which doesn't
# exist yet — and of the published testing image (build-image.yml, M0.24),
# which doesn't either.
#
# Each of lint.yml/format.yml/typecheck.yml requires an `image` input to run
# its container: job against — normally build-image.yml's content-addressed
# GHCR push, consumed by every caller via `needs.build-image.outputs.image`.
# Reaching ahead to port that reusable workflow here would mean M0.24 either
# redoes this work or inherits a workflow it didn't write against its own
# acceptance criteria (the same reasoning composite-actions-check.yml
# recorded for M0.15). So this workflow builds the same `testing` target
# from Docker/Dockerfile.node directly, ad hoc, and pushes it to GHCR under
# a tag scoped to this workflow run — never reused across runs, unlike the
# real build-image.yml's content-addressed caching.
on:
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - '.github/workflows/format.yml'
      - '.github/workflows/typecheck.yml'
      - '.github/workflows/lint-format-typecheck-check.yml'
      - '.github/actions/**'
      - 'Docker/Dockerfile.node'
      - '.oxlintrc.json'
      - '.prettierrc'
      - '.prettierignore'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute scoped image tag
        id: tag
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo_lower}/testing:smoke-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push testing image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile.node
          target: testing
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    needs: build-image
    uses: ./.github/workflows/lint.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}

  format:
    needs: build-image
    uses: ./.github/workflows/format.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}

  typecheck:
    needs: build-image
    uses: ./.github/workflows/typecheck.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
