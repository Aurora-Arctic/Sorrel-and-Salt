    locator: 'Wikipedia, Saussurea, oldid 1371714029, Pharmacology paragraph: "As the slow-growing wild plant is endangered by collections, a substitute grown in tissue culture has been suggested". The paragraph is about Saussurea lappa, not about snow lotus'
questions:
  - 'Deeper research 2026-10-29. The Wikipedia page (oldid 1371714029) names these species as used. Saussurea lappa: costus root, and a component of the Tibetan medicine Padma 28 (Uses section). Saussurea laniceps, Saussurea involucrata and Saussurea medusa: flowers and stems used in traditional Chinese medicine for rheumatoid arthritis, cough with cold, stomachache, dysmenorrhoea and altitude sickness. Saussurea obvallata (Brahma kamal): offerings to the goddess Nanda Devi in India. The list of species on the page gives Saussurea involucrata as "snow lotus" (Himalaya; Vansemberuu in Mongolia). The page says "Several varieties of snow lotus are used in traditional Tibetan medicine" and does not map the Tibetan use to one species.'
  - 'Deeper research 2026-10-29. Global status of those species. IUCN: no status in the Wikipedia taxoboxes for Saussurea laniceps (oldid 1292199735), Saussurea obvallata (oldid 1370943707), involucrata or medusa, and GBIF returns NOT_EVALUATED for all four (evidence only), so no global EN or CR rating was found for any of them. CITES (Appendices valid from 5 March 2026): the only Saussurea printed is Saussurea costus, Appendix I (p. 66); laniceps, involucrata, medusa and obvallata are not listed. Saussurea lappa is the same plant as Saussurea costus, which Wikipedia (Dolomiaea costus, oldid 1365843603) rates globally Critically Endangered, and is already removed as the entry Costus.'
  - 'Deeper research 2026-10-29. The one endangered sentence on the page is about Saussurea lappa, so it does not apply to the species the snow lotus name points to. The previous row wrongly read it as about the genus; it is corrected above. Separately, Law and Salick 2005 (PNAS 102(29):10218-10220, in the page references) is about human-induced dwarfing of Saussurea laniceps; I did not read it, and it is not an assessment.'
  - 'Recommendation: keep the entry and do not remove it on any status. Name: the genus Saussurea does not match the snow lotus tradition, because the page maps the common name to several species (the page labels Saussurea involucrata "snow lotus" in its species list; it ties no Tibetan use to a single species). Saussurea lappa must not be the species, since it is costus and is removed. I recommend renaming the entry to Saussurea involucrata once a source ties the Chinese or Tibetan use to it, and otherwise keeping the genus. Owner: choose the genus or one named species; I changed nothing in the entry.'
