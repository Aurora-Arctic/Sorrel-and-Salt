entry: botanical/costus-dolomiaea-costus
status: needs-review
questions:
  - Wikipedia's page for Dolomiaea costus (oldid 1365843603) says the plant "has been greatly over-collected and has been placed on Appendix I of CITES", and its taxobox gives conservation status CITES Appendix I. Nothing is recorded as a listing, because the CITES check waits for the official Appendices sweep. The page's IUCN reference is an assessment of Saussurea costus (2015, e.T50126641A50131430), a synonym, so I recorded no IUCN listing. I recommend the owner decide whether an authority maps Saussurea costus to Dolomiaea costus, or leave the assessment out.
  - The page says the root was used in the ketoret, the consecrated incense of the Temple, and was recommended in a hadith as Indian incense. It says nothing about the practice being closed, so nothing is recorded as closed practice.
  - 'The CITES Appendices (valid from 5 March 2026) print "Saussurea costus" in Appendix I (p. 66, Appendix I column, no annotation). They do not print Dolomiaea costus. The entry''s own cited page (Wikipedia, Dolomiaea costus) says the plant was "formerly Saussurea costus" and "has been placed on Appendix I of CITES". Owner: say whether that page is an authority that maps the two names. Recommendation: yes; then record the listing with nameBasis: resolved and remove the entry under the no-endangered-species rule.'
