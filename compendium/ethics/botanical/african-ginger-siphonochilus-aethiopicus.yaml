questions:
  - 'Owner decision 2026-10-29: KEEP. A national rating never removes an entry, so the Critically Endangered A4acd rating of the Red List of South African Plants does not remove African ginger.'
  - 'Deeper research 2026-10-29. Global IUCN Red List: none found. The Wikipedia taxobox (oldid 1373240846) carries no IUCN status, only CITES Appendix II, and GBIF returns NOT_EVALUATED (evidence only). So there is no global IUCN EN or CR rating, and by the rule the entry does not qualify for removal on the IUCN criterion.'
  - 'Deeper research 2026-10-29. The "critically endangered" sentence in the Wikipedia text cites a 2021 review (Adebayo, Amoo, Mokgehle and Aremu, Journal of Ethnopharmacology), which assesses nothing itself. The assessment behind it is the South African national one: Critically Endangered A4acd, assessed 2022/07/20 by Lötter, Burrows and von Staden, recorded above with scope South Africa. The same SANBI page says the plant is not endemic to South Africa and also occurs in Zimbabwe, Malawi, Zambia, Mozambique, Ethiopia, Benin, Niger, Nigeria, Tanzania and northern Ghana, so the national rating is not a rating of the whole species.'
  - 'Deeper research 2026-10-29. Cultivated stock: Wikipedia says "While the plant can be cultivated, some traditional healers believe that only wild-harvested plants have the correct medical properties" (citing Jasson et al. 2023, Horticulturae 9(2):274). That says cultivation is possible, not that the supplied material is cultivated. Wikipedia also says that, because of over-harvesting, the plant is found at around 10% of its historic range (citing the SANBI page).'
  - 'Recommendation: keep the entry. No global EN or CR rating and the CITES listing is Appendix II, so the rule does not remove it. Owner: say whether a national critically endangered rating should also remove an entry. If yes, this entry goes.'
