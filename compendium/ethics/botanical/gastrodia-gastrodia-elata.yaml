  - 'The CITES Appendices (valid from 5 March 2026) list the whole family Orchidaceae in Appendix II: p. 74, "ORCHIDACEAE spp. (Except the species included in Appendix I)", annotation #4. Gastrodia elata is named only inside annotation #4, in its exemption for finished products "derived from artificial propagation, packaged and ready for retail trade of cosmetics containing parts and derivatives of Bletilla striata, Cycnoches cooperi, Gastrodia elata, Phalaenopsis..." (p. 74). Owner: say whether a family-wide listing may be recorded. Recommendation: no listing row for the species; keep this question.'
