closedPractice:
  - tradition: Native American Church
    kind: closed
    quote: We reject the attempts to grasp onto our indigenous ways and deceive the public by claiming them as their own for their own personal enjoyment or for profit.
    source: ict-ncnac-2016
    locator: 'Statement of the National Council of Native American Churches, 13 February 2016, signed by the presidents of the Native American Church of North America, Azzee'' Bee Nahagha of Dine Nation, and the Native American Churches of Oklahoma and South Dakota. The same statement: "We oppose the attempts of non-Natives to come in and misuse government protection of traditional Native American religion to conduct illegal activity that has nothing to do with our traditional ways."'
  - tradition: Native American Church
    kind: closed
    quote: The only plant that serves as a sacrament is Peyote, and without Peyote, indigenous Native American Church ceremonies cannot take place.
    source: narf-ncnac-2016
    locator: NARF's report of the same statement, after "Nothing could be further from the truth."
  - tradition: Native American Church
