    source: chacruna-ipci-open-letter-2021
    locator: 'Open letter of the Indigenous Peyote Conservation Initiative, in which the National Council of Native American Churches and the initiative "ask that Peyote not be decriminalized". The initiative''s Public Statements page (ipci-public-statements) also lists their joint statement of 20 February 2020 on decriminalisation ordinances "as they pertain to Peyote".'
  - tradition: Wixárika
