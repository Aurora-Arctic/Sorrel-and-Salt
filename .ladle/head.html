<!--
  Ladle injects this file's contents just before </head> (see
  node_modules/@ladle/react/lib/cli/vite-plugin/vite-plugin.js).

  The workshop has no next/font, so it loads the two families by name instead;
  .ladle/typography.scss points `--font-body` / `--font-display` at them.
  Weights match src/app/fonts.ts: Cormorant Unicase 500/600/700, Lexend
  variable.

  The one place in the project that talks to fonts.googleapis.com, and
  dev-workshop only — `workshop:build` output is gitignored and never shipped.
  claude-docs/workshop.md, "Stopgaps to unwind".
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@500;600;700&family=Lexend:wght@100..900&display=swap"
/>
