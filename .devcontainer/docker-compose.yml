# Devcontainer overlay, merged on top of ../Docker/docker-compose.yaml by
# devcontainer.json's `dockerComposeFile`. claude-docs/docker.md is the
# walkthrough.
#
# Relative paths resolve against `Docker/`: Compose runs with no
# `--project-directory`, so the first `-f` file's directory wins, and
# `Docker/.env` is auto-loaded for `${...}`.
#
# `devcontainer` mirrors `app` (bind mount, DATABASE_URL,
# postgres health gate) with its own node_modules volume, and lives here so a
# bare `make docker-up` carries nothing editor-specific.

name: sorrel-and-salt

volumes:
  # The container's `npm ci` result. Docker/ensure-deps.sh, the entrypoint
  # below, reinstalls when package-lock.json changes; `make docker-rebuild`
  # also clears it.
  node_modules_devcontainer:

services:
  devcontainer:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      # `development` plus the review tools (difftastic, Plannotator); its own
      # tag, so the `app` service keeps the plain `development` image.
      target: devcontainer
    image: sorrel-node:devcontainer
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_devcontainer:/app/node_modules
      # Claude Code's per-user state, a bind mount to git-ignored Docker/claude-home so it survives `make
      # docker-rebuild`; `initializeCommand` creates it host-side so Compose
      # does not make it root-owned.
      - ./claude-home:/home/node/.claude:cached
      # Plannotator's drafts, plan history and config.json, kept the same way.
      - ./plannotator-home:/home/node/.plannotator:cached
      # Where `npx skills add --global` keeps a skill's files; ~/.claude/skills
      # holds only a link to each, which a rebuild would leave pointing nowhere.
      - ./agents-home:/home/node/.agents:cached
      # Git over SSH with no editor attached. VS Code forwards the host's SSH
      # agent and copies ~/.gitconfig itself; the Dev Containers CLI does
      # neither, so these mounts do it (claude-docs/docker.md, "Without VS Code").
      # Docker Desktop's forwarded agent: the host's loaded keys, never the keys themselves.
      - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock
      # GitHub's published host keys, so the first fetch asks nothing.
      - ./ssh-known-hosts:/etc/ssh/ssh_known_hosts:ro
      # The host's git identity, copied to ~/.gitconfig at start so the copy stays
      # editable. Long syntax so a missing file stops the start instead of
      # Docker creating a directory in its place on the host.
      - type: bind
        source: ${HOME}/.gitconfig
        target: /home/node/.host-gitconfig
        read_only: true
        bind:
          create_host_path: false
    init: true
    tty: true
    # The Plannotator Inbox, for a host with no editor attached. The container
    # side is 43502, the socat forwarder `postStartCommand` starts: the Inbox
    # itself listens on the container's loopback, which a published port never
    # reaches. The host side stays 43501, the address the Inbox accepts.
    # 8001 is the review server `next dev --hostname 0.0.0.0 --port 8001` serves
    # from a worktree; it binds every address, so it needs no forwarder. The
    # `e2e` service publishes 8001 too, so the two cannot run at once.
    ports:
      - '127.0.0.1:43501:43502'
      - '127.0.0.1:8001:8001'
    # ensure-deps.sh first (see Docker/docker-compose.yaml); `entrypoint` clears
    # the image's CMD, so the command is named below.
    entrypoint: ['sh', '/app/Docker/ensure-deps.sh']
    # Idle PID 1; the editor runs `npm run dev` itself. Sticks only because
    # devcontainer.json sets `overrideCommand: false`.
    command: ['sleep', 'infinity']
    environment:
      NODE_ENV: development
      # A failed `npm ci` (offline, say) prints a warning and starts anyway, so
      # the editor still opens; every other service stops on a failed install.
      ENSURE_DEPS_ON_FAILURE: warn
      # Plannotator's daily usage ping, off. Set here and not in the
      # `plannotator` wrapper, so its plugin inside Claude Code reads it too.
      NO_ANON_PING: '1'
      # The forwarded agent mounted above; VS Code, when attached, sets its own.
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      # From `make docker-update-token`, via git-ignored Docker/.env; `:-`
      # keeps a missing file quiet and the CLI falls back to `/login`.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # `GH_TOKEN` is what `gh` reads; set by hand in Docker/.env (see
      # Docker/.env.example).
      GH_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      # Set here only: playwright.config.ts takes its remote-browser branch
      # when this is set, driving `playwright-server` (`make
      # playwright-server-up`) instead of a Chromium Alpine cannot run.
      # `make docker-e2e` and CI never set it.
      PLAYWRIGHT_WS_ENDPOINT: ws://playwright-server:4444/
      # Likewise here only, and read only under E2E_AUDIT=1 (`npm run
      # e2e:audit`): the WebKit, Firefox and phone audit's browsers on
      # `playwright-audit` (`make playwright-audit-up`, M10.25).
      PLAYWRIGHT_AUDIT_WS_ENDPOINT: ws://playwright-audit:4444/
      # Likewise here only: where `npm run lighthouse:seo` finds Chromium's
      # DevTools port, on `lighthouse-chrome` (`make lighthouse-up`, MB.84).
      # `scripts/lighthouse-seo.mjs` turns the name into an IP itself.
      LIGHTHOUSE_CDP_HOST: lighthouse-chrome
      LIGHTHOUSE_CDP_PORT: '9222'
      # As `app`, so `npm run dev` and `npm run e2e` here mail into Mailpit.
      MAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Builds graphify's code graph into git-ignored graphify-out/, then rebuilds
  # it a few seconds after each change. Its first build takes about a minute.
  # The repo is mounted read-only, and graphify-out/ alone is writable;
  # `initializeCommand` creates that folder host-side so Compose does not
  # make it root-owned. No AI model is called: there is no API key here.
  # A failed build is retried three times, then left stopped with its log.
  # The limits are estimates until `docker stats` is recorded in docker.md.
  graphify-watch:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.graphify
    image: sorrel-graphify
    init: true
    restart: on-failure:3
    cpus: 2
    mem_limit: 3g
    environment:
      # graphify sizes its parser pool by the machine's CPU count, not the
      # `cpus` limit, and every worker loads all its parsers.
      GRAPHIFY_MAX_WORKERS: '2'
      # Otherwise each rebuild after the first of the day copies the graph
      # into a dated folder that is never pruned; the graph is rebuilt from
      # source, so the copy saves nothing.
      GRAPHIFY_NO_BACKUP: '1'
    volumes:
      - ..:/app:ro
      - ../graphify-out:/app/graphify-out
    command:
      [
        'sh',
        '-c',
        'graphify extract /app --code-only && graphify cluster-only /app && exec graphify watch /app',
      ]

  # The graph over MCP, at http://graphify:8080/mcp (.mcp.json). No port is
  # published, so only containers on this compose network reach it. It has
  # no API key: it only reads, and what it serves comes from this public
  # repo. Each tool call checks graph.json's modified time and reloads it when
  # `graphify-watch` has rewritten it; before the first build, a call answers
  # "graph.json not found".
  graphify:
    image: sorrel-graphify
    init: true
    cpus: 1
    mem_limit: 1536m
    volumes:
      - ../graphify-out:/data:ro
    command:
      [
        'graphify-mcp',
        '/data/graph.json',
        '--transport',
        'http',
        '--host',
        '0.0.0.0',
        '--port',
        '8080',
      ]
    # Started, not healthy: waiting for the first build would hold up every
    # `docker compose up`, the editor's included, and none of the three
    # services that read the graph needs it to exist when it starts.
    depends_on:
      - graphify-watch

  # The graph's pages for a browser on port 8090, published on the host's
  # loopback only, so nothing else on the network can open them. It also
  # rebuilds the views `graphify watch` does not: the folder tree,
  # /GRAPH_TREE.html, and, from Docker/graphify-views.py, the map of src/ by
  # folder, /view/graph.html, and the wiki of one page per folder,
  # /wiki/index.html. In the `graph-pages` profile, so it starts only when
  # asked for (claude-docs/docker.md); nothing else depends on it.
  # The page server runs in the background of the rebuild loop, and the loop
  # ends when the server does, so a dead server stops the service rather than
  # leaving the views rebuilding for nobody. graphify-out/ is writable for the
  # views; http.server answers only GET and HEAD, so nothing writes through
  # the port.
  # The tree goes to a temporary file first so the page never serves half a
  # copy. The MCP server reads only the full graph.json, which this leaves alone.
  # Each version of graph.json is tried once, so a failing view logs once
  # instead of rerunning every 10 seconds. The first check after a start
  # always rebuilds, so views left stale while it was stopped catch up.
  graphify-pages:
    image: sorrel-graphify
    profiles: ['graph-pages']
    init: true
    restart: on-failure:3
    cpus: 1.25
    mem_limit: 1152m
    working_dir: /app
    volumes:
      - ..:/app:ro
      - ../graphify-out:/app/graphify-out
    ports:
      - '127.0.0.1:8090:8090'
    command:
      - sh
      - -c
      - |
        python -m http.server 8090 --bind 0.0.0.0 --directory graphify-out &
        server="$$!"
        last=""
        while kill -0 "$$server" 2>/dev/null; do
          now="$$(stat -c %Y graphify-out/graph.json 2>/dev/null)"
          if [ -n "$$now" ] && [ "$$now" != "$$last" ]; then
            last="$$now"
            if graphify tree --graph graphify-out/graph.json --output graphify-out/.tree.tmp.html --label 'Sorrel & Salt' > /dev/null && mv graphify-out/.tree.tmp.html graphify-out/GRAPH_TREE.html && python Docker/graphify-views.py graphify-out/graph.json graphify-out; then
              echo "views rebuilt"
            else
              echo "views failed; trying again when graph.json next changes"
            fi
          fi
          sleep 10
        done
        echo "the page server stopped"
        exit 1
    depends_on:
      - graphify-watch
