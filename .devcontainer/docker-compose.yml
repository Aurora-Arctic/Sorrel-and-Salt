# Devcontainer overlay, merged on top of ../Docker/docker-compose.yaml by
# devcontainer.json's `dockerComposeFile`. claude-docs/docker.md is the
# walkthrough.
#
# Relative paths resolve against `Docker/`: Compose runs with no
# `--project-directory`, so the first `-f` file's directory wins, and
# `Docker/.env` is auto-loaded for `${...}`.
#
# `devcontainer` mirrors `app` (build target, bind mount, DATABASE_URL,
# postgres health gate) with its own node_modules volume, and lives here so a
# bare `make docker-up` carries nothing editor-specific.

name: sorrel-and-salt

volumes:
  # The container's `npm ci` result. Docker/ensure-deps.sh, the entrypoint
  # below, reinstalls when package-lock.json changes; `make docker-rebuild`
  # also clears it.
  node_modules_devcontainer:

services:
  devcontainer:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_devcontainer:/app/node_modules
      # Claude Code's per-user state, a bind mount (the only host mount besides
      # /app) to git-ignored Docker/claude-home so it survives `make
      # docker-rebuild`; `initializeCommand` creates it host-side so Compose
      # does not make it root-owned.
      - ./claude-home:/home/node/.claude:cached
    init: true
    tty: true
    # ensure-deps.sh first (see Docker/docker-compose.yaml); `entrypoint` clears
    # the image's CMD, so the command is named below.
    entrypoint: ['sh', '/app/Docker/ensure-deps.sh']
    # Idle PID 1; the editor runs `npm run dev` itself. Sticks only because
    # devcontainer.json sets `overrideCommand: false`.
    command: ['sleep', 'infinity']
    environment:
      NODE_ENV: development
      # A failed `npm ci` (offline, say) prints a warning and starts anyway, so
      # the editor still opens; every other service stops on a failed install.
      ENSURE_DEPS_ON_FAILURE: warn
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      # From `make docker-update-token`, via git-ignored Docker/.env; `:-`
      # keeps a missing file quiet and the CLI falls back to `/login`.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # `GH_TOKEN` is what `gh` reads; set by hand in Docker/.env (see
      # Docker/.env.example).
      GH_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      # Set here only: playwright.config.ts takes its remote-browser branch
      # when this is set, driving `playwright-server` (`make
      # playwright-server-up`) instead of a Chromium Alpine cannot run.
      # `make docker-e2e` and CI never set it.
      PLAYWRIGHT_WS_ENDPOINT: ws://playwright-server:4444/
      # Likewise here only, and read only under E2E_AUDIT=1 (`npm run
      # e2e:audit`): the WebKit, Firefox and phone audit's browsers on
      # `playwright-audit` (`make playwright-audit-up`, M10.25).
      PLAYWRIGHT_AUDIT_WS_ENDPOINT: ws://playwright-audit:4444/
      # Likewise here only: where `npm run lighthouse:seo` finds Chromium's
      # DevTools port, on `lighthouse-chrome` (`make lighthouse-up`, MB.84).
      # `scripts/lighthouse-seo.mjs` turns the name into an IP itself.
      LIGHTHOUSE_CDP_HOST: lighthouse-chrome
      LIGHTHOUSE_CDP_PORT: '9222'
      # As `app`, so `npm run dev` and `npm run e2e` here mail into Mailpit.
      MAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Builds graphify's code graph into git-ignored graphify-out/, then rebuilds
  # it a few seconds after each change. Its first build takes about a minute.
  # The repo is mounted read-only, and graphify-out/ alone is writable;
  # `initializeCommand` creates that folder host-side so Compose does not
  # make it root-owned. No AI model is called: there is no API key here.
  # A failed build is retried three times, then left stopped with its log.
  graphify-watch:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.graphify
    image: sorrel-graphify
    init: true
    restart: on-failure:3
    volumes:
      - ..:/app:ro
      - ../graphify-out:/app/graphify-out
    command:
      [
        'sh',
        '-c',
        'graphify extract /app --code-only && graphify cluster-only /app && exec graphify watch /app',
      ]
    healthcheck:
      test: ['CMD', 'test', '-f', '/app/graphify-out/graph.json']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The graph over MCP, at http://graphify:8080/mcp (.mcp.json). No port is
  # published, so only containers on this compose network reach it. It has
  # no API key: it only reads, and what it serves comes from this public
  # repo. It reloads graph.json itself whenever `graphify-watch` rewrites it.
  graphify:
    image: sorrel-graphify
    init: true
    volumes:
      - ../graphify-out:/data:ro
    command:
      [
        'graphify-mcp',
        '/data/graph.json',
        '--transport',
        'http',
        '--host',
        '0.0.0.0',
        '--port',
        '8080',
      ]
    depends_on:
      graphify-watch:
        condition: service_healthy

  # The graph's pages for a browser: http://localhost:8090/graph.html (the
  # interactive graph) and /GRAPH_REPORT.md. Published on the host's loopback
  # only, so nothing else on the network can open it.
  graphify-web:
    image: sorrel-graphify
    init: true
    volumes:
      - ../graphify-out:/data:ro
    ports:
      - '127.0.0.1:8090:8090'
    command: ['python', '-m', 'http.server', '8090', '--bind', '0.0.0.0', '--directory', '/data']
    depends_on:
      graphify-watch:
        condition: service_healthy

  # Rebuilds the smaller views whenever graph.json changes, which
  # `graphify watch` does not do itself: the folder tree, /GRAPH_TREE.html,
  # and, from Docker/graphify-views.py, the map of src/ by folder,
  # /view/graph.html, and the wiki of one page per folder, /wiki/index.html.
  # The tree goes to a temporary file first so the page never serves half a
  # copy. The MCP server reads only the full graph.json, which this leaves alone.
  graphify-views:
    image: sorrel-graphify
    init: true
    working_dir: /app
    volumes:
      - ..:/app:ro
      - ../graphify-out:/app/graphify-out
    command:
      - sh
      - -c
      - |
        last=""
        while true; do
          now="$$(stat -c %Y graphify-out/graph.json 2>/dev/null)"
          if [ -n "$$now" ] && [ "$$now" != "$$last" ] && graphify tree --graph graphify-out/graph.json --output graphify-out/.tree.tmp.html --label 'Sorrel & Salt' > /dev/null && mv graphify-out/.tree.tmp.html graphify-out/GRAPH_TREE.html && python Docker/graphify-views.py graphify-out/graph.json graphify-out; then
            last="$$now"
            echo "views rebuilt"
          fi
          sleep 10
        done
    depends_on:
      graphify-watch:
        condition: service_healthy
