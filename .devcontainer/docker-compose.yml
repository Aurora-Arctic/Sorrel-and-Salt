# Devcontainer overlay, merged on top of ../Docker/docker-compose.yaml by
# devcontainer.json's `dockerComposeFile`. claude-docs/docker.md is the
# walkthrough.
#
# Relative paths resolve against `Docker/`: Compose runs with no
# `--project-directory`, so the first `-f` file's directory wins, and
# `Docker/.env` is auto-loaded for `${...}`.
#
# `devcontainer` mirrors `app` (build target, bind mount, DATABASE_URL,
# postgres health gate) with its own node_modules volume, and lives here so a
# bare `make docker-up` carries nothing editor-specific.

name: sorrel-and-salt

volumes:
  # The container's `npm ci` result. Docker/ensure-deps.sh, the entrypoint
  # below, reinstalls when package-lock.json changes; `make docker-rebuild`
  # also clears it.
  node_modules_devcontainer:

services:
  devcontainer:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_devcontainer:/app/node_modules
      # Claude Code's per-user state, a bind mount (the only host mount besides
      # /app) to git-ignored Docker/claude-home so it survives `make
      # docker-rebuild`; `initializeCommand` creates it host-side so Compose
      # does not make it root-owned.
      - ./claude-home:/home/node/.claude:cached
    init: true
    tty: true
    # ensure-deps.sh first (see Docker/docker-compose.yaml); `entrypoint` clears
    # the image's CMD, so the command is named below.
    entrypoint: ['sh', '/app/Docker/ensure-deps.sh']
    # Idle PID 1; the editor runs `npm run dev` itself. Sticks only because
    # devcontainer.json sets `overrideCommand: false`.
    command: ['sleep', 'infinity']
    environment:
      NODE_ENV: development
      # A failed `npm ci` (offline, say) prints a warning and starts anyway, so
      # the editor still opens; every other service stops on a failed install.
      ENSURE_DEPS_ON_FAILURE: warn
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      # From `make docker-update-token`, via git-ignored Docker/.env; `:-`
      # keeps a missing file quiet and the CLI falls back to `/login`.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # `GH_TOKEN` is what `gh` reads; set by hand in Docker/.env (see
      # Docker/.env.example).
      GH_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      # Set here only: playwright.config.ts takes its remote-browser branch
      # when this is set, driving `playwright-server` (`make
      # playwright-server-up`) instead of a Chromium Alpine cannot run.
      # `make docker-e2e` and CI never set it.
      PLAYWRIGHT_WS_ENDPOINT: ws://playwright-server:4444/
      # Likewise here only, and read only under E2E_AUDIT=1 (`npm run
      # e2e:audit`): the WebKit, Firefox and phone audit's browsers on
      # `playwright-audit` (`make playwright-audit-up`, M10.25).
      PLAYWRIGHT_AUDIT_WS_ENDPOINT: ws://playwright-audit:4444/
      # Likewise here only: where `npm run lighthouse:seo` finds Chromium's
      # DevTools port, on `lighthouse-chrome` (`make lighthouse-up`, MB.84).
      # `scripts/lighthouse-seo.mjs` turns the name into an IP itself.
      LIGHTHOUSE_CDP_HOST: lighthouse-chrome
      LIGHTHOUSE_CDP_PORT: '9222'
      # As `app`, so `npm run dev` and `npm run e2e` here mail into Mailpit.
      MAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
