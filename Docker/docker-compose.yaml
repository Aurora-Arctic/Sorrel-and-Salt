# The local development stack; claude-docs/docker.md is the walkthrough.
#
#   make docker-up        app + Postgres, migrated and seeded first
#   make docker-workshop  also the Storybook workshop (profile: workshop)
#   make docker-studio    also Drizzle Studio (profile: studio)
#   make docker-jobs      also the job-run viewer (profile: jobs)
#   make docker-e2e       run the Playwright suite once (profile: e2e)
#   make playwright-audit-up  the WebKit/Firefox/phone audit's browsers (profile: audit)
#   make lighthouse-up    the Chromium `npm run lighthouse:seo` drives (profile: audit)
#   make docker-down      stop and remove everything, profiles included
#
# Mailpit comes up with the app: every message the app sends locally lands in
# its UI on :8025 and never leaves the machine.
#
# `name` is pinned: derived from this directory it would be `docker`, which
# another project on the same machine already claims.

name: sorrel-and-salt

volumes:
  # The container's `npm ci` result, shadowing the host's `node_modules`. One
  # per service, never shared: two services populating one fresh volume from
  # their images race. Docker fills a volume from the image only when it is
  # first created, after which it hides a rebuilt image's packages; so
  # Docker/ensure-deps.sh, the entrypoint of every service below that mounts
  # one, runs `npm ci` when package-lock.json has changed. `make
  # docker-rebuild` (`down -v`) still clears them.
  node_modules_app:
  node_modules_workshop:
  node_modules_e2e:
  node_modules_studio:
  node_modules_jobs:
  node_modules_playwright_server:
  node_modules_db_init:

  # Survives `make docker-down`; only `make docker-rebuild` clears it.
  postgres_data:

services:
  postgres:
    # Built locally; the GHCR image build-db-image.yml publishes is for CI.
    build:
      context: ..
      dockerfile: Docker/Dockerfile.postgres
    image: sorrel-postgres
    environment:
      POSTGRES_USER: sorrel
      POSTGRES_PASSWORD: sorrel
      POSTGRES_DB: sorrel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # For the host-side Vitest `db` project.
      - '5432:5432'
    healthcheck:
      # `postgres`/`sorrel_template` are both real in this image; `pg_isready`
      # checks only that the server answers.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sorrel_template']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: migrates, seeds a scenario and exits; `app` waits on it. Not in
  # Docker/postgres-init/ — the seed is TypeScript, and that directory never
  # runs at start anyway since Dockerfile.postgres populates PGDATA at build.
  # Re-runs on every `up`, deliberately: migrations are journal-guarded and
  # scenarios idempotent, so freshly pulled migrations get applied. No profile.
  db-init:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_db_init:/app/node_modules
    init: true
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      # An unrecognised name fails this container, and so `app`, rather than
      # seeding `minimal`.
      SEED_SCENARIO: ${SEED_SCENARIO:-minimal}
    depends_on:
      postgres:
        condition: service_healthy
    # ensure-deps.sh first: see the `volumes:` note above. Setting `entrypoint`
    # clears the image's CMD, so every service below names its `command`.
    entrypoint: ['sh', '/app/Docker/ensure-deps.sh']
    command: ['sh', '-c', 'npm run db:migrate && npm run db:seed']

  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_app:/app/node_modules
    init: true
    tty: true
    ports:
      - '8000:8000'
      # Node inspector; only `npm run dev:debug` listens on it.
      - '9229:9229'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      MAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      # Healthy is not migrated: waiting on the one-shot's exit status also
      # stops `app` on a failed migration.
      db-init:
        condition: service_completed_successfully
    # Same command as the Dockerfile CMD, written out because `entrypoint` clears
    # that CMD. It binds 0.0.0.0:8000, and `next dev` needs no BETTER_AUTH_SECRET.
    entrypoint: ['sh', '/app/Docker/ensure-deps.sh']
    command: ['npm', 'run', 'dev']
    networks:
      default:
        aliases:
          # For URLs a real browser loads: browsers HSTS-preload the `app`
          # gTLD and upgrade `http://app:8000` to https, which fails. Service-
          # to-service traffic keeps using `app`.
          - sorrel-app

  mailpit:
    # The local and e2e inbox: accepts mail over HTTP (`POST /api/v1/send`,
    # src/lib/mail.ts's `mailpit` transport) and delivers none of it. The UI
    # and the REST API tests/e2e/mailpit.ts reads share :8025. No profile.
    image: axllent/mailpit:v1.31.2
    ports:
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  workshop:
    # Opt-in: `make docker-workshop`.
    profiles: ['workshop']
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_workshop:/app/node_modules
    init: true
    tty: true
    ports:
      # Storybook serves the page and its live-reload socket on this one port.
      - '61000:61000' # storybook dev (npm run workshop)
    environment:
      NODE_ENV: development
      # The container's user does not own the host-mounted /app, so git refuses
      # the repo ("dubious ownership"), and Storybook's change detection, which
      # runs `git rev-parse` to mark changed stories, then fails. These three
      # variables trust /app for this container's git only; no config file is written.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
    entrypoint: ['sh', '/app/Docker/ensure-deps.sh']
    # `npm run workshop` already passes `--host 0.0.0.0`, which Storybook needs to
    # be reachable from the host; the Vite dev server under it reloads the page
    # over a websocket on the same port. No file-watch polling is set; the bind
    # mount has not needed it. If edits on the host stop showing up, set
    # CHOKIDAR_USEPOLLING=1 here.
    command: ['npm', 'run', 'workshop']

  studio:
    # Opt-in: `make docker-studio`. Serves data only — the UI at
    # https://local.drizzle.studio connects back to 127.0.0.1:4983.
    # drizzle.config.ts throws on an unset DATABASE_URL, hence the gate.
    profiles: ['studio']
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_studio:/app/node_modules
    init: true
    tty: true
    ports:
      - '4983:4983' # drizzle-kit studio (the `db:studio` script pins it)
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '/app/Docker/ensure-deps.sh']
    # The `db:studio` script passes `--host 0.0.0.0`.
    command: ['npm', 'run', 'db:studio']

  jobs:
    # Opt-in: `make docker-jobs`. The Workflow SDK's page of job runs, read from
    # the run data a local dev server writes under the bind-mounted .next; it only
    # reads, so it can sit beside whichever dev server is running.
    profiles: ['jobs']
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_jobs:/app/node_modules
    init: true
    tty: true
    ports:
      - '3456:3456' # workflow web (npm run jobs:web)
    environment:
      NODE_ENV: development
      WORKFLOW_TARGET_WORLD: local
      WORKFLOW_LOCAL_DATA_DIR: /app/.next/workflow-data
    entrypoint: ['sh', '/app/Docker/ensure-deps.sh']
    # It listens on every interface, so the host reaches it with no host flag.
    command: ['npm', 'run', 'jobs:web']

  e2e:
    # Opt-in, one-shot: `make docker-e2e`. The same image build-e2e-image.yml
    # publishes; the Alpine `development` stage cannot run Chromium.
    profiles: ['e2e']
    build:
      context: ..
      dockerfile: Docker/Dockerfile.e2e
      # Explicit: an unqualified build picks the LAST stage, `headed`.
      target: e2e
    image: sorrel-e2e
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_e2e:/app/node_modules
    init: true
    ports:
      - '8001:8001' # the first worker's next start (production build); tests/e2e/slots.ts
    environment:
      NODE_ENV: test
      CI: 'true'
      # tests/e2e/database.ts swaps the pathname to each worker's sorrel_e2e_<slot>.
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      # The `build` script forces NODE_ENV=production, where Better Auth
      # requires a secret and auth.ts a primary admin address — this one on
      # the reserved `.invalid` domain, so no sign-in can match it.
      BETTER_AUTH_SECRET: local-dev-not-a-real-secret
      ADMIN_BOOTSTRAP_EMAIL: placeholder@admin-bootstrap.invalid
      MAIL_TRANSPORT: mailpit
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    entrypoint: ['sh', '/app/Docker/ensure-deps.sh']
    command: ['npm', 'run', 'e2e']

  playwright-server:
    # A long-lived browser the Alpine devcontainer drives remotely over
    # `ws://playwright-server:4444/`; only .devcontainer/docker-compose.yml
    # sets PLAYWRIGHT_WS_ENDPOINT, so `make docker-e2e` and CI launch locally.
    # On the `e2e` profile so `docker-down` reaches it, but raised on its own
    # by `make playwright-server-up`; see claude-docs/debugging.md. `image:`
    # must differ from `e2e`'s: one tag across two stages is a silent
    # last-build-wins.
    profiles: ['e2e']
    build:
      context: ..
      dockerfile: Docker/Dockerfile.e2e
      target: headed
    image: sorrel-e2e-headed
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_playwright_server:/app/node_modules
    init: true
    # ensure-deps.sh first, which then runs the image's own ENTRYPOINT by its
    # bind-mounted path (so the display bring-up is visible here) and then the
    # command. The browsers live outside `node_modules` (/ms-playwright, in the
    # image), so a Playwright version bump still needs an image rebuild.
    entrypoint: ['sh', '/app/Docker/ensure-deps.sh', '/app/Docker/playwright-entrypoint.sh']
    environment:
      # `docker compose exec` gets the container's initial environment, not
      # the entrypoint's `export DISPLAY`.
      DISPLAY: ':99'
    ports:
      - '4444:4444' # playwright run-server — dialed by the runner, never opened in a browser
      # noVNC: a page you open in a host browser tab.
      - '7900:7900'
    command: ['npx', 'playwright', 'run-server', '--host', '0.0.0.0', '--port', '4444']

  playwright-audit:
    # The audit's browsers (M10.25): WebKit, Firefox and Chromium, from
    # Microsoft's image rather than Dockerfile.e2e, which carries Chromium
    # alone (MB.237). Opt-in on its own profile, `make playwright-audit-up`,
    # and never a CI gate: the owner's call, 2026-10-12. Only the devcontainer
    # dials it, over `ws://playwright-audit:4444/` inside the compose network
    # (.devcontainer/docker-compose.yml sets PLAYWRIGHT_AUDIT_WS_ENDPOINT, read
    # under E2E_AUDIT=1 alone), so no port is published. The tag and the
    # package version are the lockfile's `@playwright/test`, kept in step by
    # hand: a runner and a server on different versions refuse each other.
    # `npx -y`, since inside the image npx would otherwise stop to ask before
    # fetching the package; `ipc: host` is Playwright's own Docker advice for
    # Chromium, which can run out of shared memory without it.
    profiles: ['audit']
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    init: true
    ipc: host
    command: ['npx', '-y', 'playwright@1.64.0', 'run-server', '--host', '0.0.0.0', '--port', '4444']

  lighthouse-chrome:
    # A Chromium with an open DevTools port, for `npm run lighthouse:seo` from
    # the devcontainer (MB.84), because Lighthouse needs a raw DevTools port and
    # the Playwright servers launch Chromium over a pipe, so none is ever open
    # there. On the `audit` profile, raised by `make lighthouse-up` on its own.
    # The same image as `playwright-audit`, so nothing new is pulled.
    #
    # NO PORT IS PUBLISHED, and none may be: DevTools has no authentication, so
    # anything that reaches it controls the browser. It is reachable on the
    # compose network alone, as `lighthouse-chrome:9222`
    # (.devcontainer/docker-compose.yml names it for the devcontainer).
    # Docker/lighthouse-chrome.sh starts Chromium and the forwarder that
    # publishes its loopback-only port on the network; it is bind-mounted, as
    # `playwright-entrypoint.sh` is, so an edit needs no image build.
    profiles: ['audit']
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    init: true
    ipc: host
    volumes:
      - ./lighthouse-chrome.sh:/lighthouse-chrome.sh:ro
    command: ['/lighthouse-chrome.sh']
