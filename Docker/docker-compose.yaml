# The local development stack; claude-docs/docker.md is the walkthrough.
#
#   make docker-up        app + Postgres, migrated and seeded first
#   make docker-workshop  also the Ladle workshop (profile: workshop)
#   make docker-studio    also Drizzle Studio (profile: studio)
#   make docker-e2e       run the Playwright suite once (profile: e2e)
#   make docker-down      stop and remove everything, profiles included
#
# `name` is pinned: derived from this directory it would be `docker`, which
# another project on the same machine already claims.

name: sorrel-and-salt

volumes:
  # The container's `npm ci` result, shadowing the host's `node_modules`. One
  # per service, never shared: two services populating one fresh volume from
  # their images race. Only `make docker-rebuild` (`down -v`) clears them.
  node_modules_app:
  node_modules_workshop:
  node_modules_e2e:
  node_modules_studio:
  node_modules_playwright_server:
  node_modules_db_init:

  # Survives `make docker-down`; only `make docker-rebuild` clears it.
  postgres_data:

services:
  postgres:
    # Built locally; the GHCR image build-db-image.yml publishes is for CI.
    build:
      context: ..
      dockerfile: Docker/Dockerfile.postgres
    image: sorrel-postgres
    environment:
      POSTGRES_USER: sorrel
      POSTGRES_PASSWORD: sorrel
      POSTGRES_DB: sorrel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # For the host-side Vitest `db` project.
      - '5432:5432'
    healthcheck:
      # `postgres`/`sorrel_template` are both real in this image; `pg_isready`
      # checks only that the server answers.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sorrel_template']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: migrates, seeds a scenario and exits; `app` waits on it. Not in
  # Docker/postgres-init/ — the seed is TypeScript, and that directory never
  # runs at start anyway since Dockerfile.postgres populates PGDATA at build.
  # Re-runs on every `up`, deliberately: migrations are journal-guarded and
  # scenarios idempotent, so freshly pulled migrations get applied. No profile.
  db-init:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_db_init:/app/node_modules
    init: true
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      # An unrecognised name fails this container, and so `app`, rather than
      # seeding `minimal`.
      SEED_SCENARIO: ${SEED_SCENARIO:-minimal}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'npm run db:migrate && npm run db:seed']

  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_app:/app/node_modules
    init: true
    tty: true
    ports:
      - '8000:8000'
      # Node inspector; only `npm run dev:debug` listens on it.
      - '9229:9229'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
    depends_on:
      postgres:
        condition: service_healthy
      # Healthy is not migrated: waiting on the one-shot's exit status also
      # stops `app` on a failed migration.
      db-init:
        condition: service_completed_successfully
    # No `command:` — the Dockerfile CMD binds 0.0.0.0:8000, and `next dev`
    # needs no BETTER_AUTH_SECRET.
    networks:
      default:
        aliases:
          # For URLs a real browser loads: browsers HSTS-preload the `app`
          # gTLD and upgrade `http://app:8000` to https, which fails. Service-
          # to-service traffic keeps using `app`.
          - sorrel-app

  workshop:
    # Opt-in: `make docker-workshop`.
    profiles: ['workshop']
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_workshop:/app/node_modules
    init: true
    tty: true
    ports:
      - '61000:61000' # ladle serve (.ladle/config.mjs)
      - '61002:61002' # ladle HMR socket (.ladle/config.mjs)
    environment:
      NODE_ENV: development
    # `ladle serve` binds localhost without `--host 0.0.0.0`.
    command: ['npm', 'run', 'workshop', '--', '--host', '0.0.0.0']

  studio:
    # Opt-in: `make docker-studio`. Serves data only — the UI at
    # https://local.drizzle.studio connects back to 127.0.0.1:4983.
    # drizzle.config.ts throws on an unset DATABASE_URL, hence the gate.
    profiles: ['studio']
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: development
    image: sorrel-node:development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_studio:/app/node_modules
    init: true
    tty: true
    ports:
      - '4983:4983' # drizzle-kit studio (the `db:studio` script pins it)
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
    depends_on:
      postgres:
        condition: service_healthy
    # The `db:studio` script passes `--host 0.0.0.0`.
    command: ['npm', 'run', 'db:studio']

  e2e:
    # Opt-in, one-shot: `make docker-e2e`. The same image build-e2e-image.yml
    # publishes; the Alpine `development` stage cannot run Chromium.
    profiles: ['e2e']
    build:
      context: ..
      dockerfile: Docker/Dockerfile.e2e
      # Explicit: an unqualified build picks the LAST stage, `headed`.
      target: e2e
    image: sorrel-e2e
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_e2e:/app/node_modules
    init: true
    ports:
      - '8001:8001' # next start (production build), matching playwright.config.ts
    environment:
      NODE_ENV: test
      CI: 'true'
      # e2e/database.ts swaps the pathname to sorrel_e2e.
      DATABASE_URL: postgres://sorrel:sorrel@postgres:5432/sorrel
      # The `build` script forces NODE_ENV=production, where Better Auth
      # requires a secret.
      BETTER_AUTH_SECRET: local-dev-not-a-real-secret
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npm', 'run', 'e2e']

  playwright-server:
    # A long-lived browser the Alpine devcontainer drives remotely over
    # `ws://playwright-server:4444/`; only .devcontainer/docker-compose.yml
    # sets PLAYWRIGHT_WS_ENDPOINT, so `make docker-e2e` and CI launch locally.
    # On the `e2e` profile so `docker-down` reaches it, but raised on its own
    # by `make playwright-server-up`; see claude-docs/debugging.md. `image:`
    # must differ from `e2e`'s: one tag across two stages is a silent
    # last-build-wins.
    profiles: ['e2e']
    build:
      context: ..
      dockerfile: Docker/Dockerfile.e2e
      target: headed
    image: sorrel-e2e-headed
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_playwright_server:/app/node_modules
    init: true
    # The image's own ENTRYPOINT, by its bind-mounted path, so the display
    # bring-up is visible here.
    entrypoint: ['/app/Docker/playwright-entrypoint.sh']
    environment:
      # `docker compose exec` gets the container's initial environment, not
      # the entrypoint's `export DISPLAY`.
      DISPLAY: ':99'
    ports:
      - '4444:4444' # playwright run-server — dialed by the runner, never opened in a browser
      # noVNC: a page you open in a host browser tab.
      - '7900:7900'
    command: ['npx', 'playwright', 'run-server', '--host', '0.0.0.0', '--port', '4444']
